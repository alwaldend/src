ansible_user: ansible
ssh_vault_role: src_infra_hermes_ssh
traefik_acme_path: pki/ica_servers/roles/src_infra_hermes_pki_server/acme
traefik_acme_url: "https://vault.alwaldend.com:8200/v1/{{ traefik_acme_path }}/directory"
hermes_domain: hermes.alwaldend.com
hermes_disk: /dev/sdb
hermes_env_override: "{{ lookup('ansible.builtin.env', 'HERMES_ENV') | from_json }}"
traefik_disk: /dev/sdc
ssh_valid_principals:
  - hermes.alwaldend.com

firewall_allow_port_from:
  - src: "any"
    port: 22
    comment: ssh
  - src: "any"
    port: 443
    comment: HTTPS
  - src: "any"
    port: 80
    comment: HTTP
