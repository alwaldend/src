[global]
checkNewVersion = false
sendAnonymousUsage = false

[providers.file]
filename = "{{ traefik_dynamic_config_path }}"

[log]
level = "INFO"

[entryPoints]
[entryPoints.web]
address = ":80"
[entryPoints.web.http.redirections.entryPoint]
to = "websecure"

[entryPoints.websecure]
address = ":443"
asDefault = true
[entryPoints.websecure.http.tls]
certResolver = "default"

[certificatesResolvers.default.acme]
email = "src_infra_openhands@alwaldend.com"
storage = "{{ traefik_data_dir }}/acme_default.json"
caServer = "{{ traefik_acme_url }}"

[certificatesResolvers.default.acme.httpChallenge]
entryPoint = "web"

[certificatesResolvers.default.acme.eab]
kid = "{{ traefik_acme_kid }}"
hmacEncoded = "{{ traefik_acme_hmac }}"
