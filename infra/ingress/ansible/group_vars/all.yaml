ansible_user: ansible
ssh_vault_role: src_infra_ingress_ssh
traefik_acme_url: https://acme-v02.api.letsencrypt.org/directory
traefik_disable_eab: true
ingress_domain: ingress.alwaldend.com
wg_public_keys: "{{ lookup('ansible.builtin.env', 'TF_VAR_wg_public_keys', default=undefined()) | from_json }}"
wg_private_keys: "{{ lookup('ansible.builtin.env', 'TF_VAR_wg_private_keys', default=undefined()) | from_json }}"
wg_preshared_keys: "{{ lookup('ansible.builtin.env', 'TF_VAR_wg_preshared_keys', default=undefined()) | from_json }}"
traefik_services:
  git:
    hostname: git.alwaldend.com
    target: "int.forgejo.alwaldend.com"
  opencanary:
    hostname: opencanary.alwaldend.com
    target: "dc1.opencanary.alwaldend.com:443"
  openhands-canvas:
    hostname: canvas.openhands.alwaldend.com
    target: "dc1.canvas.openhands.alwaldend.com"
  forgejo:
    hostname: forgejo.alwaldend.com
    target: "int.forgejo.alwaldend.com"
  cloud:
    hostname: cloud.alwaldend.com
    target: "dc1.cloud.alwaldend.com:30027"
  t3code-dev1:
    hostname: t3code.dev1.dev.alwaldend.com
    target: "dc1.t3code.dev1.dev.alwaldend.com"
  comfyui-dev1:
    hostname: comfyui.dev1.dev.alwaldend.com
    target: "dc1.comfyui.dev1.dev.alwaldend.com"
  victoria-metrics:
    hostname: victoria-metrics.alwaldend.com
    target: "dc1.victoria-metrics.alwaldend.com"
  vault:
    hostname: vault.alwaldend.com
    port: 8200
    target: "int.vault.alwaldend.com:8200"
wireguard_local_config_paths:
  - files/wireguard/router1.conf
ssh_valid_principals:
  - ingress.alwaldend.com
firewall_allow_port_from:
  - src: "any"
    port: 22
    comment: ssh
  - src: "any"
    port: 443
    comment: HTTPS
  - src: "any"
    port: 8200
    comment: HTTPS (Vault proxy)
  - src: "any"
    port: 80
    comment: HTTP
  - src: "any"
    port: 51820
    comment: Wireguard
  - src: "{{ victoria_metrics_collector_address }}/32"
    port: "{{ traefik_metrics_port }}"
    proto: tcp
    comment: VictoriaMetrics scrape
