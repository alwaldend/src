ansible_user: ansible
ssh_vault_role: src_infra_ingress_ssh
traefik_acme_url: https://acme-v02.api.letsencrypt.org/directory
traefik_disable_eab: true
ingress_domain: ingress.alwaldend.com
ssh_valid_principals:
  - ingress.alwaldend.com
firewall_allow_port_from:
  - src: "any"
    port: 22
    comment: ssh
  - src: "any"
    port: 443
    comment: HTTPS
  - src: "any"
    port: 80
    comment: HTTP
  - src: "any"
    port: 51820
    comment: Wireguard
