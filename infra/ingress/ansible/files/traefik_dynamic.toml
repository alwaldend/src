[tls.options.default.clientAuth]
caFiles = ["{{ traefik_mtls_ca_path }}"]
clientAuthType = "RequireAndVerifyClientCert"

{% for service_name, service in traefik_services.items() %}
[http.serversTransports.{{ service_name }}]
serverName = "{{ service.hostname }}"

[http.routers.{{ service_name }}]
rule = "Host(`{{ service.hostname }}`)"
service = "{{ service_name }}"
tls = { certResolver = "default" }
{% if "port" in service %}
entrypoints = ["{{ service_name }}"]
{% endif %}

[http.services.{{ service_name }}.loadBalancer]
serversTransport = "{{ service_name }}"

[[http.services.{{ service_name }}.loadBalancer.servers]]
url = "https://{{ service.target }}"
{% endfor %}
