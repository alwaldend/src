[global]
checkNewVersion = false
sendAnonymousUsage = false

[providers.file]
filename = "{{ traefik_dynamic_config_path }}"

[log]
level = "INFO"
# filePath = "{{ traefik_log_dir }}/traefik.log"

[entryPoints.web]
address = ":80"
[entryPoints.web.http.redirections.entryPoint]
to = "websecure"

[entryPoints.websecure]
address = ":443"
asDefault = true
[entryPoints.websecure.http.tls]
certResolver = "default"

{% for service_name, service in traefik_services.items() %}
{% if "port" in service %}
[entryPoints.{{ service_name }}]
address = ":{{ service.port }}"
[entryPoints.vault.http.tls]
certResolver = "default"
{% endif %}
{% endfor %}

# [api]
# dashboard = true
# insecure = true

# [accessLog]
# format = "json"
# [accessLog.filters]
# statusCodes = ["200", "400-404", "500-503"]

[certificatesResolvers.default.acme]
email = "src_infra_ingress@alwaldend.com"
storage = "{{ traefik_data_dir }}/acme_vault.json"
caServer = "{{ traefik_acme_url }}"

[certificatesResolvers.default.acme.httpChallenge]
entryPoint = "web"

[tls.stores.default.acme]
resolver = "default"
[tls.stores.default.acme.domain]
main = "{{ ingress_domain }}"
sans = [
  "{{ inventory_hostname }}",
  "*.alwaldend.com",
]
