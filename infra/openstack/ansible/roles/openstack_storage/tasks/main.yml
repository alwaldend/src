---
- name: Install master storage tools
  ansible.builtin.dnf:
    name:
      - dracut
      - lvm2
      - mdadm
      - util-linux
    state: present

- name: Validate Cinder storage settings
  ansible.builtin.assert:
    that:
      - openstack_fast_devices | length == 2
      - openstack_bulk_devices | length == 4
      - openstack_fast_raid_device != openstack_bulk_raid_device
      - openstack_fast_vg != openstack_bulk_vg
      - >-
        (openstack_fast_devices + openstack_bulk_devices)
        | select('match', '^/dev/disk/by-id/[^/]+$')
        | list
        | length == 6
      - >-
        (openstack_fast_devices + openstack_bulk_devices)
        | select('search', 'CHANGE_ME')
        | list
        | length == 0
      - >-
        (openstack_fast_devices + openstack_bulk_devices)
        | unique
        | list
        | length == 6
    fail_msg: >-
      Configure two unique SSD by-id paths, four unique HDD by-id paths, two
      distinct md devices, and two distinct volume groups.

- name: Define Cinder member requirements
  ansible.builtin.set_fact:
    openstack_cinder_members:
      - path: "{{ openstack_fast_devices[0] }}"
        tier: fast
        rota: 0
      - path: "{{ openstack_fast_devices[1] }}"
        tier: fast
        rota: 0
      - path: "{{ openstack_bulk_devices[0] }}"
        tier: bulk
        rota: 1
      - path: "{{ openstack_bulk_devices[1] }}"
        tier: bulk
        rota: 1
      - path: "{{ openstack_bulk_devices[2] }}"
        tier: bulk
        rota: 1
      - path: "{{ openstack_bulk_devices[3] }}"
        tier: bulk
        rota: 1

- name: Inspect configured Cinder member devices
  ansible.builtin.stat:
    path: "{{ item.path }}"
    follow: true
  loop: "{{ openstack_cinder_members }}"
  loop_control:
    label: "{{ item.path }}"
  register: openstack_cinder_member_stats

- name: Require every Cinder member device
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.isblk
    fail_msg: "{{ item.item.path }} does not resolve to a block device."
  loop: "{{ openstack_cinder_member_stats.results }}"
  loop_control:
    label: "{{ item.item.path }}"

- name: Resolve configured Cinder member devices
  ansible.builtin.command:
    argv:
      - readlink
      - --canonicalize-existing
      - "{{ item.path }}"
  loop: "{{ openstack_cinder_members }}"
  loop_control:
    label: "{{ item.path }}"
  register: openstack_cinder_member_realpaths
  changed_when: false

- name: Require unique physical Cinder member devices
  ansible.builtin.assert:
    that:
      - >-
        openstack_cinder_member_realpaths.results
        | map(attribute='stdout')
        | map('trim')
        | unique
        | list
        | length == 6
    fail_msg: >-
      Two configured by-id paths resolve to the same physical device.

- name: Inspect Cinder member media
  ansible.builtin.command:
    argv:
      - lsblk
      - --noheadings
      - --nodeps
      - --output
      - TYPE,ROTA
      - "{{ item.stdout | trim }}"
  loop: "{{ openstack_cinder_member_realpaths.results }}"
  loop_control:
    label: "{{ item.item.path }}"
  register: openstack_cinder_member_media
  changed_when: false

- name: Validate Cinder member media
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - -c
      - >-
        import sys;
        fields = sys.argv[1].split();
        assert len(fields) == 2;
        assert fields[0] == 'disk', 'member is not a whole disk';
        assert int(fields[1]) == int(sys.argv[2]), 'wrong media class'
      - "{{ item.stdout }}"
      - "{{ item.item.item.rota | string }}"
  loop: "{{ openstack_cinder_member_media.results }}"
  loop_control:
    label: "{{ item.item.item.path }}"
  changed_when: false

- name: Inspect configured Cinder RAID devices
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: true
  loop:
    - "{{ openstack_fast_raid_device }}"
    - "{{ openstack_bulk_raid_device }}"
  loop_control:
    label: "{{ item }}"
  register: openstack_cinder_raid_before

- name: Require explicit permission for RAID creation
  ansible.builtin.assert:
    that:
      - openstack_storage_wipe | bool
    fail_msg: >-
      Set openstack_storage_wipe=true before this role creates Cinder arrays.
  when:
    - openstack_manage_storage | bool
    - >-
      openstack_cinder_raid_before.results
      | rejectattr('stat.exists')
      | list
      | length > 0

- name: Inspect raw member topology before RAID creation
  ansible.builtin.command:
    argv:
      - lsblk
      - --json
      - --paths
      - --output
      - NAME,TYPE,MOUNTPOINTS
      - "{{ item.stdout | trim }}"
  loop: "{{ openstack_cinder_member_realpaths.results }}"
  loop_control:
    label: "{{ item.item.path }}"
  register: openstack_cinder_raw_topology
  changed_when: false
  when:
    - openstack_manage_storage | bool
    - >-
      not openstack_cinder_raid_before.results[0].stat.exists
      or not openstack_cinder_raid_before.results[1].stat.exists

- name: Refuse active or partitioned RAID members
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - -c
      - >-
        import json, sys;
        roots = json.loads(sys.argv[1]).get('blockdevices', []);
        assert len(roots) == 1;
        root = roots[0];
        assert root.get('type') == 'disk';
        assert not (root.get('children') or []), 'member has child devices';
        mounts = [value for value in (root.get('mountpoints') or []) if value];
        assert not mounts, 'member is mounted'
      - "{{ item.stdout }}"
  loop: "{{ openstack_cinder_raw_topology.results | default([]) }}"
  loop_control:
    label: "{{ item.item.item.path }}"
  changed_when: false
  when:
    - openstack_manage_storage | bool
    - item.skipped is not defined

- name: Inspect raw member signatures
  ansible.builtin.command:
    argv:
      - wipefs
      - --noheadings
      - --output
      - TYPE
      - "{{ item.stdout | trim }}"
  loop: "{{ openstack_cinder_member_realpaths.results }}"
  loop_control:
    label: "{{ item.item.path }}"
  register: openstack_cinder_member_signatures
  changed_when: false
  when:
    - openstack_manage_storage | bool
    - >-
      not openstack_cinder_raid_before.results[0].stat.exists
      or not openstack_cinder_raid_before.results[1].stat.exists

- name: Refuse unassembled RAID metadata
  ansible.builtin.assert:
    that:
      - "'linux_raid_member' not in item.stdout_lines"
    fail_msg: >-
      {{ item.item.item.path }} contains md metadata while a required array is
      absent. Assemble or recover the old array before this deployment.
  loop: "{{ openstack_cinder_member_signatures.results | default([]) }}"
  loop_control:
    label: "{{ item.item.item.path }}"
  when:
    - openstack_manage_storage | bool
    - item.skipped is not defined

- name: Remove signatures from new RAID members
  ansible.builtin.command:
    argv:
      - wipefs
      - --all
      - "{{ item.stdout | trim }}"
  loop: "{{ openstack_cinder_member_realpaths.results }}"
  loop_control:
    label: "{{ item.item.path }}"
  changed_when: true
  when:
    - openstack_manage_storage | bool
    - openstack_storage_wipe | bool
    - >-
      (item.item.tier == 'fast'
       and not openstack_cinder_raid_before.results[0].stat.exists)
      or
      (item.item.tier == 'bulk'
       and not openstack_cinder_raid_before.results[1].stat.exists)

- name: Create the fast Cinder RAID1 array
  ansible.builtin.command:
    argv:
      - mdadm
      - --create
      - "{{ openstack_fast_raid_device }}"
      - --metadata=1.2
      - --name=cinder-fast
      - --level=1
      - --raid-devices=2
      - --run
      - "{{ openstack_fast_devices[0] }}"
      - "{{ openstack_fast_devices[1] }}"
  changed_when: true
  when:
    - openstack_manage_storage | bool
    - not openstack_cinder_raid_before.results[0].stat.exists

- name: Create the bulk Cinder RAID10 array
  ansible.builtin.command:
    argv:
      - mdadm
      - --create
      - "{{ openstack_bulk_raid_device }}"
      - --metadata=1.2
      - --name=cinder-bulk
      - --level=10
      - --raid-devices=4
      - --run
      - "{{ openstack_bulk_devices[0] }}"
      - "{{ openstack_bulk_devices[1] }}"
      - "{{ openstack_bulk_devices[2] }}"
      - "{{ openstack_bulk_devices[3] }}"
  changed_when: true
  when:
    - openstack_manage_storage | bool
    - not openstack_cinder_raid_before.results[1].stat.exists

- name: Wait for managed Cinder RAID devices
  ansible.builtin.wait_for:
    path: "{{ item }}"
    timeout: 30
  loop:
    - "{{ openstack_fast_raid_device }}"
    - "{{ openstack_bulk_raid_device }}"
  when: openstack_manage_storage | bool

- name: Require both Cinder RAID block devices
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: true
  loop:
    - "{{ openstack_fast_raid_device }}"
    - "{{ openstack_bulk_raid_device }}"
  loop_control:
    label: "{{ item }}"
  register: openstack_cinder_raid_after

- name: Validate required Cinder RAID devices
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.isblk
    fail_msg: >-
      Required array {{ item.item }} is missing. Create it manually or enable
      both master storage flags.
  loop: "{{ openstack_cinder_raid_after.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Resolve Cinder RAID devices
  ansible.builtin.command:
    argv:
      - readlink
      - --canonicalize-existing
      - "{{ item }}"
  loop:
    - "{{ openstack_fast_raid_device }}"
    - "{{ openstack_bulk_raid_device }}"
  loop_control:
    label: "{{ item }}"
  register: openstack_cinder_raid_realpaths
  changed_when: false

- name: Inspect Cinder RAID health
  ansible.builtin.command:
    argv:
      - mdadm
      - --detail
      - --test
      - "{{ item }}"
  loop:
    - "{{ openstack_fast_raid_device }}"
    - "{{ openstack_bulk_raid_device }}"
  loop_control:
    label: "{{ item }}"
  register: openstack_cinder_raid_health
  changed_when: false
  failed_when: false

- name: Require operable Cinder RAID arrays
  ansible.builtin.assert:
    that:
      - item.rc == 0
    fail_msg: "RAID array {{ item.item }} is not operable."
  loop: "{{ openstack_cinder_raid_health.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Read Cinder RAID details
  ansible.builtin.command:
    argv:
      - mdadm
      - --detail
      - --export
      - "{{ item }}"
  loop:
    - "{{ openstack_fast_raid_device }}"
    - "{{ openstack_bulk_raid_device }}"
  loop_control:
    label: "{{ item }}"
  register: openstack_cinder_raid_details
  changed_when: false

- name: Validate Cinder RAID levels, members, and kernel state
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - -c
      - |
        import json
        import os
        import pathlib
        import sys

        raw = json.loads(sys.argv[1])
        arrays = json.loads(sys.argv[2])
        expected = json.loads(sys.argv[3])
        required = [("raid1", 2), ("raid10", 4)]
        parsed = []
        for text in raw:
            values = dict(
                line.split("=", 1)
                for line in text.splitlines()
                if "=" in line
            )
            parsed.append(values)

        assert len(parsed) == 2
        actual_sets = []
        for index, values in enumerate(parsed):
            level, count = required[index]
            assert values.get("MD_LEVEL") == level
            assert int(values.get("MD_DEVICES", 0)) == count
            members = {
                os.path.realpath(value)
                for key, value in values.items()
                if key.startswith("MD_DEVICE_") and key.endswith("_DEV")
            }
            wanted = {
                os.path.realpath(value) for value in expected[index]
            }
            assert members == wanted, "unexpected RAID members"
            actual_sets.append(members)
            md_name = pathlib.Path(os.path.realpath(arrays[index])).name
            md_root = pathlib.Path("/sys/block") / md_name / "md"
            assert (md_root / "degraded").read_text().strip() == "0"
            state = (md_root / "array_state").read_text().strip()
            assert state in {
                "active",
                "active-idle",
                "clean",
                "write-pending",
            }

        assert os.path.realpath(arrays[0]) != os.path.realpath(arrays[1])
        assert actual_sets[0].isdisjoint(actual_sets[1])
      - >-
        {{ openstack_cinder_raid_details.results
           | map(attribute='stdout') | list | to_json }}
      - >-
        {{ openstack_cinder_raid_realpaths.results
           | map(attribute='stdout') | map('trim') | list | to_json }}
      - >-
        {{ [openstack_fast_devices, openstack_bulk_devices] | to_json }}
  changed_when: false

- name: Read persistent Cinder array definitions
  ansible.builtin.command:
    argv:
      - mdadm
      - --detail
      - --brief
      - "{{ item }}"
  loop:
    - "{{ openstack_fast_raid_device }}"
    - "{{ openstack_bulk_raid_device }}"
  loop_control:
    label: "{{ item }}"
  register: openstack_mdadm_definitions
  changed_when: false

- name: Persist Cinder array definitions
  ansible.builtin.blockinfile:
    path: /etc/mdadm.conf
    create: true
    owner: root
    group: root
    mode: "0644"
    marker: "# {mark} infra/openstack Cinder arrays"
    block: >-
      {{ openstack_mdadm_definitions.results
         | map(attribute='stdout') | map('trim') | join('\n') }}
  register: openstack_mdadm_config

- name: Rebuild initramfs after mdadm configuration changes
  ansible.builtin.command:
    argv:
      - dracut
      - --force
  changed_when: true
  when: openstack_mdadm_config.changed

- name: Inspect signatures on Cinder RAID devices
  ansible.builtin.command:
    argv:
      - wipefs
      - --noheadings
      - --output
      - TYPE
      - "{{ item }}"
  loop:
    - "{{ openstack_fast_raid_device }}"
    - "{{ openstack_bulk_raid_device }}"
  loop_control:
    label: "{{ item }}"
  register: openstack_cinder_raid_signatures
  changed_when: false

- name: Refuse unexpected signatures on unmanaged Cinder arrays
  ansible.builtin.assert:
    that:
      - >-
        item.stdout_lines
        | reject('equalto', '')
        | reject('equalto', 'LVM2_member')
        | list
        | length == 0
    fail_msg: >-
      {{ item.item }} contains a non-LVM signature. Remove it only after you
      confirm that the array contains no required data.
  loop: "{{ openstack_cinder_raid_signatures.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: not (openstack_manage_storage | bool)

- name: Remove non-LVM signatures from managed Cinder arrays
  ansible.builtin.command:
    argv:
      - wipefs
      - --all
      - "{{ item.item }}"
  loop: "{{ openstack_cinder_raid_signatures.results }}"
  loop_control:
    label: "{{ item.item }}"
  changed_when: true
  when:
    - openstack_manage_storage | bool
    - openstack_storage_wipe | bool
    - >-
      item.stdout_lines
      | reject('equalto', '')
      | reject('equalto', 'LVM2_member')
      | list
      | length > 0

- name: Create the fast Cinder volume group
  community.general.lvg:
    vg: "{{ openstack_fast_vg }}"
    pvs: "{{ openstack_fast_raid_device }}"
    state: present
  when: openstack_manage_storage | bool

- name: Create the bulk Cinder volume group
  community.general.lvg:
    vg: "{{ openstack_bulk_vg }}"
    pvs: "{{ openstack_bulk_raid_device }}"
    state: present
  when: openstack_manage_storage | bool

- name: Read Cinder physical volume mappings
  ansible.builtin.command:
    argv:
      - pvs
      - --reportformat
      - json
      - --options
      - pv_name,vg_name
  register: openstack_cinder_pvs
  changed_when: false

- name: Validate exact Cinder volume group backing devices
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - -c
      - >-
        import json, os, sys;
        rows = json.loads(sys.argv[1])['report'][0]['pv'];
        expected = {sys.argv[2]: os.path.realpath(sys.argv[3]),
                    sys.argv[4]: os.path.realpath(sys.argv[5])};
        for vg, device in expected.items():
            pvs = [os.path.realpath(row['pv_name'].strip()) for row in rows
                   if row.get('vg_name', '').strip() == vg];
            assert pvs == [device], f'{vg} uses unexpected physical volumes'
      - "{{ openstack_cinder_pvs.stdout }}"
      - "{{ openstack_fast_vg }}"
      - "{{ openstack_cinder_raid_realpaths.results[0].stdout | trim }}"
      - "{{ openstack_bulk_vg }}"
      - "{{ openstack_cinder_raid_realpaths.results[1].stdout | trim }}"
  changed_when: false

- name: Create the Glance image data directory
  ansible.builtin.file:
    path: "{{ openstack_glance_data_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
