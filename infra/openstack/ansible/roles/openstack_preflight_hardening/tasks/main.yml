---
- name: Require service hostnames to match operating-system hostnames
  ansible.builtin.assert:
    that:
      - openstack_service_hostname is defined
      - openstack_service_hostname | length > 0
      - openstack_service_hostname == ansible_facts.hostname
    fail_msg: >-
      Set openstack_service_hostname to the short operating-system hostname on
      {{ inventory_hostname }}.

- name: Require distinct operating-system hostnames
  ansible.builtin.assert:
    that:
      - >-
        hostvars[groups['openstack_master'][0]].ansible_facts.hostname
        != hostvars[groups['openstack_compute'][0]].ansible_facts.hostname
    fail_msg: >-
      The master and compute node must use different operating-system hostnames.
  run_once: true

- name: Validate management address and MTU symmetry
  vars:
    openstack_master_host: "{{ groups['openstack_master'][0] }}"
    openstack_compute_host: "{{ groups['openstack_compute'][0] }}"
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - -c
      - |
        import json
        import sys

        links = [json.loads(value) for value in sys.argv[1:]]
        addresses = []
        mtus = []
        for link in links:
            assert len(link) == 1
            ipv4 = [
                item["local"]
                for item in link[0].get("addr_info", [])
                if item.get("family") == "inet"
            ]
            assert len(ipv4) == 1
            addresses.append(ipv4[0])
            mtus.append(int(link[0]["mtu"]))
        assert addresses[0] != addresses[1], "management addresses must differ"
        assert mtus[0] == mtus[1], "management MTUs must match"
      - >-
        {{ hostvars[openstack_master_host].openstack_management_addresses.stdout }}
      - >-
        {{ hostvars[openstack_compute_host].openstack_management_addresses.stdout }}
  changed_when: false
  run_once: true

- name: Harden the master's external interface validation
  ansible.builtin.assert:
    that:
      - >-
        (openstack_external_addresses.stdout | from_json | first).mtu
        | int >= 1500
      - >-
        (openstack_external_addresses.stdout | from_json | first).addr_info
        | selectattr('family', 'equalto', 'inet')
        | list
        | length == 0
      - >-
        (openstack_external_addresses.stdout | from_json | first).addr_info
        | selectattr('scope', 'equalto', 'global')
        | list
        | length == 0
    fail_msg: >-
      The external interface must use MTU 1500 or greater and have no IPv4 or
      global IPv6 address before OVN attaches it to br-ex.
  when: inventory_hostname in groups['openstack_master']
