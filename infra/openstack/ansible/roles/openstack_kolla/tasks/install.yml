---
- name: Inspect local deployment Python
  ansible.builtin.stat:
    path: "{{ openstack_kolla_python }}"
  register: openstack_kolla_python_stat

- name: Require local deployment Python
  ansible.builtin.assert:
    that:
      - openstack_kolla_python_stat.stat.exists
      - openstack_kolla_python_stat.stat.executable
    fail_msg: "{{ openstack_kolla_python }} is required on the deployment host."

- name: Require Git on the deployment host
  ansible.builtin.command:
    argv:
      - git
      - --version
  changed_when: false

- name: Create isolated Kolla directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    mode: "{{ item.mode }}"
  loop:
    - path: "{{ openstack_kolla_state_dir }}"
      mode: "0700"
    - path: "{{ openstack_kolla_config_dir }}"
      mode: "0700"
    - path: "{{ openstack_kolla_config_dir }}/config"
      mode: "0700"
    - path: "{{ openstack_kolla_config_dir }}/config/cinder"
      mode: "0700"
    - path: "{{ openstack_kolla_config_dir }}/config/nova"
      mode: "0700"
    - path: "{{ openstack_kolla_state_dir }}/collections"
      mode: "0700"
  loop_control:
    label: "{{ item.path }}"

- name: Remove a stale staged Kolla password file
  ansible.builtin.file:
    path: "{{ openstack_kolla_config_dir }}/passwords.yml"
    state: absent
  no_log: true

- name: Create the Kolla virtual environment
  ansible.builtin.command:
    argv:
      - "{{ openstack_kolla_python }}"
      - -m
      - venv
      - "{{ openstack_kolla_venv }}"
    creates: "{{ openstack_kolla_venv }}/bin/python"

- name: Install the pinned Kolla-Ansible revision
  ansible.builtin.pip:
    executable: "{{ openstack_kolla_venv }}/bin/pip"
    name: "{{ openstack_kolla_source }}"
    state: present

- name: Read the installed Kolla source revision
  ansible.builtin.command:
    argv:
      - "{{ openstack_kolla_venv }}/bin/python"
      - -c
      - >-
        import importlib.metadata, json;
        dist = importlib.metadata.distribution('kolla-ansible');
        direct_url = dist.read_text('direct_url.json') or '{}';
        data = json.loads(direct_url);
        print(data.get('vcs_info', {}).get('commit_id', ''))
  register: openstack_installed_kolla_revision
  changed_when: false

- name: Require the pinned Kolla source revision
  ansible.builtin.assert:
    that:
      - >-
        openstack_installed_kolla_revision.stdout | trim
        == openstack_kolla_revision
    fail_msg: >-
      The Kolla virtual environment does not contain the configured immutable
      revision. Remove the revision-specific virtual environment and retry.

- name: Install release-constrained OpenStack clients
  ansible.builtin.pip:
    executable: "{{ openstack_kolla_venv }}/bin/pip"
    name:
      - python-cinderclient
      - python-openstackclient
    extra_args: "--constraint {{ openstack_kolla_constraints }}"
    state: present

- name: Write isolated Kolla Ansible configuration
  ansible.builtin.copy:
    dest: "{{ openstack_kolla_state_dir }}/ansible.cfg"
    mode: "0600"
    content: |
      [defaults]
      collections_path = {{ openstack_kolla_state_dir }}/collections
      host_key_checking = True
      interpreter_python = auto_silent
      retry_files_enabled = False

      [ssh_connection]
      pipelining = True

- name: Define the Kolla command environment
  ansible.builtin.set_fact:
    openstack_kolla_environment:
      ANSIBLE_COLLECTIONS_PATH: "{{ openstack_kolla_state_dir }}/collections"
      ANSIBLE_CONFIG: "{{ openstack_kolla_state_dir }}/ansible.cfg"
      ANSIBLE_PRIVATE_KEY_FILE: "{{ openstack_ansible_private_key_file }}"
      KOLLA_CONFIG_PATH: "{{ openstack_kolla_config_dir }}"
      PATH: >-
        {{ openstack_kolla_venv }}/bin:{{ ansible_env.PATH }}
  no_log: true

- name: Install Kolla Ansible Galaxy dependencies
  ansible.builtin.command:
    argv:
      - "{{ openstack_kolla_venv }}/bin/kolla-ansible"
      - install-deps
  environment: "{{ openstack_kolla_environment }}"
  changed_when: true

- name: Locate the release-matched Kolla inventory
  ansible.builtin.command:
    argv:
      - "{{ openstack_kolla_venv }}/bin/python"
      - -c
      - >-
        from kolla_ansible import utils;
        print(utils.get_data_files_path('ansible', 'inventory', 'multinode'))
  register: openstack_kolla_stock_inventory
  changed_when: false
