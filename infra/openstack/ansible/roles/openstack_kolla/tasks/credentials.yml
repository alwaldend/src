---
- name: Validate the requested Kolla action
  ansible.builtin.assert:
    that:
      - openstack_action in openstack_supported_actions
    fail_msg: "Unsupported OpenStack action: {{ openstack_action }}"

- name: Read injected deployment credential paths
  ansible.builtin.set_fact:
    openstack_kolla_passwords_source: >-
      {{ lookup('ansible.builtin.env', 'KOLLA_PASSWORDS_FILE') }}
    openstack_ansible_private_key_file: >-
      {{ lookup('ansible.builtin.env', 'ANSIBLE_PRIVATE_KEY_FILE') }}
  no_log: true

- name: Require injected deployment credential paths
  ansible.builtin.assert:
    that:
      - openstack_kolla_passwords_source | length > 0
      - openstack_ansible_private_key_file | length > 0
    fail_msg: >-
      Run the target through the OpenStack Bazel wrapper. It injects Kolla
      passwords and the Vault-signed SSH key.
  no_log: true

- name: Inspect injected deployment credentials
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ openstack_kolla_passwords_source }}"
    - "{{ openstack_ansible_private_key_file }}"
  register: openstack_injected_credentials
  no_log: true

- name: Require private readable credential files
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.isreg
      - item.stat.readable
      - item.stat.mode in ['0400', '0600']
    fail_msg: >-
      An injected credential is absent, unreadable, or accessible to another
      user.
  loop: "{{ openstack_injected_credentials.results }}"
  no_log: true

- name: Read the injected Kolla password document
  ansible.builtin.slurp:
    src: "{{ openstack_kolla_passwords_source }}"
  register: openstack_kolla_passwords_slurp
  no_log: true

- name: Parse the injected Kolla password document
  ansible.builtin.set_fact:
    openstack_kolla_passwords: >-
      {{ openstack_kolla_passwords_slurp.content | b64decode | from_yaml }}
  no_log: true

- name: Validate required Kolla password values
  ansible.builtin.assert:
    that:
      - openstack_kolla_passwords is mapping
      - openstack_kolla_passwords.database_password | default('') | length > 0
      - >-
        openstack_kolla_passwords.keystone_admin_password
        | default('') | length > 0
      - openstack_kolla_passwords.rabbitmq_password | default('') | length > 0
      - openstack_kolla_passwords.kolla_ssh_key is mapping
      - >-
        openstack_kolla_passwords.kolla_ssh_key.private_key
        | default('') | length > 0
      - >-
        openstack_kolla_passwords.kolla_ssh_key.public_key
        | default('') | length > 0
    fail_msg: >-
      The Vault value is not a complete Kolla passwords.yml document.
  no_log: true
