---
- name: Validate requested Kolla action
  ansible.builtin.assert:
    that:
      - openstack_action in openstack_supported_actions
    fail_msg: "Unsupported OpenStack action: {{ openstack_action }}"

- name: Read injected deployment credentials
  ansible.builtin.set_fact:
    openstack_kolla_passwords_source: >-
      {{ lookup('ansible.builtin.env', 'KOLLA_PASSWORDS_FILE') }}
    openstack_ansible_private_key_file: >-
      {{ lookup('ansible.builtin.env', 'ANSIBLE_PRIVATE_KEY_FILE') }}

- name: Require injected deployment credentials
  ansible.builtin.assert:
    that:
      - openstack_kolla_passwords_source | length > 0
      - openstack_ansible_private_key_file | length > 0
    fail_msg: >-
      Kolla passwords or the Ansible SSH key were not injected. Populate the
      documented Vault resources and run through the Bazel target.

- name: Inspect injected Kolla password file
  ansible.builtin.stat:
    path: "{{ openstack_kolla_passwords_source }}"
  register: openstack_kolla_passwords_stat
  no_log: true

- name: Inspect injected Ansible private key
  ansible.builtin.stat:
    path: "{{ openstack_ansible_private_key_file }}"
  register: openstack_ansible_private_key_stat
  no_log: true

- name: Require readable Kolla password file
  ansible.builtin.assert:
    that:
      - openstack_kolla_passwords_stat.stat.exists
      - openstack_kolla_passwords_stat.stat.isreg
      - openstack_kolla_passwords_stat.stat.readable
    fail_msg: "The Vault-rendered Kolla password file is not readable."
  no_log: true

- name: Require readable Ansible private key
  ansible.builtin.assert:
    that:
      - openstack_ansible_private_key_stat.stat.exists
      - openstack_ansible_private_key_stat.stat.isreg
      - openstack_ansible_private_key_stat.stat.readable
    fail_msg: "The Vault-rendered Ansible private key is not readable."
  no_log: true

- name: Inspect local deployment Python
  ansible.builtin.stat:
    path: "{{ openstack_kolla_python }}"
  register: openstack_kolla_python_stat

- name: Require local deployment Python
  ansible.builtin.assert:
    that:
      - openstack_kolla_python_stat.stat.exists
      - openstack_kolla_python_stat.stat.executable
    fail_msg: "{{ openstack_kolla_python }} is required on the deployment host."

- name: Require Git on deployment host
  ansible.builtin.command:
    argv:
      - git
      - --version
  changed_when: false

- name: Create Kolla state directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    mode: "{{ item.mode }}"
  loop:
    - path: "{{ openstack_kolla_state_dir }}"
      mode: "0700"
    - path: "{{ openstack_kolla_config_dir }}"
      mode: "0700"
    - path: "{{ openstack_kolla_config_dir }}/config"
      mode: "0700"
    - path: "{{ openstack_kolla_config_dir }}/config/cinder"
      mode: "0700"
    - path: "{{ openstack_kolla_state_dir }}/collections"
      mode: "0700"
  loop_control:
    label: "{{ item.path }}"

- name: Create Kolla virtual environment
  ansible.builtin.command:
    argv:
      - "{{ openstack_kolla_python }}"
      - -m
      - venv
      - "{{ openstack_kolla_venv }}"
    creates: "{{ openstack_kolla_venv }}/bin/python"

- name: Install release-matched Kolla-Ansible
  ansible.builtin.pip:
    executable: "{{ openstack_kolla_venv }}/bin/pip"
    name: "{{ openstack_kolla_source }}"
    state: present

- name: Install release-constrained OpenStack clients
  ansible.builtin.pip:
    executable: "{{ openstack_kolla_venv }}/bin/pip"
    name:
      - python-cinderclient
      - python-openstackclient
    extra_args: >-
      --constraint
      https://releases.openstack.org/constraints/upper/{{ openstack_release }}
    state: present

- name: Write isolated Kolla Ansible configuration
  ansible.builtin.copy:
    dest: "{{ openstack_kolla_state_dir }}/ansible.cfg"
    mode: "0600"
    content: |
      [defaults]
      collections_path = {{ openstack_kolla_state_dir }}/collections
      host_key_checking = True
      interpreter_python = auto_silent
      retry_files_enabled = False

      [ssh_connection]
      pipelining = True

- name: Define Kolla command environment
  ansible.builtin.set_fact:
    openstack_kolla_environment:
      ANSIBLE_COLLECTIONS_PATH: "{{ openstack_kolla_state_dir }}/collections"
      ANSIBLE_CONFIG: "{{ openstack_kolla_state_dir }}/ansible.cfg"
      ANSIBLE_PRIVATE_KEY_FILE: "{{ openstack_ansible_private_key_file }}"
      KOLLA_CONFIG_PATH: "{{ openstack_kolla_config_dir }}"
      PATH: >-
        {{ openstack_kolla_venv }}/bin:{{ ansible_env.PATH }}

- name: Install Kolla Ansible Galaxy dependencies
  ansible.builtin.command:
    argv:
      - "{{ openstack_kolla_venv }}/bin/kolla-ansible"
      - install-deps
  environment: "{{ openstack_kolla_environment }}"
  changed_when: false

- name: Locate release-matched Kolla multinode inventory
  ansible.builtin.command:
    argv:
      - "{{ openstack_kolla_venv }}/bin/python"
      - -c
      - >-
        from kolla_ansible import utils;
        print(utils.get_data_files_path('ansible', 'inventory', 'multinode'))
  register: openstack_kolla_stock_inventory
  changed_when: false

- name: Define OpenStack inventory hosts
  ansible.builtin.set_fact:
    openstack_kolla_master_host: "{{ groups['openstack_master'][0] }}"
    openstack_kolla_compute_host: "{{ groups['openstack_compute'][0] }}"

- name: Build Kolla inventory host lines
  ansible.builtin.set_fact:
    openstack_kolla_master_line: >-
      {{ openstack_kolla_master_host }}
      ansible_host={{ hostvars[openstack_kolla_master_host].ansible_host | default(openstack_kolla_master_host) }}
      ansible_user={{ hostvars[openstack_kolla_master_host].ansible_user | default('root') }}
      ansible_port={{ hostvars[openstack_kolla_master_host].ansible_port | default(22) }}
      ansible_become=true
      network_interface={{ hostvars[openstack_kolla_master_host].openstack_management_interface }}
      api_interface={{ hostvars[openstack_kolla_master_host].openstack_management_interface }}
      tunnel_interface={{ hostvars[openstack_kolla_master_host].openstack_management_interface }}
      storage_interface={{ hostvars[openstack_kolla_master_host].openstack_management_interface }}
      neutron_external_interface={{ hostvars[openstack_kolla_master_host].openstack_external_interface }}
    openstack_kolla_compute_line: >-
      {{ openstack_kolla_compute_host }}
      ansible_host={{ hostvars[openstack_kolla_compute_host].ansible_host | default(openstack_kolla_compute_host) }}
      ansible_user={{ hostvars[openstack_kolla_compute_host].ansible_user | default('root') }}
      ansible_port={{ hostvars[openstack_kolla_compute_host].ansible_port | default(22) }}
      ansible_become=true
      network_interface={{ hostvars[openstack_kolla_compute_host].openstack_management_interface }}
      api_interface={{ hostvars[openstack_kolla_compute_host].openstack_management_interface }}
      tunnel_interface={{ hostvars[openstack_kolla_compute_host].openstack_management_interface }}
      storage_interface={{ hostvars[openstack_kolla_compute_host].openstack_management_interface }}
      migration_interface={{ hostvars[openstack_kolla_compute_host].openstack_management_interface }}

- name: Write Kolla inventory section replacements
  ansible.builtin.copy:
    dest: "{{ openstack_kolla_inventory_sections }}"
    mode: "0600"
    content: >-
      {{
        {
          'control': [openstack_kolla_master_line],
          'network': [openstack_kolla_master_line],
          'compute': [openstack_kolla_compute_line],
          'monitoring': [],
          'storage': [openstack_kolla_master_line],
          'deployment': ['localhost ansible_connection=local']
        } | to_nice_json
      }}

- name: Render release-matched Kolla inventory
  ansible.builtin.command:
    argv:
      - "{{ openstack_kolla_venv }}/bin/python"
      - "{{ role_path }}/files/render_inventory.py"
      - --source
      - "{{ openstack_kolla_stock_inventory.stdout | trim }}"
      - --sections
      - "{{ openstack_kolla_inventory_sections }}"
      - --output
      - "{{ openstack_kolla_inventory }}"
  register: openstack_kolla_inventory_render
  changed_when: openstack_kolla_inventory_render.stdout | trim == 'changed'

- name: Render Kolla global configuration
  ansible.builtin.template:
    src: globals.yml.j2
    dest: "{{ openstack_kolla_config_dir }}/globals.yml"
    mode: "0600"

- name: Render bulk Cinder backend override
  ansible.builtin.template:
    src: cinder-volume.conf.j2
    dest: "{{ openstack_kolla_config_dir }}/config/cinder/cinder-volume.conf"
    mode: "0600"

- name: Copy Vault-rendered Kolla passwords
  ansible.builtin.copy:
    src: "{{ openstack_kolla_passwords_source }}"
    dest: "{{ openstack_kolla_config_dir }}/passwords.yml"
    remote_src: true
    mode: "0600"
  no_log: true

- name: Select Kolla action sequence
  ansible.builtin.set_fact:
    openstack_kolla_commands: >-
      {{
        {
          'prechecks': ['bootstrap-servers', 'prechecks'],
          'deploy': ['bootstrap-servers', 'prechecks', 'deploy', 'post-deploy'],
          'reconfigure': ['prechecks', 'reconfigure', 'post-deploy'],
          'post-deploy': ['post-deploy']
        }[openstack_action]
      }}

- name: Run Kolla-Ansible action sequence
  ansible.builtin.command:
    argv:
      - "{{ openstack_kolla_venv }}/bin/kolla-ansible"
      - "{{ item }}"
      - --configdir
      - "{{ openstack_kolla_config_dir }}"
      - --inventory
      - "{{ openstack_kolla_inventory }}"
      - --become
  loop: "{{ openstack_kolla_commands }}"
  loop_control:
    label: "{{ item }}"
  environment: "{{ openstack_kolla_environment }}"
  changed_when: item != 'prechecks'

- name: Inspect generated OpenStack client configuration
  ansible.builtin.stat:
    path: "{{ openstack_kolla_config_dir }}/clouds.yaml"
  register: openstack_clouds_yaml
  when: openstack_action in ['deploy', 'reconfigure', 'post-deploy']

- name: Require generated OpenStack client configuration
  ansible.builtin.assert:
    that:
      - openstack_clouds_yaml.stat.exists
      - openstack_clouds_yaml.stat.isreg
    fail_msg: "Kolla post-deploy did not generate clouds.yaml."
  when: openstack_action in ['deploy', 'reconfigure', 'post-deploy']

- name: List Cinder volume types
  ansible.builtin.command:
    argv:
      - "{{ openstack_kolla_venv }}/bin/openstack"
      - --os-cloud
      - admin
      - volume
      - type
      - list
      - --format
      - value
      - --column
      - Name
  environment: >-
    {{
      openstack_kolla_environment
      | combine({'OS_CLIENT_CONFIG_FILE': openstack_kolla_config_dir + '/clouds.yaml'})
    }}
  register: openstack_cinder_volume_types
  changed_when: false
  when: openstack_action in ['deploy', 'reconfigure', 'post-deploy']

- name: Create missing Cinder volume types
  ansible.builtin.command:
    argv:
      - "{{ openstack_kolla_venv }}/bin/openstack"
      - --os-cloud
      - admin
      - volume
      - type
      - create
      - "{{ item }}"
  loop:
    - fast
    - bulk
  loop_control:
    label: "{{ item }}"
  environment: >-
    {{
      openstack_kolla_environment
      | combine({'OS_CLIENT_CONFIG_FILE': openstack_kolla_config_dir + '/clouds.yaml'})
    }}
  changed_when: true
  when:
    - openstack_action in ['deploy', 'reconfigure', 'post-deploy']
    - item not in openstack_cinder_volume_types.stdout_lines

- name: Reconcile Cinder volume type backend properties
  ansible.builtin.command:
    argv:
      - "{{ openstack_kolla_venv }}/bin/openstack"
      - --os-cloud
      - admin
      - volume
      - type
      - set
      - --property
      - "volume_backend_name={{ item }}"
      - "{{ item }}"
  loop:
    - fast
    - bulk
  loop_control:
    label: "{{ item }}"
  environment: >-
    {{
      openstack_kolla_environment
      | combine({'OS_CLIENT_CONFIG_FILE': openstack_kolla_config_dir + '/clouds.yaml'})
    }}
  changed_when: false
  when: openstack_action in ['deploy', 'reconfigure', 'post-deploy']
