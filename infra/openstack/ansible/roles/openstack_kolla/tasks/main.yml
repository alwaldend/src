---
- name: Read and validate deployment credentials
  ansible.builtin.import_tasks: credentials.yml

- name: Install the pinned Kolla toolchain
  ansible.builtin.import_tasks: install.yml

- name: Render the Kolla deployment inputs
  ansible.builtin.import_tasks: inventory.yml

- name: Run the requested Kolla action
  ansible.builtin.import_tasks: deploy.yml

- name: Reconcile Cinder volume types
  ansible.builtin.import_tasks: volume_types.yml
  when: openstack_action in ['deploy', 'reconfigure', 'post-deploy']

- name: Validate deployed compute and storage services
  ansible.builtin.import_tasks: services.yml
  when: openstack_action in ['deploy', 'reconfigure', 'post-deploy']
