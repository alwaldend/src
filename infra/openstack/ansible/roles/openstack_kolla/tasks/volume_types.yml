---
- name: List Cinder volume types
  ansible.builtin.command:
    argv:
      - "{{ openstack_kolla_venv }}/bin/openstack"
      - --os-cloud
      - admin
      - volume
      - type
      - list
      - --format
      - json
  environment: "{{ openstack_client_environment }}"
  register: openstack_cinder_volume_types
  changed_when: false

- name: Create missing Cinder volume types
  ansible.builtin.command:
    argv:
      - "{{ openstack_kolla_venv }}/bin/openstack"
      - --os-cloud
      - admin
      - volume
      - type
      - create
      - --property
      - "volume_backend_name={{ item }}"
      - "{{ item }}"
  loop:
    - fast
    - bulk
  loop_control:
    label: "{{ item }}"
  environment: "{{ openstack_client_environment }}"
  changed_when: true
  when: >-
    item not in
    (openstack_cinder_volume_types.stdout | from_json
     | map(attribute='Name') | list)

- name: Reconcile Cinder volume type backend properties
  ansible.builtin.command:
    argv:
      - "{{ openstack_kolla_venv }}/bin/openstack"
      - --os-cloud
      - admin
      - volume
      - type
      - set
      - --property
      - "volume_backend_name={{ item }}"
      - "{{ item }}"
  loop:
    - fast
    - bulk
  loop_control:
    label: "{{ item }}"
  environment: "{{ openstack_client_environment }}"
  changed_when: true

- name: Read reconciled Cinder volume types
  ansible.builtin.command:
    argv:
      - "{{ openstack_kolla_venv }}/bin/openstack"
      - --os-cloud
      - admin
      - volume
      - type
      - show
      - --format
      - json
      - "{{ item }}"
  loop:
    - fast
    - bulk
  loop_control:
    label: "{{ item }}"
  environment: "{{ openstack_client_environment }}"
  register: openstack_reconciled_volume_types
  changed_when: false

- name: Validate Cinder volume type mappings
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - -c
      - |
        import json
        import sys

        documents = [json.loads(value) for value in json.loads(sys.argv[1])]
        names = json.loads(sys.argv[2])
        assert len(documents) == len(names)
        for document, name in zip(documents, names):
            properties = document.get("properties", {})
            if isinstance(properties, str):
                assert f"volume_backend_name='{name}'" in properties
            else:
                assert properties.get("volume_backend_name") == name
      - >-
        {{ openstack_reconciled_volume_types.results
           | map(attribute='stdout') | list | to_json }}
      - "{{ ['fast', 'bulk'] | to_json }}"
  changed_when: false
