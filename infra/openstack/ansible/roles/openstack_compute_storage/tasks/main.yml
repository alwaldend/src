---
- name: Install compute storage tools
  ansible.builtin.dnf:
    name:
      - util-linux
      - xfsprogs
    state: present

- name: Validate the compute storage device setting
  ansible.builtin.assert:
    that:
      - openstack_compute_ephemeral_device is defined
      - >-
        openstack_compute_ephemeral_device
        is match('^/dev/disk/by-id/[^/]+$')
      - openstack_compute_ephemeral_device is not search('CHANGE_ME')
      - openstack_nova_datadir == '/var/lib/nova'
      - openstack_compute_filesystem == 'xfs'
    fail_msg: >-
      Set one whole-disk NVMe by-id path. Nova data must use /var/lib/nova on
      XFS.

- name: Inspect the configured compute device
  ansible.builtin.stat:
    path: "{{ openstack_compute_ephemeral_device }}"
    follow: true
  register: openstack_compute_device_stat

- name: Require the configured compute device
  ansible.builtin.assert:
    that:
      - openstack_compute_device_stat.stat.exists
      - openstack_compute_device_stat.stat.isblk
    fail_msg: >-
      {{ openstack_compute_ephemeral_device }} does not resolve to a block
      device.

- name: Resolve the configured compute device
  ansible.builtin.command:
    argv:
      - readlink
      - --canonicalize-existing
      - "{{ openstack_compute_ephemeral_device }}"
  register: openstack_compute_device_realpath
  changed_when: false

- name: Inspect the compute device topology
  ansible.builtin.command:
    argv:
      - lsblk
      - --json
      - --bytes
      - --paths
      - --output
      - NAME,TYPE,TRAN,ROTA,SIZE,MOUNTPOINTS
      - "{{ openstack_compute_device_realpath.stdout | trim }}"
  register: openstack_compute_lsblk
  changed_when: false

- name: Validate the dedicated compute NVMe
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - -c
      - >-
        import json, os, sys;
        data = json.loads(sys.argv[1]);
        devices = data.get('blockdevices', []);
        assert len(devices) == 1, 'expected one block device';
        root = devices[0];
        assert os.path.realpath(root['name']) == os.path.realpath(sys.argv[2]);
        assert root.get('type') == 'disk', 'device is not a whole disk';
        assert root.get('tran') == 'nvme', 'device transport is not NVMe';
        assert int(root.get('rota', 1)) == 0, 'device is rotational';
        assert int(root.get('size', 0)) >= int(sys.argv[3]), 'device is too small';
        children = root.get('children') or [];
        assert not children, 'device has partitions or active child devices';
        mounts = [value for value in (root.get('mountpoints') or []) if value];
        assert set(mounts).issubset({sys.argv[4]}), 'device is mounted elsewhere'
      - "{{ openstack_compute_lsblk.stdout }}"
      - "{{ openstack_compute_device_realpath.stdout | trim }}"
      - "{{ openstack_compute_minimum_bytes | string }}"
      - "{{ openstack_nova_datadir }}"
  changed_when: false

- name: Create the Nova data directory
  ansible.builtin.file:
    path: "{{ openstack_nova_datadir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Inspect the Nova data mount
  ansible.builtin.command:
    argv:
      - findmnt
      - --json
      - --evaluate
      - --mountpoint
      - "{{ openstack_nova_datadir }}"
      - --output
      - SOURCE,FSTYPE,OPTIONS
  register: openstack_nova_mount_before
  changed_when: false
  failed_when: false

- name: Inspect the Nova data fstab entry
  ansible.builtin.command:
    argv:
      - findmnt
      - --fstab
      - --json
      - --evaluate
      - --mountpoint
      - "{{ openstack_nova_datadir }}"
      - --output
      - SOURCE,FSTYPE,OPTIONS
  register: openstack_nova_fstab_before
  changed_when: false
  failed_when: false

- name: Validate an existing Nova data mount
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - -c
      - |
        import json
        import os
        import sys

        filesystems = json.loads(sys.argv[1]).get("filesystems", [])
        assert len(filesystems) == 1, "Nova data is not a separate mount"
        entry = filesystems[0]
        assert os.path.realpath(entry["source"]) == os.path.realpath(sys.argv[2])
        assert entry.get("fstype") == sys.argv[3]
        options = set((entry.get("options") or "").split(","))
        assert "noatime" in options
      - "{{ openstack_nova_mount_before.stdout }}"
      - "{{ openstack_compute_device_realpath.stdout | trim }}"
      - "{{ openstack_compute_filesystem }}"
  changed_when: false
  when: openstack_nova_mount_before.rc == 0

- name: Validate an existing Nova data fstab entry
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - -c
      - |
        import json
        import os
        import sys

        filesystems = json.loads(sys.argv[1]).get("filesystems", [])
        assert len(filesystems) == 1, "Nova data has no unique fstab entry"
        entry = filesystems[0]
        assert os.path.realpath(entry["source"]) == os.path.realpath(sys.argv[2])
        assert entry.get("fstype") == sys.argv[3]
        options = set((entry.get("options") or "").split(","))
        assert "noatime" in options
      - "{{ openstack_nova_fstab_before.stdout }}"
      - "{{ openstack_compute_device_realpath.stdout | trim }}"
      - "{{ openstack_compute_filesystem }}"
  changed_when: false
  when: openstack_nova_fstab_before.rc == 0

- name: Require explicit permission for compute storage creation
  ansible.builtin.assert:
    that:
      - openstack_compute_storage_wipe | bool
    fail_msg: >-
      Set openstack_compute_storage_wipe=true before the role creates or
      replaces the compute filesystem.
  when:
    - openstack_manage_compute_storage | bool
    - openstack_nova_mount_before.rc != 0

- name: Require an existing mount when storage management is disabled
  ansible.builtin.assert:
    that:
      - openstack_nova_mount_before.rc == 0
      - openstack_nova_fstab_before.rc == 0
    fail_msg: >-
      Mount {{ openstack_compute_ephemeral_device }} at
      {{ openstack_nova_datadir }}, or enable both compute storage flags.
  when: not (openstack_manage_compute_storage | bool)

- name: Inspect files below an unmounted Nova data directory
  ansible.builtin.find:
    paths: "{{ openstack_nova_datadir }}"
    file_type: any
    hidden: true
    recurse: false
  register: openstack_nova_datadir_entries
  when:
    - openstack_manage_compute_storage | bool
    - openstack_nova_mount_before.rc != 0

- name: Refuse to hide existing Nova data
  ansible.builtin.assert:
    that:
      - openstack_nova_datadir_entries.matched == 0
    fail_msg: >-
      {{ openstack_nova_datadir }} contains data on the boot filesystem.
      Move or remove it before the NVMe mount is created.
  when:
    - openstack_manage_compute_storage | bool
    - openstack_nova_mount_before.rc != 0

- name: Inspect the compute device filesystem
  ansible.builtin.command:
    argv:
      - blkid
      - --probe
      - --output
      - value
      - --match-tag
      - TYPE
      - "{{ openstack_compute_device_realpath.stdout | trim }}"
  register: openstack_compute_filesystem_before
  changed_when: false
  failed_when: openstack_compute_filesystem_before.rc not in [0, 2]
  when:
    - openstack_manage_compute_storage | bool
    - openstack_nova_mount_before.rc != 0

- name: Remove old signatures from the compute NVMe
  ansible.builtin.command:
    argv:
      - wipefs
      - --all
      - "{{ openstack_compute_device_realpath.stdout | trim }}"
  changed_when: true
  when:
    - openstack_manage_compute_storage | bool
    - openstack_compute_storage_wipe | bool
    - openstack_nova_mount_before.rc != 0
    - >-
      openstack_compute_filesystem_before.stdout | default('') | trim
      != openstack_compute_filesystem

- name: Create the compute filesystem
  community.general.filesystem:
    dev: "{{ openstack_compute_device_realpath.stdout | trim }}"
    fstype: "{{ openstack_compute_filesystem }}"
    force: false
  when:
    - openstack_manage_compute_storage | bool
    - openstack_nova_mount_before.rc != 0
    - >-
      openstack_compute_filesystem_before.stdout | default('') | trim
      != openstack_compute_filesystem

- name: Mount the compute NVMe for Nova
  ansible.posix.mount:
    path: "{{ openstack_nova_datadir }}"
    src: "{{ openstack_compute_ephemeral_device }}"
    fstype: "{{ openstack_compute_filesystem }}"
    opts: "{{ openstack_compute_mount_options }}"
    state: mounted
  when: openstack_manage_compute_storage | bool

- name: Inspect the final Nova data mount
  ansible.builtin.command:
    argv:
      - findmnt
      - --json
      - --evaluate
      - --mountpoint
      - "{{ openstack_nova_datadir }}"
      - --output
      - SOURCE,FSTYPE,OPTIONS
  register: openstack_nova_mount_after
  changed_when: false

- name: Inspect the final Nova data fstab entry
  ansible.builtin.command:
    argv:
      - findmnt
      - --fstab
      - --json
      - --evaluate
      - --mountpoint
      - "{{ openstack_nova_datadir }}"
      - --output
      - SOURCE,FSTYPE,OPTIONS
  register: openstack_nova_fstab_after
  changed_when: false

- name: Validate the final Nova data layout
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - -c
      - |
        import json
        import os
        import sys

        mounted = json.loads(sys.argv[1]).get("filesystems", [])
        fstab = json.loads(sys.argv[2]).get("filesystems", [])
        assert len(mounted) == 1
        assert len(fstab) == 1
        expected = os.path.realpath(sys.argv[3])
        for entry in (mounted[0], fstab[0]):
            assert os.path.realpath(entry["source"]) == expected
            assert entry.get("fstype") == sys.argv[4]
            options = set((entry.get("options") or "").split(","))
            assert "noatime" in options
      - "{{ openstack_nova_mount_after.stdout }}"
      - "{{ openstack_nova_fstab_after.stdout }}"
      - "{{ openstack_compute_device_realpath.stdout | trim }}"
      - "{{ openstack_compute_filesystem }}"
  changed_when: false

- name: Create the Nova instance directory
  ansible.builtin.file:
    path: "{{ openstack_nova_datadir }}/instances"
    state: directory
    owner: root
    group: root
    mode: "0755"
