---
- name: Validate the fixed two-node topology
  ansible.builtin.assert:
    that:
      - groups['openstack_master'] | length == 1
      - groups['openstack_compute'] | length == 1
      - openstack_action in openstack_supported_actions
    fail_msg: >-
      This deployment requires exactly one openstack_master, exactly one
      openstack_compute, and a supported openstack_action.
  run_once: true

- name: Validate the Kolla internal VIP
  ansible.builtin.assert:
    that:
      - openstack_kolla_internal_vip_address | length > 0
      - openstack_kolla_internal_vip_address != 'CHANGE_ME'
      - openstack_kolla_internal_vip_address is match('^[0-9]{1,3}(\.[0-9]{1,3}){3}$')
    fail_msg: >-
      Set openstack_kolla_internal_vip_address to an unused IPv4 address on the
      management subnet.
  run_once: true

- name: Validate supported host operating system
  ansible.builtin.assert:
    that:
      - ansible_facts.os_family == 'RedHat'
      - ansible_facts.distribution in ['CentOS', 'Rocky']
      - ansible_facts.distribution_major_version | int == 10
    fail_msg: >-
      Kolla-Ansible {{ openstack_release }} is configured here for CentOS
      Stream 10 or Rocky Linux 10 hosts.

- name: Validate management interface setting
  ansible.builtin.assert:
    that:
      - openstack_management_interface is defined
      - openstack_management_interface | length > 0
      - openstack_management_interface != 'CHANGE_ME'
      - openstack_management_interface in ansible_facts.interfaces
    fail_msg: >-
      Set openstack_management_interface to an existing, addressed management
      interface on {{ inventory_hostname }}.


- name: Inspect management interface addresses
  ansible.builtin.command:
    argv:
      - ip
      - -j
      - address
      - show
      - dev
      - "{{ openstack_management_interface }}"
  register: openstack_management_addresses
  changed_when: false

- name: Require an IPv4 address on the management interface
  ansible.builtin.assert:
    that:
      - >-
        (openstack_management_addresses.stdout | from_json | first).addr_info
        | selectattr('family', 'equalto', 'inet')
        | list
        | length > 0
    fail_msg: >-
      {{ openstack_management_interface }} must have an IPv4 address on
      {{ inventory_hostname }}.

- name: Validate master's external network interface
  ansible.builtin.assert:
    that:
      - openstack_external_interface is defined
      - openstack_external_interface | length > 0
      - openstack_external_interface != 'CHANGE_ME'
      - openstack_external_interface in ansible_facts.interfaces
      - openstack_external_interface != openstack_management_interface
    fail_msg: >-
      The master needs a separate, unnumbered external interface. A VLAN
      subinterface on the same physical NIC is acceptable.
  when: inventory_hostname in groups['openstack_master']


- name: Inspect master's external interface addresses
  ansible.builtin.command:
    argv:
      - ip
      - -j
      - address
      - show
      - dev
      - "{{ openstack_external_interface }}"
  register: openstack_external_addresses
  changed_when: false
  when: inventory_hostname in groups['openstack_master']

- name: Require an unnumbered external interface
  ansible.builtin.assert:
    that:
      - >-
        (openstack_external_addresses.stdout | from_json | first).addr_info
        | selectattr('family', 'equalto', 'inet')
        | list
        | length == 0
    fail_msg: >-
      Remove IPv4 addresses from {{ openstack_external_interface }} before
      allowing OVN to attach it to br-ex.
  when: inventory_hostname in groups['openstack_master']

- name: Inspect KVM device on compute node
  ansible.builtin.stat:
    path: /dev/kvm
  register: openstack_kvm_device
  when: inventory_hostname in groups['openstack_compute']

- name: Require hardware virtualization on compute node
  ansible.builtin.assert:
    that:
      - openstack_kvm_device.stat.exists
      - openstack_kvm_device.stat.ischr
    fail_msg: >-
      /dev/kvm is unavailable on {{ inventory_hostname }}. Enable CPU
      virtualization in firmware and load the KVM kernel modules.
  when: inventory_hostname in groups['openstack_compute']
