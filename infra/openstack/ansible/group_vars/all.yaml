---
openstack_release: "2026.1"
openstack_kolla_source: >-
  git+https://opendev.org/openstack/kolla-ansible@stable/{{ openstack_release }}
openstack_kolla_base_distro: rocky
openstack_kolla_container_engine: docker
openstack_kolla_python: /usr/bin/python3
openstack_kolla_internal_vip_address: CHANGE_ME
openstack_kolla_keepalived_virtual_router_id: "53"

openstack_kolla_venv: >-
  {{ lookup('ansible.builtin.env', 'HOME') }}/.cache/alwaldend/openstack/kolla-ansible-{{ openstack_release }}
openstack_kolla_state_dir: >-
  {{ lookup('ansible.builtin.env', 'HOME') }}/.local/state/alwaldend/openstack/{{ openstack_release }}
openstack_kolla_config_dir: "{{ openstack_kolla_state_dir }}/etc-kolla"
openstack_kolla_inventory: "{{ openstack_kolla_state_dir }}/multinode"
openstack_kolla_inventory_sections: "{{ openstack_kolla_state_dir }}/inventory-sections.json"

openstack_manage_storage: false
openstack_storage_wipe: false
openstack_fast_raid_device: /dev/md/cinder-fast
openstack_bulk_raid_device: /dev/md/cinder-bulk
openstack_fast_vg: cinder-fast
openstack_bulk_vg: cinder-bulk
openstack_glance_data_dir: /var/lib/openstack/glance

openstack_manage_compute_storage: false
openstack_compute_storage_wipe: false
openstack_nova_instances_dir: /var/lib/nova/instances
openstack_compute_filesystem: xfs
openstack_compute_mount_options: defaults,noatime

openstack_action: deploy
openstack_supported_actions:
  - deploy
  - post-deploy
  - prechecks
  - reconfigure
