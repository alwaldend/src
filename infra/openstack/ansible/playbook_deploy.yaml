---
- name: Validate OpenStack hosts
  hosts: openstack
  become: true
  gather_facts: true
  force_handlers: true
  roles:
    - role: openstack_preflight

- name: Prepare master storage
  hosts: openstack_master
  become: true
  gather_facts: true
  force_handlers: true
  roles:
    - role: openstack_storage

- name: Prepare compute-local instance storage
  hosts: openstack_compute
  become: true
  gather_facts: true
  force_handlers: true
  roles:
    - role: openstack_compute_storage

- name: Deploy OpenStack with Kolla-Ansible
  hosts: localhost
  connection: local
  gather_facts: true
  roles:
    - role: openstack_kolla
