---
- name: Validate OpenStack hosts
  hosts: openstack
  become: true
  gather_facts: true
  any_errors_fatal: true
  roles:
    - role: openstack_preflight
    - role: openstack_preflight_hardening

- name: Prepare master storage
  hosts: openstack_master
  become: true
  gather_facts: true
  any_errors_fatal: true
  roles:
    - role: openstack_storage_guard
    - role: openstack_storage

- name: Prepare compute-local instance storage
  hosts: openstack_compute
  become: true
  gather_facts: true
  any_errors_fatal: true
  roles:
    - role: openstack_compute_storage
