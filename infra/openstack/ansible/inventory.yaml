all:
  vars:
    ansible_user: ansible
    ansible_become: true
    ansible_python_interpreter: /usr/bin/python3
    ssh_vault_role: src_infra_openstack_ssh
    openstack_fast_raid_device: /dev/md/cinder-fast
    openstack_bulk_raid_device: /dev/md/cinder-bulk
    openstack_fast_vg: cinder-fast
    openstack_bulk_vg: cinder-bulk
    openstack_nova_datadir: /var/lib/nova
    openstack_compute_filesystem: xfs
    openstack_compute_mount_options: defaults,noatime
    openstack_glance_data_dir: /var/lib/openstack/glance
  children:
    openstack_master:
      hosts:
        master1.openstack.alwaldend.com:
          ansible_host: 192.168.1.2
          openstack_mac_address: CHANGE_ME
          network_interface: CHANGE_ME
          api_interface: CHANGE_ME
          tunnel_interface: CHANGE_ME
          migration_interface: CHANGE_ME
          neutron_external_interface: CHANGE_ME
          openstack_fast_devices:
            - /dev/disk/by-id/CHANGE_ME_SATA_SSD_1
            - /dev/disk/by-id/CHANGE_ME_SATA_SSD_2
          openstack_bulk_devices:
            - /dev/disk/by-id/CHANGE_ME_DAS_HDD_1
            - /dev/disk/by-id/CHANGE_ME_DAS_HDD_2
            - /dev/disk/by-id/CHANGE_ME_DAS_HDD_3
            - /dev/disk/by-id/CHANGE_ME_DAS_HDD_4
    openstack_compute:
      hosts:
        compute1.openstack.alwaldend.com:
          ansible_host: 192.168.1.3
          openstack_mac_address: CHANGE_ME
          network_interface: CHANGE_ME
          api_interface: CHANGE_ME
          tunnel_interface: CHANGE_ME
          migration_interface: CHANGE_ME
          openstack_compute_ephemeral_device: /dev/disk/by-id/CHANGE_ME_2TB_NVME
    openstack:
      children:
        openstack_master: {}
        openstack_compute: {}
    control:
      children:
        openstack_master: {}
    network:
      children:
