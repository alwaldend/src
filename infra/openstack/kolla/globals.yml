---
workaround_ansible_issue_8743: true
kolla_base_distro: rocky
openstack_release: "2026.1"
kolla_container_engine: docker
kolla_internal_vip_address: 192.168.1.215
kolla_internal_fqdn: openstack.alwaldend.com
kolla_external_fqdn: openstack.alwaldend.com
enable_haproxy: "no"
enable_keepalived: "no"
disable_firewall: "yes"
neutron_plugin_agent: ovn
enable_heat: "no"
enable_cinder: "yes"
enable_cinder_backup: "no"
enable_cinder_backend_lvm: "yes"
cinder_backend_lvm_name: fast
cinder_volume_group: cinder-fast
nova_instance_datadir_volume: /var/lib/nova
glance_file_datadir_volume: /var/lib/openstack/glance
enable_fluentd: "no"
