- name: Prepare controller trust for signed runner host certificates
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [always]
  vars:
    runner_controller_state_dir: >-
      {{ lookup('env', 'BUILD_WORKSPACE_DIRECTORY', default=undef()) }}/out/forgejo_runner
  tasks:
    - name: Create private controller operational cache
      ansible.builtin.file:
        path: "{{ runner_controller_state_dir }}"
        state: directory
        mode: "0700"
    - name: Record controller host trust path
      ansible.builtin.set_fact:
        runner_controller_known_hosts: "{{ runner_controller_state_dir }}/known_hosts"
    - name: Trust the server CA for runner inventory hosts
      ansible.builtin.copy:
        dest: "{{ runner_controller_known_hosts }}"
        mode: "0600"
        content: |
          @cert-authority {{ groups['forgejo_runner'] | sort | join(',') }} {{ lookup('file', playbook_dir + '/files/ssh_ca_servers.pub') | trim }}

- name: Deploy Forgejo runner
  hosts: forgejo_runner
  become: true
  serial: 1
  vars:
    ansible_ssh_common_args: >-
      -o StrictHostKeyChecking=yes
      -o UserKnownHostsFile={{ hostvars['localhost']['runner_controller_known_hosts'] | quote }}
  pre_tasks:
    - name: Wait for cloud-init to finish
      ansible.builtin.command: cloud-init status --wait
      changed_when: false
  tasks:
    - name: Configure the shared host baseline
      ansible.builtin.import_role:
        name: alwaldend.main.host
    - name: Configure development tools
      ansible.builtin.import_role:
        name: alwaldend.main.dev_vm
    - name: Install and register the Forgejo runner
      ansible.builtin.import_role:
        name: alwaldend.main.forgejo_runner
    - name: Install the repository Android prerequisites
      ansible.builtin.import_role:
        name: alwaldend.main.dev_vm
        tasks_from: android
    - name: Configure the runner's Bazel tools
      ansible.builtin.import_role:
        name: alwaldend.main.dev_vm
        tasks_from: bazel
    - name: Verify runner service health
      ansible.builtin.command:
        argv: [systemctl, is-active, forgejo-runner.service]
      changed_when: false
