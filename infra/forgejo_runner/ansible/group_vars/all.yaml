ansible_user: ansible
ssh_vault_role: src_infra_forgejo_runner_ssh
ssh_valid_principals:
  - forgejo-runner.alwaldend.com
  - "*.forgejo-runner.alwaldend.com"
forgejo_runner_instance: https://git.alwaldend.com
forgejo_runner_token: "{{ lookup('ansible.builtin.env', 'FORGEJO_RUNNER_TOKEN', default=undefined()) }}"
forgejo_runner_repository: alwaldend/src
dev_vm_bazel_user: "{{ forgejo_runner_user }}"
dev_vm_bazel_home: "{{ forgejo_runner_home_dir }}"
firewall_allow_port_from:
  - src: "any"
    port: 22
    comment: ssh
# Bazel resolves the NDK before it can run //tools/android:install.
# Provision the shared installer archive before starting repository CI.
dev_vm_android_installer_src: android_installer.tar.gz
dev_vm_android_packages_src: android_packages.txt
