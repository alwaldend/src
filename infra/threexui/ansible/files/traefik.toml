[global]
checkNewVersion = false
sendAnonymousUsage = false

[providers.file]
filename = "{{ traefik_dynamic_config_path }}"

[log]
level = "INFO"
# filePath = "{{ traefik_log_dir }}/traefik.log"

[entryPoints]
[entryPoints.web]
address = ":80"
[entryPoints.web.http.redirections.entryPoint]
to = "websecure"

[entryPoints.websecure]
address = ":443"
asDefault = true
[entryPoints.websecure.http.tls]
certResolver = "default"

# [api]
# dashboard = true
# insecure = true

# [accessLog]
# format = "json"
# [accessLog.filters]
# statusCodes = ["200", "400-404", "500-503"]

[certificatesResolvers.default.acme]
email = "src_infra_threexui@alwaldend.com"
storage = "{{ traefik_data_dir }}/acme_default.json"
caServer = "{{ traefik_acme_url }}"

[certificatesResolvers.default.acme.httpChallenge]
entryPoint = "web"

{% if not traefik_disable_eab %}
[certificatesResolvers.default.acme.eab]
kid = "{{ traefik_acme_kid }}"
hmacEncoded = "{{ traefik_acme_hmac }}"
{% endif %}

[tls.stores]
[tls.stores.default.acme]
resolver = "default"
[tls.stores.default.acme.domain]
main = "{{ threexui_domain }}"
sans = ["{{ inventory_hostname }}"]

{% if traefik_disable_eab %}
{% for port in range(40000, 40300) %}
{% if ansible_facts.default_ipv4 %}
[entryPoints.inbound_{{ port }}_ipv4]
address = "{{ ansible_facts.default_ipv4.address }}:{{ port }}"
{% if threexui_mikrotik_parent_proxy_port is not defined or port != threexui_mikrotik_parent_proxy_port %}
http = { tls = { certResolver = "default" }  }
{% endif %}
{% endif %}
{% if ansible_facts.default_ipv6 %}
[entryPoints.inbound_{{ port }}_ipv6]
address = "[{{ ansible_facts.default_ipv6.address }}]:{{ port }}"
{% if threexui_mikrotik_parent_proxy_port is not defined or port != threexui_mikrotik_parent_proxy_port %}
http = { tls = { certResolver = "default" }  }
{% endif %}
{% endif %}
{% endfor %}
{% endif %}
