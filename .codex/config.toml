[mcp_servers.mcp_cordis]
command = "bash"
args = ["-c", '''
set -eu
root="$(git rev-parse --show-toplevel)"
exec bash "$root/projects/mcp_cordis/cmd/mcp_cordis/launch.sh"
''']
required = false
startup_timeout_sec = 120
tool_timeout_sec = 300

[[hooks.SessionStart]]
matcher = "^startup$"

[[hooks.SessionStart.hooks]]
type = "command"
command = '''
bazel_agent bazel info server_pid >/dev/null 2>&1 || true
bazel_agent tool warm repo_delivery >/dev/null 2>&1 || true
'''
async = true
timeout = 600
