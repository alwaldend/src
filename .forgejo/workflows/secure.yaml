name: Secure runner smoke check

on:
  push:
  workflow_dispatch:

jobs:
  verify:
    # This limits this workflow only. Vault independently verifies its signed
    # claims against the default branch and the exact configured validation ref.
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      || startsWith(github.ref, 'refs/heads/releases/')
    runs-on: secure
    enable-openid-connect: true
    steps:
      - name: Check out the exact workflow revision
        uses: https://github.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          set-safe-directory: false
        env:
          NODE_EXTRA_CA_CERTS: /etc/pki/tls/certs/ca-bundle.crt
      - name: Check runner resources and Vault authentication
        env:
          VAULT_ADDR: https://vault.alwaldend.com:8200
          VAULT_AUTH_PATH: forgejo_ci
          VAULT_AUTH_ROLE: secure
          CI_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          CI_SERVER_URL: ${{ github.server_url }}
          CI_REF: ${{ github.ref }}
          SSL_CERT_FILE: /etc/pki/tls/certs/ca-bundle.crt
        run: bazel run --config=ci //infra/forgejo_runner/ci:smoke
