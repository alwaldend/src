name: Repository CI

on:
  push:
  workflow_dispatch:

jobs:
  ci:
    # This selects workflow refs; it is not protected-only runner admission.
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      || startsWith(github.ref, 'refs/heads/releases/')
    runs-on: secure
    enable-openid-connect: true
    steps:
      - name: Check out the exact workflow revision
        uses: https://git.alwaldend.com/alwaldend/com_github_actions_checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          set-safe-directory: false
      - name: Build and test the repository
        uses: ./tools/ci/action
