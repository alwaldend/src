name: Repository CI

on:
  push:
    branches:
      - master

jobs:
  ci:
    runs-on: self-hosted
    steps:
      - name: Check out the event revision
        uses: https://forgejo.alwaldend.com/alwaldend/com_github_actions_checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          lfs: true
          persist-credentials: false
          set-safe-directory: false
      - name: Build and test the repository
        uses: ./tools/ci/action
