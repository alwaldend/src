- description: Audits every root and nested Bazel workspace
  vars:
    request: >-
      Perform a complete release-readiness build and test audit for this
      repository and report every failure.
  assert:
    - type: llm-rubric
      threshold: 1
      value: >-
        Pass only if the response uses the al-checks runner through
        a `bazel run --script_path=...` launcher and starts that launcher
        only after the generating Bazel process exits; covers build and test in
        the root, including the ruleset packages selected by the root wildcard;
        lets the runner continue across failures; inspects the restricted report and targeted failure
        logs; distinguishes repository defects from environment or coverage
        gaps; and reports the complete command matrix without claiming
        manual targets ran.
        Otherwise fail.
