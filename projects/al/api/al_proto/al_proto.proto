syntax = "proto3";

package com.alwaldend.src.projects.al.api.al_proto;

option go_package = "git.alwaldend.com/alwaldend/src/projects/al/api/al_proto";

// api.Config https://pkg.go.dev/github.com/hashicorp/vault/api#Config
message VaultConfig {
  string address = 1;
}

// api.ConfigureTLS https://pkg.go.dev/github.com/hashicorp/vault/api#Config.ConfigureTLS
message VaultTLS {
  string ca_cert = 1;
  string client_cert = 2;
  string client_key = 3;
}

message VaultConn {
  reserved 1;
  reserved "name";
  // Vault config
  VaultConfig config = 2;
  // Vault tls config
  VaultTLS tls = 3;
}

// Approle auth
message VaultAuthApprole {
  // Approle name
  string name = 1;
}

message VaultAuthTokenHelper {}

// Vault authentication config
message VaultAuth {
  reserved 1;
  reserved "name";
  // Authentification with approle
  VaultAuthApprole approle = 2;
  // Authentification using the token helper
  VaultAuthTokenHelper token_helper = 3;
  bool no_auth = 4;
}

message Config {
  // Named Vault connections
  map<string, VaultConn> vault_conn = 1;
  // Named Vault authentication methods
  map<string, VaultAuth> vault_auth = 2;
  // Named executable declarations
  map<string, PluginConfig> plugin_configs = 7;
  // Named plugin invocations
  map<string, PluginCall> plugins = 8;
  // Built-in injection declarations, independent of external plugin calls.
  map<string, InjectorCall> inject = 11;
  reserved 9, 10;
  reserved "tool_methods", "tools";
}

message JsonMap {
  map<string, Json> val = 1;
}

message JsonList {
  repeated Json val = 1;
}

message Json {
  oneof val {
    string val_string = 2;
    bool val_bool = 3;
    int64 val_int64 = 4;
    double val_float = 7;
    JsonMap val_map = 5;
    JsonList val_list = 6;
  }
}

message PluginCall {
  reserved 1;
  reserved "name";
  // Plugin name
  string plugin = 2;
  // Plugin data
  Json data = 3;
  map<string, string> labels = 4;
}

// Injector calls group named resource definitions under label selection.
message InjectorCall {
  reserved 1;
  reserved "name";
  map<string, string> labels = 2;
  map<string, ResourceConfig> res = 3;
  // Explicit parent group for resource override precedence.
  string extends = 4;
}

// Provider-neutral resource settings; the provider owns args interpretation.
message ResourceConfig {
  string type = 1;
  Json args = 2;
  repeated string deps = 3;
  // Resource input for templates and providers, independent of dependency output.
  Json data = 4;
}

// Settings for the built-in environment resource.
message InjectorEnv {
  string value = 1;
}

// Settings for a built-in private file rendered from dependencies.
message InjectorFile {
  string value = 1;
  string from_file = 2;
  reserved 3;
  reserved "extra";
}

// Settings for an invocation-owned helper process.
message InjectorProcess {
  string name = 1;
  repeated string args = 2;
}

message PluginConfig {
  reserved 1;
  reserved "name";
  string bin = 2;
  repeated string args = 3;
  map<string, string> env = 4;
  Json data = 5;
  map<string, string> labels = 6;
  map<string, PluginCall> calls = 7;
  // Eligible for lazy capability discovery when a graph needs external types.
  bool resource_provider = 8;
}

service PluginService {
  rpc PluginStart(PluginStartRequest) returns (PluginStartResponse) {}
}

message PluginStartRequest {
  // Whole config
  Config config = 1;
  // Plugin config
  PluginConfig plugin = 2;
  reserved 3;
  reserved "calls";
  // Selected executable declaration key.
  string name = 4;
}

// Startup metadata is separate from the optional resource output.
message PluginStartResponse {
  // Absent when startup produced no resource output.
  ResourceResult result = 1;
  // Capabilities served by an eligible provider, initialized without fetching.
  repeated string resource_types = 2;
}

// Eligible providers advertise capabilities in PluginStartResponse, then fetch only
// resources requested by AL's built-in dependency evaluator.
service ResourceService {
  rpc ResourceFetch(ResourceFetchRequest) returns (ResourceResult) {}
}
message ResourceResult {
  // Fetched results must be empty or match the requested resource name.
  // Startup results may use the plugin's identity.
  string name = 1;
  // Exports available to dependent resources and the command environment.
  map<string, string> env = 2;
  // Provider-owned paths kept alive until command consumers have stopped.
  repeated string files = 3;
  // Opaque JSON-compatible values for templates and downstream providers.
  Json data = 4;
}
message ResourceFetchRequest {
  // Identity in the selected resource graph.
  string name = 1;
  // One of the provider's advertised type names.
  string type = 2;
  // Opaque type-specific settings; core does not interpret these fields.
  Json args = 3;
  // Completed results in the resource's declared dependency order.
  repeated ResourceResult dependencies = 4;
  // Configured resource input, independently of type-specific args.
  Json data = 5;
}
