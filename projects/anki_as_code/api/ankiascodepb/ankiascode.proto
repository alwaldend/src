syntax = "proto3";

package anki_as_code;

import "anki/decks.proto";
import "anki/notes.proto";
import "anki/notetypes.proto";

option go_package = "git.alwaldend.com/alwaldend/src/projects/anki_as_code/api/ankiascodepb;ankiascodepb";

// These messages define the editable TOML and plan JSON contracts. Anki
// API configuration uses the existing generated upstream Anki schemas.

// CollectionConfig identifies the schema-backed collection directory format.
message CollectionConfig {
  // Version identifies the current unreleased TOML schema, currently version 1.
  int64 version = 1;
  // Moved preserves declared file or directory identity changes in collection state.
  repeated ResourceMove moved = 2;
}

// CollectionConfigSet is the parsed configuration set emitted by config dump.
message CollectionConfigSet {
  // Config contains the root config's format version.
  CollectionConfig config = 1;
  // Decks contains deck declarations and notes owned by each deck's notes/ directory.
  repeated DeckConfigSet decks = 2;
  // NoteTypes contains the discovered note-type declarations in file order.
  repeated NoteTypeConfigFile note_types = 3;
  // Notes contains declarations discovered through the collection-root notes/ directory.
  repeated NoteConfigFile notes = 4;
}

// DeckConfigSet retains a deck's configuration and implicit ownership of notes.
message DeckConfigSet {
  // Deck contains the marker's configuration; its title is derived separately.
  DeckConfig deck = 1;
  // Notes contains the declarations owned by this deck's notes/ directory.
  repeated NoteConfigFile notes = 2;
  // Title is derived from deck directory names joined with Anki's :: separator.
  string title = 3;
  // Path is the collection-relative deck marker path used as its state address.
  string path = 4;
}

// DeckConfig describes an Anki deck and its configuration.
message DeckConfig {
  // Preset references an existing scheduling preset by its readable name.
  string preset = 1;
  // Normal contains regular-deck configuration and is nil for filtered decks.
  anki.decks.Deck.Normal normal = 4;
  // Filtered exposes upstream filtered-deck configuration without managing resident cards.
  anki.decks.Deck.Filtered filtered = 6;
}

// CardConfig assigns a normal deck to a card generated by Anki from note content.
message CardConfig {
  // Ord is the zero-based template ordinal, or cloze number minus one.
  int64 ordinal = 2;
  // Deck is an optional normal-deck marker path; loading resolves an omitted value from the note root.
  optional string deck = 3;
}

// NoteConfig describes editable shared content, tags, and managed regular-deck cards.
// Field names map directly to their exact text content.
message NoteConfig {
  // NoteType references a declared note-type configuration path, including one created in the same apply.
  string note_type = 4;
  // Tags contains the note's editable Anki tags.
  repeated string tags = 5;
  // Cards contains generated-card deck assignments, not card-existence declarations.
  // Omitted assignments use the note root; resident filtered cards are excluded.
  repeated CardConfig cards = 6;
  // NamedFields maps editable field names to their exact content.
  map<string, string> fields = 7;
}

// NoteTypeConfig declares a note type, its ordered fields, and card templates.
message NoteTypeConfig {
  // SortField selects the sort field by name; an omitted value selects the first field.
  string sort_field = 1;
  // Name is the editable note-type title.
  string name = 2;
  // Config reuses upstream note-type configuration.
  anki.notetypes.Notetype.Config config = 3;
  // Templates contains the explicit card template declarations.
  repeated TemplateConfig templates = 4;
  // Fields contains upstream field definitions in their desired storage order.
  repeated anki.notetypes.Notetype.Field fields = 5;
}

// TemplateConfig declares a card template; array order supplies its storage ordinal.
message TemplateConfig {
  // TargetDeck references an optional normal-deck configuration path.
  string target_deck = 1;
  // Name is the editable template title.
  string name = 2;
  // Config reuses upstream template configuration.
  anki.notetypes.Notetype.Template.Config config = 9;
}

// CollectionChange identifies a planned action on one managed collection resource.
message CollectionChange {
  // Resource identifies the resource kind: note, card, deck, note_type, or state.
  string resource = 1;
  // Path identifies the configuration or generated card affected by this change.
  string path = 2;
  // From identifies the previous path for a move.
  string from = 4;
  // Action identifies the planned operation: add, update, delete, or move.
  string action = 3;
}

// CollectionChangePlan summarizes the actions needed to reconcile current and desired state.
message CollectionChangePlan {
  // StateChanged reports persisted binding changes independently of native object edits.
  bool state_changed = 1;
  // NotesAdded counts new notes.
  int64 notes_added = 2;
  // NotesChanged counts notes with field or tag edits.
  int64 notes_changed = 3;
  // NotesDeleted counts notes absent from desired state.
  int64 notes_deleted = 4;
  // CardsAdded counts additions known before apply; Anki-generated additions are deferred.
  int64 cards_added = 5;
  // CardsChanged counts managed cards whose deck assignments change.
  int64 cards_changed = 6;
  // CardsDeleted counts existing managed cards removed with their notes.
  // Template-driven removals remain deferred to Anki.
  int64 cards_deleted = 7;
  // DecksAdded counts new decks.
  int64 decks_added = 8;
  // DecksChanged counts decks with title or configuration edits.
  int64 decks_changed = 9;
  // DecksDeleted counts decks absent from desired state.
  int64 decks_deleted = 10;
  // Changes contains individual actions sorted by resource kind and identity.
  repeated CollectionChange changes = 11;
  // NoteTypesAdded counts new note types.
  int64 note_types_added = 12;
  // NoteTypesChanged counts note types with configuration or structural edits.
  int64 note_types_changed = 13;
  // NoteTypesDeleted counts note types absent from desired state.
  int64 note_types_deleted = 14;
  // CardGenerationDeferred means Anki determines card generation and structural
  // migrations during apply, including template-driven additions and removals.
  // Plan reports current card assignments and note-deletion effects only.
  bool card_generation_deferred = 15;
}

// ResourceMove declares an explicit identity-preserving address change.
message ResourceMove {
  // From is the old file, directory prefix, or nested resource address.
  string from = 1;
  // To is the new address for the same resource and its descendants.
  string to = 2;
}

// NoteConfigFile binds a note configuration to its collection-relative source path.
message NoteConfigFile {
  // Path identifies this note file independently of Anki storage identities.
  string path = 1;
  // Config contains the editable note values.
  NoteConfig config = 2;
}

// NoteTypeConfigFile binds a note-type definition to its collection-relative source path.
message NoteTypeConfigFile {
  // Path identifies the note-type file in collection state.
  string path = 1;
  // Config contains the editable definition and presentation.
  NoteTypeConfig config = 2;
}

// DeckState binds a deck configuration path to its native deck.
message DeckState {
  // Id identifies the existing Anki deck.
  int64 id = 1;
}

// NoteState binds a note configuration path to its native note.
message NoteState {
  // Id identifies the existing Anki note and its retained review identity.
  int64 id = 1;
}

// NoteTypeState binds a note-type path and its named native members.
message NoteTypeState {
  // Id identifies the existing Anki note type.
  int64 id = 1;
  // Fields binds each field name to its native identity and position.
  map<string, FieldState> fields = 2;
  // Templates binds each template name to its native identity and position.
  map<string, TemplateState> templates = 3;
}

// FieldState retains a field identity within its owning note type.
message FieldState {
  // Id is the optional native field identity; zero uses the original stored member name.
  int64 id = 1;
  // Ordinal retains the native field position for structural migrations.
  uint32 ordinal = 2;
}

// TemplateState retains a template identity within its owning note type.
message TemplateState {
  // Id is the optional native template identity; zero uses the original stored member name.
  int64 id = 1;
  // Ordinal retains the native template position for structural migrations.
  uint32 ordinal = 2;
}

// PresetState binds a readable alias to an existing scheduling preset.
// It does not manage the preset's scheduling configuration or lifecycle.
message PresetState {
  // Id identifies the existing Anki scheduling preset.
  int64 id = 1;
}

// Resources groups typed native bindings for the selected state namespace.
message Resources {
  // Decks maps deck marker paths to native deck state.
  map<string, DeckState> decks = 1;
  // Notes maps note configuration paths to native note state.
  map<string, NoteState> notes = 2;
  // NoteTypes maps note-type paths to native definitions and members.
  map<string, NoteTypeState> note_types = 3;
  // Presets maps readable aliases to existing scheduling-preset state objects.
  map<string, PresetState> presets = 4;
}

// State is persisted under a caller-selected key through Anki's collection config API.
message State {
  // Version identifies the unreleased state schema, currently version 1.
  int64 version = 1;
  // Resources contains the independently typed bindings owned by this namespace.
  Resources resources = 2;
}

// CollectionPlan contains prepared native work for one captured collection and state namespace.
// Callers retain exclusive access and supply fresh inputs. Native IDs for new decks
// and types remain zero until Anki creates them; prepared references use paths.
message CollectionPlan {
  // Report summarizes known changes and deferred native card effects.
  CollectionChangePlan report = 1;
  // ExpectedState contains the stored bindings required before execution.
  State expected_state = 2;
  // ProposedBindings contains desired paths; new objects have zero native IDs.
  Resources proposed_bindings = 3;
  // DeckRenames releases occupied deck names before applying deck values.
  repeated anki.decks.RenameDeckRequest deck_renames = 4;
  // NoteTypeRenames releases occupied note-type names before applying definitions.
  repeated anki.notetypes.Notetype note_type_renames = 5;
  // Decks contains ordered native deck additions and updates.
  repeated PlannedDeck decks = 6;
  // NoteTypes contains prepared field/template mappings and native type values.
  repeated PlannedNoteType note_types = 7;
  // Notes contains note additions and content updates after type migrations.
  repeated PlannedNote notes = 8;
  // RemovedNotes identifies tracked notes absent from desired configurations.
  repeated int64 removed_notes = 9;
  // RemovedNoteTypes identifies tracked types removed after their notes.
  repeated int64 removed_note_types = 10;
  // RemovedDecks identifies tracked decks removed after retained cards are assigned.
  repeated int64 removed_decks = 11;
  // CardAssignments applies declaring-deck defaults and explicit ordinal destinations.
  repeated PlannedCardAssignments card_assignments = 12;
  // FilteredDecks identifies resulting filtered decks, including untracked decks.
  repeated int64 filtered_decks = 13;
}

// PlannedDeck carries one prepared deck addition or update.
message PlannedDeck {
  // Path locates its desired state binding.
  string path = 1;
  // Value contains native settings; a zero ID creates a deck.
  anki.decks.Deck value = 2;
}

// PlannedNoteType carries one native type definition with resolved member mappings.
message PlannedNoteType {
  // Path locates its desired state and member bindings.
  string path = 1;
  // Value contains native settings and original ordinals; a zero ID creates a type.
  anki.notetypes.Notetype value = 2;
  // SortFieldIndex selects the final field after Anki performs structural migration.
  uint32 sort_field_index = 3;
  // TemplateDecks maps template names to declared target-deck paths.
  // Native target IDs are populated only during execution.
  map<string, string> template_decks = 4;
}

// PlannedNote carries ordered content for one note addition or update.
message PlannedNote {
  // Path locates its desired state binding.
  string path = 1;
  // Value contains content and the resolved type reference; a zero ID creates a note.
  anki.notes.Note value = 2;
  // Deck identifies the declaring deck for creation, or leaves selection to Anki.
  string deck = 3;
  // NoteType references the declared type path, including types created by this plan.
  // Value.notetype_id remains zero until execution resolves this reference.
  string note_type = 4;
}

// PlannedCardAssignments declares destinations for a retained or newly generated note's cards.
message PlannedCardAssignments {
  // Path locates the note's actual ID in desired bindings.
  string path = 1;
  // Deck supplies the declaring normal-deck path when no ordinal override exists.
  string deck = 2;
  // Cards contains explicit normal-card destinations; filtered cards remain unmanaged.
  repeated CardConfig cards = 3;
}
