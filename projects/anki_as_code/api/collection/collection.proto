syntax = "proto3";

package anki_as_code.collection;

import "anki/decks.proto";
import "anki/notetypes.proto";

option go_package = "git.alwaldend.com/alwaldend/src/projects/anki_as_code/api/collection;collectionpb";

// These messages define the editable TOML and plan JSON contracts. Database
// protobuf configuration uses the existing generated upstream Anki schemas.

// CollectionConfig describes the collection text format and locates its managed resources.
message CollectionConfig {
  // Version identifies the supported collection text format.
  int64 format_version = 1;
  // DecksPath locates the recursively discovered deck markers relative to this config.
  string decks_path = 2;
  // NoteTypesPath locates note-type settings files relative to this config.
  string note_types_path = 3;
  // NotesPath optionally locates notes without managed cards relative to this config.
  optional string notes_path = 4;
}

// Deck describes an Anki deck, its configuration, and the location of its notes.
// Name retains Anki's full deck title, including any :: hierarchy separators.
message Deck {
  // ID identifies the Anki deck; new declarations receive an allocated identity.
  int64 id = 1;
  // Name is the full Anki title, serialized as title, with :: hierarchy separators.
  string title = 2;
  // NotesPath locates this deck's notes relative to its marker file.
  string notes_path = 3;
  // Normal contains regular-deck settings and is nil for filtered decks.
  anki.decks.Deck.Normal normal = 4;
  reserved 5;
  reserved "filtered_base64";
  // Filtered exposes upstream filtered-deck settings without managing resident cards.
  anki.decks.Deck.Filtered filtered = 6;
}

// Card identifies a card generated from a note and its template ordinal and deck.
message Card {
  // ID identifies a managed regular-deck card.
  int64 id = 1;
  // Ord is the zero-based template ordinal, or cloze number minus one.
  int64 ordinal = 2;
  // Deck is an optional Anki title override; loading resolves an omitted value from the note root.
  optional string deck = 3;
}

// Note describes editable shared content, tags, and managed regular-deck cards.
// Field names map directly to their exact text content.
message Note {
  // ID identifies the Anki note; new notes receive an allocated identity.
  int64 note_id = 1;
  // GUID preserves the Anki note identity used across collections.
  string guid = 2;
  // TypeID references a declared note-type identity.
  int64 note_type_id = 3;
  // TypeName records the note-type name for readable declarations and validation.
  string note_type = 4;
  // Tags contains the note's editable Anki tags.
  repeated string tags = 5;
  // Cards contains managed regular-deck cards; resident filtered cards are excluded.
  repeated Card cards = 6;
  // NamedFields maps editable field names to their exact content.
  map<string, string> fields = 7;
}

// NoteTypeSettings declares a note type, its ordered fields, and card templates.
message NoteTypeSettings {
  // ID identifies the note type; new declarations may allocate an identity.
  int64 id = 1;
  // Name is the editable note-type title.
  string name = 2;
  // Config reuses upstream note-type configuration.
  anki.notetypes.Notetype.Config config = 3;
  // Templates contains the explicit card template declarations.
  repeated TemplateSettings templates = 4;
  // Fields contains upstream field definitions in their desired storage order.
  repeated anki.notetypes.Notetype.Field fields = 5;
}

// TemplateSettings declares a card template at its desired storage ordinal.
message TemplateSettings {
  // Ord identifies the template by its zero-based ordinal.
  int64 ordinal = 1;
  // Name is the editable template title.
  string name = 2;
  reserved 3 to 8;
  reserved "front", "back", "browser_front", "browser_back", "browser_font", "browser_font_size";
  // Config reuses upstream template configuration.
  anki.notetypes.Notetype.Template.Config config = 9;
}

// CollectionChange identifies a planned action on one managed collection resource.
message CollectionChange {
  // Resource identifies the resource kind: note, card, deck, or note_type.
  string resource = 1;
  // ID identifies the resource; deck changes use the Anki title.
  string id = 2;
  // Action identifies the planned operation: add, update, or delete.
  string action = 3;
}

// CollectionChangePlan summarizes the actions needed to reconcile current and desired state.
message CollectionChangePlan {
  reserved 1;
  reserved "appearance_changed";
  // NotesAdded counts new notes.
  int64 notes_added = 2;
  // NotesChanged counts notes with field or tag edits.
  int64 notes_changed = 3;
  // NotesDeleted counts notes absent from desired state.
  int64 notes_deleted = 4;
  // CardsAdded counts new managed cards.
  int64 cards_added = 5;
  // CardsChanged counts managed cards whose deck assignments change.
  int64 cards_changed = 6;
  // CardsDeleted counts managed cards absent from desired state.
  int64 cards_deleted = 7;
  // DecksAdded counts new decks.
  int64 decks_added = 8;
  // DecksChanged counts decks with title or configuration edits.
  int64 decks_changed = 9;
  // DecksDeleted counts decks absent from desired state.
  int64 decks_deleted = 10;
  // Changes contains individual actions sorted by resource kind and identity.
  repeated CollectionChange changes = 11;
  // NoteTypesAdded counts new note types.
  int64 note_types_added = 12;
  // NoteTypesChanged counts note types with settings or structural edits.
  int64 note_types_changed = 13;
  // NoteTypesDeleted counts note types absent from desired state.
  int64 note_types_deleted = 14;
}
