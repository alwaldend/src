title = "Alwaldend"
theme = ["github.com/docsy/docsy"]
baseURL = "http://127.0.0.1:1313"
renderSegments = ["site"]
# refLinksErrorLevel = "WARNING"

enableRobotsTXT = true

[outputs]
section = ["html", "rss", "print"]
home = ["html", "searchdocuments"]
page = ["html", "rss"]

[frontmatter]
lastmod = [":fileModTime"]

[sitemap]
changefreq = "daily"
priority = 0.5

[params]
# Local search uses a prebuilt index in a worker instead of Docsy eager indexing.
offlineSearch = false
github_repo = "https://github.com/alwaldend/src"
github_branch = "master"
version_menu = "Versions"
version_menu_pagelinks = true

[[params.alwaldend.links]]
name = "GitHub"
url = "https://github.com/alwaldend/src/"

[[params.alwaldend.links]]
name = "GitLab"
url = "https://gitlab.com/alwaldend/src/"

# [params.copyright]
# authors = ""

[params.ui]
navbar_logo = false
generated_tags = ["Generated"]
separate_page_tags = ["Bzl-Targets", "Changelog"]
showLightDarkModeMenu = true
sidebar_menu_compact = true
sidebar_menu_foldable = true
sidebar_menu_truncate = 200
sidebar_root_enabled = true
# Render active state per page: a scoped root's link points to its parent.
sidebar_cache_limit = 1000000

# Keep each documentation owner's tree out of unrelated owners' pages.
[[cascade]]
[cascade.params]
sidebar_root_for = "self"
[cascade.target]
path = "/docs/*/*"
kind = "section"

[params.drawio]
enable = true

[markup.goldmark.renderer]
unsafe = true

[markup.highlight]
noClasses = false

[markup.goldmark.renderHooks.link]
useEmbedded = "fallback"

[markup.goldmark.parser.attribute]
block = true
title = true

[taxonomies]
category = "categories"
language = "languages"
status = "statuses"
tag = "tags"
site = "websites"


[[menus.main]]
name = "Blog"
weight = 50
url = "/blog/"

[[menus.main]]
name = "Projects"
weight = 75
url = "/projects/"

[[menus.main]]
name = "Docs"
weight = 100
url = "/docs/"

[security.exec]
# allow = [".*"]
# osEnv = [".*"]
# osEnv = [
#     # '(?i)^((HTTPS?|NO)_PROXY|PATH(EXT)?|APPDATA|TE?MP|TERM|GO\w+|(XDG_CONFIG_)?HOME|USERPROFILE|SSH_AUTH_SOCK|DISPLAY|LANG|SYSTEMDRIVE|PROGRAMDATA)$',
#     '(?i)^(BAZEL_.+)$',
# ] # extra env for postcss

[security.funcs]
# getenv = [".*"]

[module.hugoVersion]
extended = true
min = "0.160.1"

[module]
[[module.mounts]]
source = "static"
target = "static"
[[module.mounts]]
source = "assets"
target = "assets"
[[module.mounts]]
source = "themes/github.com/twbs/bootstrap/scss"
target = "assets/vendor/bootstrap/scss"
[[module.mounts]]
source = "themes/github.com/twbs/bootstrap/js"
target = "assets/vendor/bootstrap/js"
[[module.mounts]]
source = "themes/github.com/twbs/bootstrap/dist"
target = "assets/vendor/bootstrap/dist"
[[module.mounts]]
source = "themes/github.com/FortAwesome/Font-Awesome/scss"
target = "assets/vendor/Font-Awesome/scss"
[[module.mounts]]
source = "themes/github.com/FortAwesome/Font-Awesome/webfonts"
target = "static/webfonts"

# Export documents with the full page graph, then render only public formats.
# Use includes: Hugo 0.165 misaligns page output indexes when exclusions skip
# earlier formats in the render loop.
[outputFormats.searchdocuments]
mediaType = "application/json"
baseName = "search-documents"
isPlainText = true
notAlternative = true

[[segments.search.includes]]
kind = "home"
output = "searchdocuments"

[[segments.site.includes]]
output = "! searchdocuments"
