{{ define "main" }}
<div class="td-content">
  <h1>{{ .Title }}</h1>
  {{ .Content }}
  <div class="row row-cols-1 row-cols-md-2 g-4">
    {{ range .Pages.ByTitle }}
    <div class="col">
      <article class="card h-100">
        <div class="card-body">
          <h2 class="card-title h5"><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
          {{ with .Description }}<p class="card-text">{{ . }}</p>{{ end }}
        </div>
      </article>
    </div>
    {{ end }}
  </div>
</div>
{{ end }}
