{{- $src := partial "alwaldend/resolve-destination.html" (dict "Page" .PageInner "Destination" .Destination) -}}
<img src="{{ $src }}" alt="{{ .PlainText }}" loading="lazy"
  {{- with .Title }} title="{{ . }}"{{ end -}}
  {{- range $key, $value := .Attributes -}}
    {{- if and $value (ne $key "alt") (ne $key "src") (ne $key "loading") -}}
      {{- printf " %s=%q" $key ($value | transform.HTMLEscape) | safeHTMLAttr -}}
    {{- end -}}
  {{- end -}}
>
{{- /* Keep inline images adjacent to their surrounding text. */ -}}
