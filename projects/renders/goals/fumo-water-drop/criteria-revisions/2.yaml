apiVersion: goals.alwaldend.com/v1alpha1
kind: GoalCriteria
metadata:
  name: fumo-water-drop
  resourceVersion: "2"
  generation: 2
  creationTimestamp: "2026-08-30T17:33:10.116890682Z"
spec:
  goalRef:
    name: fumo-water-drop
  revision: 2
  items:
  - criterionID: criterion-001
    revision: 2
    required: true
    statement: "A human- and machine-readable replacement contract fixes the exact approved-asset names FUMO, Fumo_Root, Fumo_Rig, Fumo_Seated, FUMO_COLLIDERS, and Fumo_CollisionProxy, together with axes, meters, ownership, and the root support plane; the scene owns only FUMO_DROP_CTRL and its ballistic keys."
    evidenceMethod: Inspect the contract and clean-open scene inventory for exact names, ownership, coordinate convention, and replacement steps.
  - criterionID: criterion-002
    revision: 2
    required: true
    statement: A conservative 0.300 by 0.220 by 0.250 m neutral envelope, a 0.800 by 0.650 by 0.650 m tank, a Z=0.360 m water guide, and documented domain bounds satisfy the required side clearance, depth, and headroom gates.
    evidenceMethod: Report evaluated dimensions, bounds, water-line contact, clearances, and domain headroom from the clean-reopened candidate.
  - criterionID: criterion-003
    revision: 2
    required: true
    statement: At 48 fps, the root holds at Z=0.620 m through frame 25 and reaches first contact at Z=0.360 m on frame 36 along the documented 0.260 m sampled ballistic fall within 0.5 frame of ideal gravity, with no rotation or authored motion after first contact and no post-contact physics claim.
    evidenceMethod: Compare keyed and evaluated transforms to the exact analytic formula and report frame error and maximum trajectory deviation.
  - criterionID: criterion-004
    revision: 2
    required: true
    statement: "A fixed diagnostic camera and lights frame the tank base, water line, complete placeholder, and the exact legible warning \"NEUTRAL PLACEHOLDER - NOT FUMO\" in renders at frames 1, 24, and 36, with at least 32 px horizontal and 18 px vertical silhouette margins."
    evidenceMethod: Inspect exact rendered pixels and a labeled contact sheet and measure margins and warning readability.
  - criterionID: criterion-005
    revision: 2
    required: true
    statement: The neutral placeholder lives only in FUMO_PLACEHOLDER__NOT_ASSET, remains outside any FUMO collection, contains no Reimu identity cues, and is replaceable without changing the approved asset hierarchy, action, geometry, materials, scale, or source bytes.
    evidenceMethod: Inspect the scene inventory, replacement contract, and sampled renders.
  - criterionID: criterion-006
    revision: 2
    required: true
    statement: The temporary scene clean-opens with exact ownership and names and has no liquid modifier, cache, liquid mesh, foam, spray, bubbles, post-contact keys, or source-asset edit.
    evidenceMethod: Audit modifiers, cache paths, collections, actions, and animation data in the exact clean-reopened candidate.
  - criterionID: criterion-007
    revision: 2
    required: true
    statement: A corrected bottom-center-root contact preflight and Stage-B evidence bind to exact artifacts and exact before-and-after hashes of protected Reimu and Sisyphus Blends, without any final-fluid, final-animation, or approved-plush integration claim.
    evidenceMethod: Inspect the corrected preflight, protected-hash receipt, manifest, and claim limits tied to exact artifact digests.
