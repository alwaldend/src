spec:
  goalRef:
    name: fumo-sisyphus
  revision: 2
  items:
  - criterionID: criterion-001
    revision: 2
    required: true
    statement: "A quote-free fixed render matches the controlling Sisyphus macro composition: the boulder occupies 0.40-0.55 frame width in the upper-left or middle, and one 45-55 degree lower-left-to-upper-right slope owns roughly the right half of the frame."
    evidenceMethod: Compare the exact candidate render and silhouette overlay against the packed controlling reference using measured frame landmarks.
  - criterionID: criterion-002
    revision: 2
    required: true
    statement: Pale amber or cream negative sky remains visible on the left, and directional lighting produces readable boulder contact shadow, cast shadow, and rock relief without a near-black foreground wedge.
    evidenceMethod: Inspect exact rendered pixels and report representative sky luminance, terrain luminance, and the visible contact-shadow path.
  - criterionID: criterion-003
    revision: 2
    required: true
    statement: Boulder and terrain read as rounded, weathered, fractured rock rather than melted smooth forms, conspicuous low-poly slabs, flat graphic planes, or a pile of giant circular rocks.
    evidenceMethod: Review the exact render at full resolution and inventory the visible macro forms before any micro-detail pass.
  - criterionID: criterion-004
    revision: 2
    required: true
    statement: The original image is packed in a render-disabled REFERENCE_ONLY collection, displayed beside the working set for comparison, never overlaid on the scene, and absent from the quote-free review camera.
    evidenceMethod: Inspect the clean-reopened Blend inventory plus a viewport capture that shows the reference beside the working set.
  - criterionID: criterion-005
    revision: 2
    required: true
    statement: The character slot contains only a clearly named PLACEHOLDER_FUTURE_APPROVED_FUMO; no Reimu source object is linked, copied, edited, rendered, or evaluated. Exact tracked Reimu and Sisyphus source hashes remain unchanged, the candidate clean-reopens, and it exposes reusable named sky, slope, boulder, camera, light, reference, and character-slot modules.
    evidenceMethod: Validate exact protected hashes and a machine-readable clean-open scene inventory bound to the candidate hash.
