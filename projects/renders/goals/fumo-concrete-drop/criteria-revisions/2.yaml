spec:
  goalRef:
    name: fumo-concrete-drop
  revision: 2
  items:
  - criterionID: criterion-001
    revision: 2
    required: true
    statement: The saved candidate clean-opens with a FUMO collection and the named world-transform replacement interface, including its exact documented ownership and custom properties.
    evidenceMethod: Inspect a clean-open machine inventory bound to the exact candidate hash.
  - criterionID: criterion-002
    revision: 2
    required: true
    statement: The visible proxy is unmistakably neutral and placeholder-only, with no Reimu likeness, approved-plush, deformation, or plush-behavior claim.
    evidenceMethod: Inspect every sampled render and the candidate inventory for identity cues and claim-limiting labels.
  - criterionID: criterion-003
    revision: 2
    required: true
    statement: The scene uses metric units, a 0.250 m collision envelope, a 0.245 m visible inset, and a floor that contains the full sampled XY trajectory plus collider extent.
    evidenceMethod: Report exact scene units, evaluated dimensions, and motion bounds from the clean-reopened candidate.
  - criterionID: criterion-004
    revision: 2
    required: true
    statement: The animation runs at 24 fps over frames 1 through 72 with a held pose through frame 12, rigid-body release at frame 13, floor collision, and post-impact settling.
    evidenceMethod: Sample transforms and rigid-body state over the exact timeline and bind the report to the candidate hash.
  - criterionID: criterion-005
    revision: 2
    required: true
    statement: A fixed camera and neutral lighting show the complete proxy, floor, scale witness, warning labels, and impact region in every required sampled frame, including the full initial fall, without image-boundary contact.
    evidenceMethod: Inspect exact renders at frames 1, 12, 20, 22, 28, 40, 56, and 72 and a labeled contact sheet; measure initial top and bottom margins.
  - criterionID: criterion-006
    revision: 2
    required: true
    statement: A passive floor and separate active collider produce at least 0.40 m sampled descent, contact without tunneling, no more than 0.005 m penetration, and less than 0.02 m center-motion span over frames 60-72.
    evidenceMethod: Evaluate frame-by-frame collider and center positions from the clean-reopened candidate.
  - criterionID: criterion-007
    revision: 2
    required: true
    statement: Protected Reimu and Sisyphus Blend hashes remain exact, and an inspectable render packet, semantic delta, and machine audit bind to the exact clean-reopened candidate hash and pinned Blender identity.
    evidenceMethod: Verify SHA-256 receipts, the one-property semantic delta, pinned Blender version, and all linked evidence hashes.
