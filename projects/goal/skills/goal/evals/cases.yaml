- description: Redirects new long-running work to OpenSpec
  vars:
    request: >-
      Use $goal to start a new long-running implementation in projects/agents.
      Explain the first action without running tools.
  assert:
    - type: llm-rubric
      value: >-
        The response identifies the goal skill as disabled and directs the
        implementation to the openspec skill and projects/agents/openspec
        workspace.
        It does not initialize a legacy goal or ask for redundant permission.

- description: Preserves legacy record inspection
  vars:
    request: >-
      I have a historical goal.yaml and its attempt files. Can the deprecated
      goal command still show and validate this record? Explain only.
  assert:
    - type: llm-rubric
      value: >-
        The response says existing legacy record inspection and validation
        remain available, distinguishes this from creating new goals, and
        does not claim that deprecation removed the record format or CLI.
