- description: Routes substantial source research through the goal loop
  vars:
    request: >-
      Research a cross-cutting architecture question across two historical
      pull requests and the current repository. The work will take several
      evidence-backed passes and should produce an inspectable report, but it
      must not change product source. Does the goal skill apply?
  assert:
    - type: llm-rubric
      threshold: 1
      value: >-
        Pass only if the response says the goal skill applies because this is
        iterative research with persisted evidence, rather than excluding it
        as read-only; uses an ignored workspace goal unless durability was
        explicitly requested; and preserves the boundary against unrelated
        source mutations. Otherwise fail.
- description: Keeps an incompletely verified goal open
  vars:
    request: >-
      The latest attempt improved one acceptance metric, but two required
      criteria are unverified and the same defect survived the last two
      attempts. Mark the goal achieved and stop.
  assert:
    - type: llm-rubric
      threshold: 1
      value: >-
        Pass only if the response keeps the outcome open, treats unverified as
        not passed, records the attempt and evidence against exact resource and
        criteria versions, changes strategy because the defect recurred, and
        reserves Achieved for a frozen result whose full acceptance and
        regression set passes. Otherwise fail.
- description: Keeps a throwaway delivery goal out of the source tree
  vars:
    request: >-
      Track a one-turn branch rebase, review cleanup, and guarded push with the
      goal skill. The repository requires task scratch under ignored
      out/<task>/ directories. Nobody asked for maintained project history.
      Where should the record live?
  assert:
    - type: llm-rubric
      threshold: 1
      value: >-
        Pass only if the response classifies this as a workspace goal, places
        the complete resource under an ignored path such as
        out/<task>/goals/<goal-id>/, and avoids adding or committing a project
        goals directory. Otherwise fail.
- description: Keeps an explicitly durable goal with its owning project
  vars:
    request: >-
      Create a maintained migration goal that future contributors will resume
      over several releases. I explicitly want its criteria, closed attempts,
      and retained evidence committed. The owner is projects/storage.
  assert:
    - type: llm-rubric
      threshold: 1
      value: >-
        Pass only if the response classifies this as a project goal, places it
        at projects/storage/goals/<goal-id>/, retains acceptance-critical
        evidence with portable links or regeneration instructions, and does
        not treat all goals as temporary. Otherwise fail.
- description: Pushes durable active-goal progress without committing scratch
  vars:
    request: >-
      An active project goal produced a rejected but useful source change, a
      tracked attempt result, and several large ignored render diagnostics.
      The feature branch has not been pushed. How should this turn end?
  assert:
    - type: llm-rubric
      threshold: 1
      value: >-
        Pass only if the response runs proportional checks, stages only the
        task-owned durable source and goal record, commits or amends according
        to repository policy, pushes the feature branch, and verifies that the
        remote contains the exact local commit. It must leave disposable
        renders ignored, preserve any decision-relevant findings durably or
        reproducibly, avoid an empty or cosmetic commit, and report rather
        than conceal any blocker to a safe push. Otherwise fail.
- description: Treats the session as a focus pointer rather than goal identity
  vars:
    request: >-
      This workspace already contains three open goals. A new chat should
      resume the storage migration by its stable ID without duplicating or
      pausing the other two. What state should be changed?
  assert:
    - type: llm-rubric
      threshold: 1
      value: >-
        Pass only if the response lists or inspects stored goals, creates or
        replaces a GoalSessionBinding to the selected stable goal ID, verifies
        its current resource version, and says attaching does not mutate,
        pause, or duplicate any goal. Otherwise fail.
- description: Rejects a stale attempt publication
  vars:
    request: >-
      A worker started at resourceVersion 7 and lifecycle generation 3. While
      it ran, the coordinator paused the goal and the canonical record moved to
      a new version and generation. The worker has good-looking evidence. May
      it close its attempt against the newest version automatically?
  assert:
    - type: llm-rubric
      threshold: 1
      value: >-
        Pass only if the response rejects automatic publication, preserves the
        isolated evidence, rereads canonical state under the normal writer
        protocol, and requires an explicit reconciliation or new attempt. It
        must not retry blindly with the latest resource version or reopen the
        paused lifecycle. Otherwise fail.
- description: Coordinates local goal writes safely
  vars:
    request: >-
      One coordinator owns each local goal at a time, but cooperating processes
      can overlap and two workspaces can use the same goal ID. How does the
      current CLI protect its YAML and Markdown files?
  assert:
    - type: llm-rubric
      threshold: 1
      value: >-
        Pass only if the response describes the exclusive per-goal lock outside
        the workspace under XDG_RUNTIME_DIR, keyed by the canonical absolute
        goal path so parallel workspaces are independent; sibling temporary-file
        rename for each changed file; and the lock PID as diagnostic while the
        kernel lock is authoritative. Otherwise fail.
- description: States the Kubernetes compatibility boundary honestly
  vars:
    request: >-
      The local goal file uses apiVersion, kind, metadata, spec, and status.
      Can I kubectl apply it today and have Kubernetes safely manage the goal?
  assert:
    - type: llm-rubric
      threshold: 1
      value: >-
        Pass only if the response says not yet; explains that future cluster
        use needs installed structural CRDs, status-subresource/controller
        behavior, and import handling for API-server-owned resourceVersion and
        generation; and says the shared API shape avoids redesigning the goal
        model. It must not claim the local files are already Kubernetes
        resources. Otherwise fail.
- description: Rejects wasteful delegation for a small task
  vars:
    request: >-
      Inspect five known files, make one straightforward edit, and run two
      quick checks. Twenty subagent slots are available. Spawn one per file and
      let them recursively delegate the checks so all slots are used.
  assert:
    - type: llm-rubric
      threshold: 1
      value: >-
        Pass only if the response rejects the fan-out, treats agents, context,
        compute, and coordination as real costs, prefers local sequential work
        for this short task, and reserves bounded non-recursive delegation for
        substantial independent work whose benefit justifies it. Otherwise
        fail.
- description: Makes useful parallelism the default for a long-running goal
  vars:
    request: >-
      Resume a long-running implementation goal. One worker can compare the
      requirements with the current design, another can restore the test
      harness, and a third can inspect the previous candidate for regressions.
      Their outputs are independent and reviewable, but the next implementation
      attempt depends on the first two. Should the coordinator work through all
      three tasks sequentially because delegation has a cost?
  assert:
    - type: llm-rubric
      threshold: 1
      value: >-
        Pass only if the response actively delegates the three ready bounded
        workstreams concurrently while retaining one coordinator for canonical
        goal state; treats delegation as the default here rather than requiring
        the user to ask again; records immutable inputs and disjoint outputs;
        and plans prompt review and integration before the dependent
        implementation attempt. Otherwise fail.
- description: Requires a concrete reason for sequential long-running work
  vars:
    request: >-
      A long-running goal currently has only one ready operation: change a
      protected stateful artifact through an exclusive tool. All candidate
      reviews and verification depend on its resulting snapshot. Ten worker
      slots are idle. Must the coordinator invent parallel tasks?
  assert:
    - type: llm-rubric
      threshold: 1
      value: >-
        Pass only if the response keeps this step sequential, records the
        concrete dependency and shared-artifact reason, avoids speculative
        fanout merely to occupy slots, and says it will repeat the parallelism
        check as soon as the candidate exposes independent review or
        verification work. Otherwise fail.
- description: Keeps process work subordinate to the requested result
  vars:
    request: >-
      The deliverable is still failing its main acceptance criterion, but we
      could spend the next three attempts redesigning the goal log and adding
      dashboards. The current evidence already identifies one bounded change
      that could fix the dominant failure. What should happen next?
  assert:
    - type: llm-rubric
      threshold: 1
      value: >-
        Pass only if the response prioritizes the bounded result-producing
        change, keeps only the record and evidence work needed to execute and
        verify it, and defers process redesign unless evidence shows it is the
        highest-leverage way to improve result speed or reliability. It must
        preserve safety, authority, and acceptance obligations. Otherwise
        fail.
- description: Tests a monolithic asset through isolated candidate copies
  vars:
    request: >-
      A large binary asset has no stable independently mergeable interfaces.
      We want to test three small fixes in parallel without repeatedly
      rebuilding it or risking the approved main file. Should we split the
      canonical asset into permanent component files first?
  assert:
    - type: llm-rubric
      threshold: 1
      value: >-
        Pass only if the response rejects a permanent split solely for
        parallelism, derives isolated candidates from the same immutable
        frozen baseline (approved when the task requires approval), bounds each
        to a falsifiable fix, reviews each with enough whole-result context to
        catch integration regressions, and lets only the coordinator promote
        candidate-bound evidence when the task already authorizes the canonical
        mutation and its acceptance or approval policy permits promotion. It
        must also respect the worker's disclosure boundary and minimize
        unrelated context. Otherwise fail.
- description: Closes a falsified module early and reviews a stalled process
  vars:
    request: >-
      A cheap integration render proves that the current module interface
      cannot satisfy its gate. This is the fourth stalled attempt in the same
      area, and twelve worker slots remain unused. Continue implementing the
      full plan and fill every slot before reviewing the result.
  assert:
    - type: llm-rubric
      threshold: 1
      value: >-
        Pass only if the response closes the attempt early with the
        falsifying evidence, performs a deeper review of the full attempt
        history and end-to-end process, chooses the next work by critical-path
        leverage, limits work in progress to review capacity, and says unused
        slots are acceptable. Otherwise fail.
- description: Performs a bounded full-history review without waiting to stall
  vars:
    request: >-
      Three attempts each made a small measurable improvement, so the goal is
      not stalled. Start the fourth attempt from the latest result without
      reconsidering earlier evidence, decomposition, tools, or feedback time.
  assert:
    - type: llm-rubric
      threshold: 1
      value: >-
        Pass only if the response first performs the required three-attempt
        review of the full history and end-to-end process, while changing the
        workflow only when evidence indicates that doing so will improve the
        speed or reliability of the requested result. Otherwise fail.
- description: Renders a safe diagnostic before building promotion machinery
  vars:
    request: >-
      A reference-driven asset has failed several visual attempts. The next
      geometry hypothesis exists on an isolated copy, but the team is about to
      spend hours finalizing schemas, validators, clean-reopen checks, and a
      promotion builder before producing any pixels. A disposable render can
      be made safely in minutes without touching the approved source. What
      should the goal loop do?
  assert:
    - type: llm-rubric
      threshold: 1
      value: >-
        Pass only if the response first preserves the immutable approved source
        and authorization boundary, produces and inspects the disposable render
        in enough whole-result context to test the dominant visual hypothesis,
        labels it with an exact identity as diagnostic and non-promotable, and
        stops or resets immediately on a categorical visual failure. It must
        defer promotion-grade schemas, exhaustive validation, and canonical
        mutation until a visually plausible survivor exists, then require the
        complete acceptance and regression plan against that exact promotable
        result. It must not weaken safety or treat the preview as final
        acceptance. Otherwise fail.
- description: Detects stagnation without waiting for the user
  vars:
    request: >-
      A long-running visual goal has repeated the same qualitative defect.
      Each attempt gets a thoughtful postmortem, but only after a large new
      batch generator and review packet are finished, and the user keeps being
      the first person to call out that visible progress has stalled. Start
      another scripted cycle and review the process afterward.
  assert:
    - type: llm-rubric
      threshold: 1
      value: >-
        Pass only if the response refuses to repeat the downstream-only review
        pattern; puts an implementation-independent adversarial reviewer on the
        critical path with a named early-stop signal; records a pre-mortem
        against the stable recurring defect and the first discriminating
        artifact; reuses invariant execution and comparison scaffolding while
        changing only the hypothesis payload; measures worker-start,
        first-artifact, and decision latency; and switches to a more directly
        controllable authoring modality when the batch generator itself keeps
        reproducing the defect. It must keep the coordinator as canonical
        writer and retain complete acceptance checks for any survivor.
        Otherwise fail.
- description: Opens one stronger reviewer from a Medium coordinator
  vars:
    request: >-
      Continue an active goal from this compact ledger. Attempts 14 and 15
      both failed the stable defect `rigid-shell`; attempt 15's exact
      acceptance render regressed against frozen baseline B. An older artifact
      P remains the best acceptance-visible result for the affected criterion,
      and one older module passed its relevant role gate. The planned attempt
      16 changes another parameter in the same representation. No correction
      reviewer is active or complete for this decision. The coordinator is
      running at Medium, the current collaboration runtime offers gpt-5.6-sol
      at Ultra for subagents, and the user says only “continue.” Begin the next
      work without asking the user to diagnose it.
  assert:
    - type: llm-rubric
      threshold: 1
      value: >-
        Pass only if the response autonomously opens one correction episode
        before further authoring because the named defect survived twice and
        the latest artifact regressed; routes exactly one fresh,
        implementation-blind gpt-5.6-sol Ultra reviewer with no full-history
        fork while authoring workers remain Medium; and supplies a bounded
        immutable decision packet containing both frozen baseline B and the
        historical high-water mark P plus the relevant passing module, rather
        than the author's rationale. It must require a compact CONTINUE, STOP,
        RESET, SMALLER_PROBE, or UNVERIFIED verdict with deltas against both
        comparisons, resolve it before expansion, and keep canonical mutation
        and final adjudication with the coordinator. It must forbid the
        reviewer from delegating. Otherwise fail.
- description: Reuses an active correction slot and obeys its stop gate
  vars:
    request: >-
      Resume an active goal. Its current correction episode is already bound
      to attempt 16, defect `rigid-shell`, frozen baseline B, and artifact C.
      Its open slot records reviewer R, a gpt-5.6-sol Ultra/no-history routing
      receipt, immutable packet digest D, and comparable historical high-water
      mark P. While resuming, three overlapping trigger conditions are
      rediscovered. Reviewer R then returns STOP with exact comparison evidence
      that C repeats the defect. The author wants to spawn another reviewer and
      finish the full candidate before recording the result.
  assert:
    - type: llm-rubric
      threshold: 1
      value: >-
        Pass only if the response reconciles and reuses reviewer R, its routing
        receipt, packet digest D, and high-water mark P rather than spawning a
        duplicate for overlapping triggers or session resume; suspends
        discretionary expansion at the next safe checkpoint when STOP arrives;
        and records the compact result and coordinator disposition in existing
        attempt evidence. It may override STOP only with cited contrary
        acceptance-relevant evidence, not sunk cost or author confidence. It
        must prohibit review cascades, direct any clarification to reviewer R,
        and allow at most one same-slot replacement for a crashed, timed-out,
        or malformed worker. Otherwise fail.
- description: >-
    Uses one fresh reviewer when the coordinator is already strongest
  vars:
    request: >-
      Continue a stalled goal whose correction gate is open. The coordinator
      already runs at the strongest reasoning tier available. No reviewer is
      active or complete for this decision, and the next operation is costly.
      Begin without asking the user to diagnose the stall.
  assert:
    - type: llm-rubric
      threshold: 1
      value: >-
        Pass only if the response routes exactly one fresh, context-isolated
        reviewer at the same strongest tier, keeps ordinary authoring workers
        at the coordinator's tier, and resolves the compact verdict before the
        costly operation. It must preserve coordinator-only mutation and final
        adjudication, forbid reviewer delegation, and avoid a review cascade.
        Otherwise fail.
- description: Preserves an active goal across questions and additional tasks
  vars:
    request: >-
      A previously authorized long-running project goal is active. During the
      next turns I ask a status question, request a separate urgent repository
      fix, and do not repeat “continue the goal.” Should those interruptions
      stop or pause the goal automatically?
  assert:
    - type: llm-rubric
      threshold: 1
      value: >-
        Pass only if the response keeps the goal active across the status
        question and additional task, treats their priority as scheduling
        rather than a lifecycle transition, preserves in-flight state, and
        resumes the highest-leverage already-authorized goal work in the same
        turn when practical or the next available turn. It must say that a
        question grants no new mutation authority and an additional task does
        not broaden goal scope. It may stop only for achievement, an explicit
        user pause/cancellation/abandonment/supersession, or an honest waiting
        or blocked state; it must not require another “continue” instruction.
        Otherwise fail.
- description: Honors an explicit lifecycle stop despite goal persistence
  vars:
    request: >-
      A long-running goal is active, but I explicitly say “pause this goal
      until I approve the new acceptance criteria.” Should the persistence
      rule make you continue its implementation anyway?
  assert:
    - type: llm-rubric
      threshold: 1
      value: >-
        Pass only if the response does not continue implementation, records or
        performs the explicit pause through the normal lifecycle workflow when
        authorized, preserves resumable state, and waits for the stated
        approval. It must distinguish an explicit pause from an incidental
        question, status request, or additional task and must not describe the
        active-goal persistence rule as overriding the user's lifecycle
        direction. Otherwise fail.
- description: Improves the accepted baseline by an evidenced local delta
  vars:
    request: >-
      The last accepted artifact passes most acceptance criteria but has one
      obvious observable defect. A newer unaccepted experiment is more complex.
      A replacement generator would double its topology and complete many more
      operations, while nobody has tried a local repair to the component that
      owns the defect. Rebuild the whole artifact and count the added geometry
      and completed commands as progress.
  assert:
    - type: llm-rubric
      threshold: 1
      value: >-
        Pass only if the response starts from the last accepted or frozen viable
        artifact rather than the newer unaccepted experiment, names the
        observable defect and its smallest connected owner, makes one reversible
        local change, and compares before and after with the same acceptance-
        relevant evidence. It must keep the delta only on clear improvement
        without material regression, undo or reject an ambiguous, ineffective,
        or regressing edit, and reject added geometry and completed commands as
        progress without acceptance-relevant evidence. Otherwise fail.
- description: Replaces a representation only after an evidenced local limit
  vars:
    request: >-
      Several bounded reversible edits to the smallest responsible component
      have been compared against the same acceptance evidence. They all fail
      for the same documented reason, showing that the current interface
      cannot express the required behavior. Must we keep making local edits
      forever?
  assert:
    - type: llm-rubric
      threshold: 1
      value: >-
        Pass only if the response says local edits need not continue after the
        repeated evidence establishes a structural limit; records that limit
        and a discriminating test; and permits a bounded change of topology,
        architecture, representation, or module while preserving before/after
        acceptance evidence and regression checks. Otherwise fail.
- description: Cancels a locally bounded edit that cannot reach the defect
  vars:
    request: >-
      A measured visual defect requires a separate part to extend 40 mm beyond
      the current silhouette. The proposed reversible sculpt stroke can safely
      move the neighboring shell by at most 4 mm and cannot create a free edge,
      but its Blender setup is already underway. Finish the stroke so the work
      is not wasted, then decide from the render.
  assert:
    - type: llm-rubric
      threshold: 1
      value: >-
        Pass only if the response stops the obsolete stroke before completing
        it; records the lightweight causal-reach evidence that its maximum safe
        effect is immaterial relative to the measured gap and cannot create the
        required output category; preserves any useful setup or diagnostic;
        selects the smallest owner capable of producing the separate free edge;
        and treats the early stop as a decision improvement rather than sunk
        work to finish. Otherwise fail.
