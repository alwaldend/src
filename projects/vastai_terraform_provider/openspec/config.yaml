schema: spec-driven

context: |
  This workspace owns the Vast.ai Terraform provider,
  offline Terraform acceptance suite, packaging, examples, project documentation,
  and non-compute Terraform test root. Offline tests never contact live
  infrastructure. infra/vastai owns team and token bootstrap; infra/vault owns
