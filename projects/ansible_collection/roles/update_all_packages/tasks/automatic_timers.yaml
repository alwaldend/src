- name: Validate installed automatic-update services before timer activation
  ansible.builtin.import_tasks: automatic_safety.yaml

- name: Enable native APT package metadata refresh
  ansible.builtin.systemd_service:
    name: apt-daily.timer
    enabled: true
    state: started
  when:
    - update_all_packages_backend == 'apt'
    - update_all_packages_automatic_enabled | bool

- name: Set native automatic-installation timer state
  ansible.builtin.systemd_service:
    name: "{{ update_all_packages_automatic_backends[update_all_packages_backend].timer }}"
    enabled: true
    state: started
  when: update_all_packages_automatic_enabled | bool

- name: Find installed native installation timers before disabling updates
  ansible.builtin.command:
    argv: >-
      {{ ['systemctl', 'list-unit-files', '--type=timer', '--no-legend', '--no-pager']
         + (update_all_packages_dnf_installation_timers
            if update_all_packages_backend in ['dnf', 'dnf5']
            else [update_all_packages_automatic_backends[update_all_packages_backend].timer]) }}
  register: update_all_packages_installed_timers
  check_mode: false
  changed_when: false
  when: not update_all_packages_automatic_enabled | bool

- name: Stop and disable each installed native installation timer
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: false
    state: stopped
  loop: "{{ update_all_packages_installed_timers.stdout_lines | default([]) | map('split') | map('first') | list }}"
  when: not update_all_packages_automatic_enabled | bool
