- tags:
    - update_all_packages
  block:
    - name: Update all packages
      ansible.builtin.package:
        name: "*"
        state: latest
    - name: Determine the reboot requirement for this package manager
      ansible.builtin.import_tasks: reboot_required.yaml
    - name: Reboot the server
      ansible.builtin.reboot:
      when:
        - update_all_packages_reboot_enabled
        - update_all_packages_reboot_required
