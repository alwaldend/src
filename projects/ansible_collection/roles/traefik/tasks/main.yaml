- name: Configure Traefik
  tags: [traefik]
  block:
    - name: Require separate configuration and runtime write paths
      ansible.builtin.assert:
        that:
          - traefik_owner != traefik_user
          - traefik_data_dir != traefik_dir
          - traefik_log_dir != traefik_dir
          - not item.startswith(traefik_data_dir.rstrip('/') + '/')
          - not item.startswith(traefik_log_dir.rstrip('/') + '/')
          - item not in [traefik_data_dir, traefik_log_dir]
      loop:
        - "{{ traefik_config_dir }}"
        - "{{ traefik_config_path }}"
        - "{{ traefik_dynamic_config_path }}"
        - "{{ traefik_tls_dir }}"
        - "{{ traefik_bin_path }}"
        - "{{ traefik_eab_cache_path }}"

    - name: Create Traefik user
      when: not traefik_no_user
      ansible.builtin.user:
        name: "{{ traefik_user }}"
        uid: "{{ traefik_user_uid }}"
        shell: /sbin/nologin
        home: "{{ traefik_dir }}/home"
        system: true

    - name: Create filesystem on the Traefik disk
      when: traefik_disk is truthy
      community.general.filesystem:
        fstype: ext4
        dev: "{{ traefik_disk }}"

    - name: Mount Traefik disk
      when: traefik_disk is truthy
      ansible.posix.mount:
        path: "{{ traefik_dir }}"
        src: "{{ traefik_disk }}"
        fstype: ext4
        state: mounted

    - name: Protect configuration directories and their common parent
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ traefik_owner }}"
        group: "{{ traefik_user }}"
        mode: "0750"
      loop:
        - "{{ traefik_dir }}"
        - "{{ traefik_config_dir }}"
        - "{{ traefik_tls_dir }}"

    - name: Create service-writable runtime directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ traefik_user }}"
        group: "{{ traefik_user }}"
        mode: "0700"
      loop:
        - "{{ traefik_data_dir }}"
        - "{{ traefik_log_dir }}"

    - name: Prepare persistent ACME enrollment
      when: not traefik_disable_eab
      ansible.builtin.include_tasks: enrollment.yaml

    - name: Render and validate both candidate configurations
      no_log: true
      ansible.builtin.set_fact:
        traefik_rendered_config: >-
          {{ lookup('ansible.builtin.template', traefik_config_local_path) |
             alwaldend.main.validate_traefik_config(traefik_config_path) }}
        traefik_rendered_dynamic_config: >-
          {{ lookup('ansible.builtin.template', traefik_dynamic_config_local_path) |
             alwaldend.main.validate_traefik_config(traefik_dynamic_config_path) }}

    - name: Record whether an existing proxy needs recovery on failure
      ansible.builtin.command:
        argv: "{{ ['systemctl'] + (['--user'] if traefik_service_scope == 'user' else []) + ['is-active', traefik_service_path | basename] }}"
      register: traefik_previous_service
      changed_when: false
      failed_when: false

    - name: Initialize this activation's recovery records
      ansible.builtin.set_fact:
        traefik_bin_var: {}
        traefik_config_var: {}
        traefik_dynamic_config_var: {}
        traefik_ca_var: {}
        traefik_service_var: {}

    - name: Install and activate a recoverable candidate
      block:
        - name: Install candidate files and activate changed startup inputs
          ansible.builtin.include_tasks: install.yaml
      rescue:
        - name: Restore available previous deployment files
          no_log: true
          ansible.builtin.copy:
            src: "{{ item.backup_file }}"
            dest: "{{ item.dest }}"
            remote_src: true
            owner: "{{ traefik_owner }}"
            group: "{{ traefik_user }}"
            mode: preserve
          when: item.backup_file is defined
          loop:
            - "{{ traefik_config_var }}"
            - "{{ traefik_dynamic_config_var }}"
            - "{{ traefik_ca_var }}"
            - "{{ traefik_bin_var }}"
            - "{{ traefik_service_var }}"

        - name: Clear startup rate limits before recovery
          when: traefik_previous_service.rc == 0
          ansible.builtin.command:
            argv: "{{ ['systemctl'] + (['--user'] if traefik_service_scope == 'user' else []) + ['reset-failed', traefik_service_path | basename] }}"
          changed_when: false

        - name: Recover the previously running proxy
          when: traefik_previous_service.rc == 0
          ansible.builtin.systemd_service:
            name: "{{ traefik_service_path | basename }}"
            daemon_reload: true
            state: restarted
            scope: "{{ traefik_service_scope }}"

        - name: Remove recovery copies only after successful restoration
          ansible.builtin.include_tasks: cleanup_backups.yaml

        - name: Report rejected activation
          ansible.builtin.fail:
            msg: "Traefik activation failed. Available prior files were restored; a previously running service was restarted. Inspect the service journal before retrying."

    - name: Remove completed configuration backups
      ansible.builtin.include_tasks: cleanup_backups.yaml
