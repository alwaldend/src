[Unit]
Description=OpenHands Agent Canvas
Wants=network-online.target
After=network-online.target

[Service]
Type=simple
User={{ openhands_canvas_user }}
Group={{ openhands_canvas_user }}
WorkingDirectory={{ openhands_canvas_work_dir }}
EnvironmentFile={{ openhands_canvas_env_path }}
Environment=HOME={{ openhands_canvas_home_dir }}
Environment=PATH={{ openhands_canvas_dir }}/bin:/usr/local/bin:/usr/bin:/bin
ExecStart=/usr/bin/node {{ openhands_canvas_package_dir }}/scripts/static-server.mjs --dir {{ openhands_canvas_package_dir }}/build --host {{ openhands_canvas_host }} --port {{ openhands_canvas_port }}
Restart=on-failure
RestartSec=5

[Install]
WantedBy=multi-user.target
