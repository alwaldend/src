- name: Configure SELinux policy for HTTP ports
  ansible.builtin.import_tasks: selinux.yml
  when:
    - socket_proxy_selinux_allow_http_ports | bool
    - ansible_facts.selinux.status == "enabled"

- name: Install the socket and proxy units
  ansible.builtin.template:
    src: "proxy.{{ item }}.j2"
    dest: "/etc/systemd/system/{{ socket_proxy_name }}.{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - socket
    - service
  register: socket_proxy_units

- name: Enable the socket
  ansible.builtin.systemd_service:
    name: "{{ socket_proxy_name }}.socket"
    daemon_reload: "{{ socket_proxy_units.changed }}"
    enabled: true
    state: >-
      {{ 'restarted' if socket_proxy_units.changed
      or (socket_proxy_selinux_policy | default({})) is changed else 'started' }}
