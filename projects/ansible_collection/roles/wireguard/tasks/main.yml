- name: Set up wireguard
  tags:
    - wireguard
  block:
    - name: Install wireguard
      ansible.builtin.package:
        name:
          - wireguard-tools
        state: present
    - name: Create wireguard directory
      ansible.builtin.file:
        path: "{{ wireguard_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0700"
    - name: Generate wireguard config
      loop: "{{ wireguard_local_config_paths }}"
      ansible.builtin.template:
        dest: "{{ wireguard_dir }}/{{ item | basename }}"
        src: "{{ item }}"
        owner: "root"
        group: "root"
        mode: "600"
    - name: Start wireguard and enable on boot
      loop: "{{ wireguard_local_config_paths }}"
      ansible.builtin.systemd:
        name: "wg-quick@{{ item | basename | trim('.conf') }}"
        enabled: true
        state: restarted
        daemon_reload: true
  always:
    - name: Show service status
      loop: "{{ wireguard_local_config_paths }}"
      ansible.builtin.command:
        argv:
          - systemctl
          - status
          - "wg-quick@{{ item | basename | trim('.conf') }}"
