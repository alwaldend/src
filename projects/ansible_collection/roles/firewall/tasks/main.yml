- name: Setup firewall
  tags:
    - firewall
  when: firewall_enabled
  block:
    - name: Install ufw
      ansible.builtin.package:
        name: ufw
        state: present
    - name: Check if firewalld exists
      register: firewall_firewalld_stat
      ansible.builtin.stat:
        path: "/lib/systemd/system/firewalld.service"
    - name: Disable firewalld
      when: firewall_firewalld_stat.stat.exists
      ansible.builtin.systemd_service:
        name: "firewalld"
        enabled: false
        state: stopped
    - name: Prevent later package installation from activating firewalld
      ansible.builtin.systemd_service:
        name: firewalld
        masked: true
    - name: Enable UFW startup and restore its existing policy before updates
      when: firewall_state == 'enabled'
      ansible.builtin.systemd_service:
        name: ufw
        enabled: true
        state: started
    - name: Enable ufw logging
      community.general.ufw:
        logging: low
    - name: Deny incoming connections
      community.general.ufw:
        default: deny
        direction: incoming
    - name: Allow outgoing connections
      community.general.ufw:
        default: allow
        direction: outgoing
    - name: Install desired access and delete explicitly retired rules
      ansible.builtin.import_tasks: rules.yaml
    - name: Enable ufw with the configured policy
      community.general.ufw:
        state: "{{ firewall_state }}"
    - name: Disable UFW startup when its policy is disabled
      when: firewall_state == 'disabled'
      ansible.builtin.systemd_service:
        name: ufw
        enabled: false
        state: stopped
