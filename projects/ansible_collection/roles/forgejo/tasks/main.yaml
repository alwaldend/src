- name: Configure Forgejo with guarded activation
  tags: [forgejo]
  block:
    - name: Require normal execution for the controlled upgrade transaction
      ansible.builtin.assert:
        that: not ansible_check_mode
        fail_msg: Forgejo upgrades require real backup and health checks; check mode is unsupported.

    - name: Install packages
      when: forgejo_manage_packages
      ansible.builtin.package:
        name: [acl, git, git-lfs]

    - name: Create Forgejo user
      when: forgejo_manage_user
      ansible.builtin.user:
        name: "{{ forgejo_user }}"
        uid: "{{ forgejo_user_uid }}"
        shell: /sbin/nologin
        home: "{{ forgejo_dir }}/home"
        system: true

    - name: Create filesystem on the Forgejo disk
      when: forgejo_disk is truthy
      community.general.filesystem:
        fstype: ext4
        dev: "{{ forgejo_disk }}"

    - name: Mount Forgejo disk
      when: forgejo_disk is truthy
      ansible.posix.mount:
        path: "{{ forgejo_dir }}"
        src: "{{ forgejo_disk }}"
        fstype: ext4
        state: mounted

    - name: Create Forgejo runtime directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ forgejo_user }}"
        group: "{{ forgejo_group }}"
        mode: "0700"
      loop:
        - "{{ forgejo_dir }}"
        - "{{ forgejo_data_dir }}"
        - "{{ forgejo_config_dir }}"
        - "{{ forgejo_work_dir }}"
        - "{{ forgejo_log_dir }}"

    - name: Inspect and validate candidate inputs
      ansible.builtin.include_tasks: preflight.yaml

    - name: Activate changed startup inputs
      when: forgejo_activation_required
      ansible.builtin.include_tasks: activate.yaml

    - name: Ensure an unchanged installation is enabled and running
      when: not forgejo_activation_required
      ansible.builtin.systemd_service:
        name: "{{ forgejo_service_path | basename }}"
        enabled: true
        state: started

    - name: Verify the running Forgejo version and health
      when: not forgejo_activation_required
      ansible.builtin.include_tasks: verify.yaml

    - name: Report accepted activation and its recovery location
      when: forgejo_activation_required
      ansible.builtin.debug:
        msg: "Forgejo {{ forgejo_candidate_version }} accepted. Recovery directory: {{ forgejo_recovery_directory | default('none for a fresh installation', true) }}."
  always:
    - name: Remove only this invocation's private staging files
      when: forgejo_stage_directory.path is defined
      no_log: true
      ansible.builtin.file:
        path: "{{ forgejo_stage_directory.path }}"
        state: absent
