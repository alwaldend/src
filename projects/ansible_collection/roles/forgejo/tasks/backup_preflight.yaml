- name: Require explicit normalized absolute recovery paths
  ansible.builtin.assert:
    that:
      - forgejo_backup_paths | length > 0
      - item is string and item is abs
      - item == (item | ansible.builtin.normpath)
      - item != '/' and not item.startswith('//')
    fail_msg: Declare normalized absolute backup paths, excluding the filesystem root.
  loop: "{{ forgejo_backup_paths + [forgejo_backup_dir, forgejo_database_path] }}"

- name: Resolve recovery storage and inputs on the managed host
  ansible.builtin.command:
    argv: [realpath, --canonicalize-missing, --, "{{ item }}"]
    expand_argument_vars: false
    strip_empty_ends: false
  changed_when: false
  loop: "{{ [forgejo_backup_dir] + forgejo_backup_paths }}"
  register: forgejo_backup_physical_paths

- name: Require physically separate recovery storage
  vars:
    # Remove only realpath's delimiter, preserving filename whitespace.
    forgejo_resolved_recovery_path: "{{ forgejo_backup_physical_paths.results[0].stdout[:-1] }}"
    forgejo_resolved_archive_path: "{{ item.stdout[:-1] }}"
  ansible.builtin.assert:
    that:
      - forgejo_resolved_recovery_path != '/' and forgejo_resolved_archive_path != '/'
      - forgejo_resolved_recovery_path != forgejo_resolved_archive_path
      - not forgejo_resolved_recovery_path.startswith(forgejo_resolved_archive_path + '/')
      - not forgejo_resolved_archive_path.startswith(forgejo_resolved_recovery_path + '/')
    fail_msg: Forgejo recovery storage must be separate from its backup inputs.
  loop: "{{ forgejo_backup_physical_paths.results[1:] }}"

- name: Record the declared coverage boundary
  ansible.builtin.set_fact:
    forgejo_backup_coverage: "^({{ forgejo_backup_paths | map('regex_escape') | join('|') }})(?:/|$)"

- name: Require coverage of managed state and startup files
  ansible.builtin.assert:
    that: item is match(forgejo_backup_coverage)
    fail_msg: Declare backup coverage for the managed Forgejo tree, SQLite database and startup files.
  loop: >-
    {{ [forgejo_dir, forgejo_work_dir, forgejo_data_dir, forgejo_log_dir, forgejo_database_path]
       + (forgejo_managed_startup_files | map(attribute='path') | list) }}
