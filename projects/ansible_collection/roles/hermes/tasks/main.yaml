- tags:
    - hermes
  block:
    - name: Install Hermes dependencies
      ansible.builtin.package:
        name:
          - curl
          - git
          - python3
          - nodejs
          - npm
    - name: Create Hermes user
      ansible.builtin.user:
        name: "{{ hermes_user }}"
        uid: "{{ hermes_user_uid }}"
        shell: /bin/bash
        home: "{{ hermes_home_dir }}"
        system: true
    - name: Enable lingering for hermes user
      ansible.builtin.command:
        argv:
          - loginctl
          - enable-linger
          - "{{ hermes_user }}"
    - name: Create filesystem on the Hermes disk
      when: hermes_disk is truthy
      community.general.filesystem:
        fstype: ext4
        dev: "{{ hermes_disk }}"
    - name: Mount Hermes disk
      when: hermes_disk is truthy
      ansible.posix.mount:
        path: "{{ hermes_dir }}"
        src: "{{ hermes_disk }}"
        fstype: ext4
        state: mounted
    - name: Create Hermes directories
      loop:
        - "{{ hermes_dir }}"
        - "{{ hermes_home_dir }}"
      ansible.builtin.file:
        state: directory
        owner: "{{ hermes_user }}"
        group: "{{ hermes_user }}"
        mode: "0700"
        path: "{{ item }}"
    - name: Copy the Hermes installer
      register: hermes_installer_result
      ansible.builtin.copy:
        src: "{{ hermes_installer_local_path }}"
        dest: "{{ hermes_installer_path }}"
        owner: root
        group: "{{ hermes_user }}"
        mode: "0750"
    - name: Install Hermes Agent
      become_user: "{{ hermes_user }}"
      ansible.builtin.command:
        argv:
          - "{{ hermes_installer_path }}"
          - --dir
          - "{{ hermes_install_dir }}"
          - --hermes-home
          - "{{ hermes_home_dir }}/.hermes"
          - --skip-setup
          - --non-interactive
          - --skip-browser
        creates: "{{ hermes_install_dir }}/venv/bin/hermes"
    - name: Write the Hermes config
      ansible.builtin.template:
        src: "{{ hermes_config_local_path }}"
        dest: "{{ hermes_config_path }}"
        owner: root
        group: "{{ hermes_user }}"
        mode: "0640"
    - name: Write the Hermes environment
      ansible.builtin.copy:
        content: |
          {% for key, value in hermes_env.items() %}
          {{ key }}={{ value }}
          {% endfor %}
        dest: "{{ hermes_env_path }}"
        owner: "{{ hermes_user }}"
        group: "{{ hermes_user }}"
        mode: "0600"
    - name: Install Hermes gateway
      become_user: "{{ hermes_user }}"
      ansible.builtin.command:
        argv:
          - hermes
          - gateway
          - install
    - name: Start Hermes gateway
      become_user: "{{ hermes_user }}"
      ansible.builtin.command:
        argv:
          - hermes
          - gateway
          - start
    - name: Check Hermes status with doctor
      become_user: "{{ hermes_user }}"
      ansible.builtin.command:
        argv:
          - hermes
          - doctor
      register: doctor_result
    - name: Display doctor results
      ansible.builtin.debug:
        msg: "Doctor check result: {{ doctor_result.stdout }}"
    - name: Check Hermes gateway status
      become_user: "{{ hermes_user }}"
      ansible.builtin.command:
        argv:
          - hermes
          - gateway
          - status
      register: gateway_status_result
    - name: Display gateway status
      ansible.builtin.debug:
        msg: "Gateway status: {{ gateway_status_result.stdout }}"
    - name: Write the Hermes dashboard service
      register: hermes_dashboard_service_result
      ansible.builtin.template:
        src: systemd_dashboard.conf
        dest: "{{ hermes_dashboard_service_path }}"
        owner: root
        group: root
        mode: "0644"
    - name: Reload systemd for the Hermes dashboard
      when: hermes_dashboard_service_result.changed
      ansible.builtin.systemd_service:
        daemon_reload: true
    - name: Enable and start the Hermes dashboard
      ansible.builtin.systemd_service:
        name: "{{ hermes_dashboard_service_path | basename }}"
        enabled: true
        state: started