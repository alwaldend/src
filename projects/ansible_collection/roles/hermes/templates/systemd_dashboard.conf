[Unit]
Description=Hermes Agent Web Dashboard
Wants=network-online.target
After=network-online.target

[Service]
Type=simple
User={{ hermes_user }}
Group={{ hermes_user }}
WorkingDirectory={{ hermes_install_dir }}
EnvironmentFile={{ hermes_home_dir }}/.hermes/.env
Environment=PATH={{ hermes_install_dir }}/venv/bin:/usr/local/bin:/usr/bin:/bin
ExecStart={{ hermes_install_dir }}/venv/bin/python -m hermes_cli.main dashboard --host 127.0.0.1 --port {{ hermes_dashboard_port }} --no-open --skip-build
Restart=on-failure
RestartSec=5

[Install]
WantedBy=default.target
