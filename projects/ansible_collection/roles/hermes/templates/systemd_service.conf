[Unit]
Description=Hermes Agent gateway
After=network-online.target
Wants=network-online.target

[Service]
Type=simple
User={{ hermes_user }}
Group={{ hermes_user }}
WorkingDirectory={{ hermes_home_dir }}
EnvironmentFile={{ hermes_env_path }}
ExecStart={{ hermes_install_dir }}/venv/bin/hermes gateway
Restart=on-failure
RestartSec=5s

[Install]
WantedBy=multi-user.target
