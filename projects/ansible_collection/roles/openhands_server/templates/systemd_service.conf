[Unit]
Description=OpenHands agent server
Wants=network-online.target
After=network-online.target

[Service]
Type=simple
User={{ openhands_server_user }}
Group={{ openhands_server_user }}
WorkingDirectory={{ openhands_server_work_dir }}
EnvironmentFile={{ openhands_server_env_path }}
Environment=HOME={{ openhands_server_home_dir }}
Environment=PATH={{ openhands_server_venv_dir }}/bin:/usr/local/bin:/usr/bin:/bin
ExecStart={{ openhands_server_venv_dir }}/bin/agent-server --host {{ openhands_server_host }} --port {{ openhands_server_port }} --import-modules {{ openhands_server_import_modules }}
Restart=on-failure
RestartSec=5

[Install]
WantedBy=multi-user.target
