[Unit]
Description=OpenHands automation server
Wants=network-online.target
After=network-online.target

[Service]
Type=simple
User={{ openhands_automation_user }}
Group={{ openhands_automation_user }}
WorkingDirectory={{ openhands_automation_dir }}
EnvironmentFile={{ openhands_automation_env_path }}
Environment=HOME={{ openhands_automation_home_dir }}
Environment=PATH={{ openhands_automation_venv_dir }}/bin:/usr/local/bin:/usr/bin:/bin
ExecStart={{ openhands_automation_venv_dir }}/bin/uvicorn openhands.automation.app:app --host {{ openhands_automation_host }} --port {{ openhands_automation_port }}
Restart=on-failure
RestartSec=5

[Install]
WantedBy=multi-user.target
