[Unit]
Description=T3 Code server
Wants=network-online.target
After=network-online.target

[Service]
Type=simple
User={{ t3code_user }}
Group={{ t3code_user }}
WorkingDirectory={{ t3code_work_dir }}
EnvironmentFile={{ t3code_env_path }}
Environment=PATH=/usr/local/bin:/usr/bin:/bin
ExecStart=/usr/bin/npx --yes t3@{{ t3code_version }} serve --mode web --host 127.0.0.1 --port {{ t3code_port }} --base-dir {{ t3code_state_dir }} --no-browser
Restart=on-failure
RestartSec=5

[Install]
WantedBy=default.target
