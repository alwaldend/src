- tags:
    - t3code
  block:
    - name: Validate the T3 Code installation method
      ansible.builtin.assert:
        that:
          - t3code_install_method in ['npm', 'standalone']
    - name: Require a verified standalone archive
      when: t3code_install_method == 'standalone'
      ansible.builtin.assert:
        that:
          - t3code_archive_url is match('^https://')
          - t3code_archive_checksum is match('^sha256:[a-f0-9]{64}$')
    - name: Install T3 Code dependencies
      when: t3code_install_method == 'npm'
      ansible.builtin.package:
        name:
          - nodejs
          - npm
          - acl
          - make
          - gcc-c++
    - name: Create T3 Code user
      ansible.builtin.user:
        name: "{{ t3code_user }}"
        uid: "{{ t3code_user_uid }}"
        shell: /bin/bash
        home: "{{ t3code_home_dir }}"
        system: false
    - name: Create filesystem on the T3 Code disk
      when: t3code_disk is truthy
      community.general.filesystem:
        fstype: ext4
        dev: "{{ t3code_disk }}"
    - name: Mount T3 Code disk
      when: t3code_disk is truthy
      ansible.posix.mount:
        path: "{{ t3code_dir }}"
        src: "{{ t3code_disk }}"
        fstype: ext4
        state: mounted
    - name: Create T3 Code directories
      loop:
        - "{{ t3code_home_dir }}"
        - "{{ t3code_state_dir }}"
        - "{{ t3code_work_dir }}"
      ansible.builtin.file:
        state: directory
        owner: "{{ t3code_user }}"
        group: "{{ t3code_user }}"
        mode: "0700"
        path: "{{ item }}"
    - name: Write the T3 Code environment
      no_log: true
      ansible.builtin.copy:
        content: |
          {% if t3code_install_method == 'npm' %}
          T3CODE_AUTH_TOKEN={{ t3code_auth_token }}
          {% endif %}
          {% for key, value in t3code_env.items() %}
          {{ key }}={{ value }}
          {% endfor %}
        dest: "{{ t3code_env_path }}"
        owner: root
        group: root
        mode: "0600"
      notify: Restart T3 Code
    - name: Seed first-start T3 Code settings
      when: t3code_initial_settings | length > 0
      block:
        - name: Create the T3 Code userdata directory
          ansible.builtin.file:
            path: "{{ t3code_state_dir }}/userdata"
            state: directory
            owner: "{{ t3code_user }}"
            group: "{{ t3code_user }}"
            mode: "0700"
        - name: Install initial settings without replacing UI changes
          no_log: true
          ansible.builtin.copy:
            content: "{{ t3code_initial_settings | to_nice_json }}\n"
            dest: "{{ t3code_state_dir }}/userdata/settings.json"
            force: false
            owner: "{{ t3code_user }}"
            group: "{{ t3code_user }}"
            mode: "0600"
          notify: Restart T3 Code
    - name: Install the package
      when: t3code_install_method == 'npm'
      community.general.npm:
        name: t3
        version: "{{ t3code_version }}"
        global: true
        state: present
      notify: Restart T3 Code
    - name: Install the standalone release
      when: t3code_install_method == 'standalone'
      block:
        - name: Protect standalone runtime directories
          ansible.builtin.file:
            path: "{{ item }}"
            state: directory
            owner: root
            group: root
            mode: "0755"
          loop:
            - "{{ t3code_dir }}"
            - "{{ t3code_dir }}/releases"
            - "{{ t3code_release_dir }}"
        - name: Download the verified standalone bundle
          ansible.builtin.get_url:
            url: "{{ t3code_archive_url }}"
            checksum: "{{ t3code_archive_checksum }}"
            dest: "{{ t3code_dir }}/releases/{{ t3code_version }}.tar.gz"
            owner: root
            group: root
            mode: "0644"
        - name: Extract the complete standalone bundle
          ansible.builtin.unarchive:
            src: "{{ t3code_dir }}/releases/{{ t3code_version }}.tar.gz"
            dest: "{{ t3code_release_dir }}"
            remote_src: true
            extra_opts: [--strip-components=1]
            owner: root
            group: root
          notify: Restart T3 Code
    - name: Write the T3 Code service
      register: t3code_service_result
      ansible.builtin.template:
        src: systemd_service.conf
        dest: "{{ t3code_service_path }}"
        owner: root
        group: root
        mode: "0644"
      notify: Restart T3 Code
    - name: Enable and start T3 Code
      ansible.builtin.systemd_service:
        name: "{{ t3code_service_path | basename }}"
        daemon_reload: "{{ t3code_service_result.changed }}"
        enabled: true
        state: started
