- name: Setup LVM logical volumes
  tags:
    - lvol
  block:
    - name: Create or resize logical volume
      loop: "{{ lvol_volumes }}"
      community.general.lvol:
        vg: "{{ item.vg }}"
        lv: "{{ item.lv }}"
        size: "{{ item.size }}"
        resizefs: "{{ item.resizefs | default(true) }}"
        force: "{{ item.force | default(false) }}"
        opts: "{{ item.opts | default(omit) }}"
        pvs: "{{ item.pvs | default(omit) }}"
        shrink: "{{ item.shrink | default(true) }}"
