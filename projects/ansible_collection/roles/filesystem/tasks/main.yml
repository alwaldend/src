- name: Setup filesystems
  tags:
    - filesystem
  block:
    - name: Create or resize filesystem
      loop: "{{ filesystem_setup }}"
      community.general.filesystem:
        dev: "{{ item.dev }}"
        fstype: "{{ item.fstype }}"
        opts: "{{ item.opts | default(omit) }}"
        resizefs: "{{ item.resizefs }}"
