---
- name: Converge real packaged Forgejo role
  hosts: molecule
  become: true
  vars_files:
    - vars.yml
    - "{{ lookup('env', 'MOLECULE_RUNNER_STATE') }}/fixture/revision.yml"
  tasks:
    - ansible.builtin.import_tasks: ../shared/lifecycle_before.yml
    - name: Apply Forgejo
      ansible.builtin.include_role:
        name: alwaldend.main.forgejo
    - name: Apply service handlers
      ansible.builtin.meta: flush_handlers
    - ansible.builtin.import_tasks: ../shared/lifecycle_after.yml
