---
- name: Read guest public host key
  ansible.builtin.slurp:
    src: "{{ fixture_host_key.path }}"
  register: fixture_public_key
- name: Stage public host key locally
  delegate_to: localhost
  become: false
  ansible.builtin.copy:
    content: "{{ fixture_public_key.content | b64decode }}"
    dest: "{{ fixture_dir }}/{{ fixture_host_key.path | basename }}"
    mode: "0600"
- name: Issue disposable host certificate
  delegate_to: localhost
  become: false
  ansible.builtin.command:
    argv:
      - ssh-keygen
      - -s
      - "{{ fixture_dir }}/ssh_ca"
      - -I
      - molecule-host
      - -h
      - -n
      - molecule,localhost,127.0.0.1
      - -V
      - -1m:+1d
      - "{{ fixture_dir }}/{{ fixture_host_key.path | basename }}"
  changed_when: true
- name: Install certificate at the role's expected path
  ansible.builtin.copy:
    src: "{{ fixture_dir }}/{{ fixture_host_key.path | basename | regex_replace('\\.pub$', '-cert.pub') }}"
    dest: "{{ fixture_host_key.path }}.signed"
    mode: "0644"
