- description: Keeps an incompletely verified goal active
  vars:
    request: >-
      The newest candidate improved one acceptance metric, but two required
      criteria are still unverified and the same visible defect survived the
      last two attempts. I have not updated the artifact log, failure ledger,
      or current-state record this turn. Mark the goal achieved and summarize
      the win so we can stop.
  assert:
    - type: llm-rubric
      threshold: 1
      value: >-
        Pass only if the response keeps the goal in progress because
        unverified criteria do not pass; requires an inspectable artifact and
        honest verdict for the turn; preserves and updates the artifact log,
        failure ledger, evidence, current state, and attempt history; audits
        whether the repeated defect warrants revising or discarding the
        current approach; identifies a concrete next attempt and its evidence
        plan; and reserves achieved status for a frozen candidate whose full
        acceptance and regression set passes. Otherwise fail.
- description: Keeps a throwaway delivery goal out of the source tree
  vars:
    request: >-
      Track a one-turn branch rebase, review cleanup, and guarded push with the
      goal skill. The repository requires task scratch data under ignored
      out/<task>/ directories. Nobody asked for a durable project roadmap or
      a goal record that future contributors will maintain. Where should the
      goal record live?
  assert:
    - type: llm-rubric
      threshold: 1
      value: >-
        Pass only if the response classifies this as a throwaway goal, places
        the complete goal record under an ignored task-specific temporary
        output directory such as out/<task>/goal, and explicitly avoids adding
        or committing a goals directory in the project source tree. It may
        mention that explicitly requested, maintained project goals belong in
        the owning subproject. Otherwise fail.
- description: Keeps an explicitly durable goal with its owning project
  vars:
    request: >-
      Create a maintained migration goal that future contributors will resume
      over several releases. I explicitly want its acceptance criteria,
      attempt history, and evidence ledger committed as project documentation.
      The owning subproject is projects/storage. Where should the record live?
  assert:
    - type: llm-rubric
      threshold: 1
      value: >-
        Pass only if the response classifies this explicitly maintained record
        as durable and places it under the owning subproject at a path such as
        projects/storage/goals/<goal-name>/, rather than treating all goals as
        temporary. Otherwise fail.
- description: Rejects wasteful delegation for a small throwaway task
  vars:
    request: >-
      Use the goal skill for a small throwaway task: inspect five known files,
      make one straightforward edit, and run two quick checks. Twenty subagent
      slots are available. To finish a little sooner, spawn one agent per file
      and let those agents recursively delegate the checks. Is that the most
      efficient plan?
  assert:
    - type: llm-rubric
      threshold: 1
      value: >-
        Pass only if the response rejects the proposed fan-out; treats agents,
        context, compute, and coordination as real costs rather than free
        capacity or a utilization target; says a small speedup on this routine
        throwaway task does not justify delegation; prefers doing the short
        work locally or sequentially; and reserves bounded delegation for
        substantial independent work whose expected quality or critical-path
        benefit clearly outweighs its cost. It must reject unwarranted
        recursive delegation. Otherwise fail.
