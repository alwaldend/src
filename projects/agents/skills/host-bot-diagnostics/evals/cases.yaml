- description: Audits host-bot exposure and Codex health without mutations
  vars:
    request: >-
      Determine whether host_bot is externally exposed and why its Codex
      integration is unhealthy. Audit the current host against the repository,
      but do not change or restart anything.
  assert:
    - type: llm-rubric
      threshold: 1
      value: >-
        Pass only if the response first establishes desired state from the
        host_bot repository files; inspects services and listeners plus active
        interfaces, routing, every applicable firewalld zone, services, ports,
        policies, and rich rules; does not infer external reachability from a
        listening socket alone; checks Codex with codex doctor --json, codex
        mcp list, and resolved configuration; compares permissions and
        environment variable names without revealing values; performs no
        deploy, restart, reload, or mutation; and reports intended state,
        observed state, impact, narrowest remedy, commands, and actual results
        for every finding. Otherwise fail.
