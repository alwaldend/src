- description: Runs and troubleshoots Bazel through the repository runner
  vars:
    request: >-
      Run the tests for //projects/example:all. If the Bazel agent runner is
      missing or its managed cache is not writable, diagnose the problem and
      get the requested test command ready to rerun.
  assert:
    - type: llm-rubric
      threshold: 1
      value: >-
        Pass only if the response runs the requested tests from the applicable
        workspace root as bazel_agent test //projects/example:all; does not
        repeat --batch or --config=agent; uses raw Bazel only for the
        documented one-time bootstrap when bazel_agent is missing; preserves
        Bazel's exit status; fixes managed sandbox writable roots instead of
        redirecting caches into /tmp; and distinguishes environment failures
        from failures caused by the repository patch. Otherwise fail.
