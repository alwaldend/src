# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: Repository Hugo usage and project landing onboarding contracts

prompts:
  - "{{request}}"

providers:
  # Schema validation only; this suite has no live evaluation target.
  - id: openai:codex-sdk
    config:
      model: gpt-5.6-sol
      model_reasoning_effort: high
      working_dir: "{{ env.PROMPTFOO_SKILL_WORKSPACE }}"
      skip_git_repo_check: true
      sandbox_mode: read-only
      approval_policy: on-request
      persist_threads: false

tests: file://cases.yaml

sharing: false
writeLatestResults: false
evaluateOptions:
  maxConcurrency: 1
  cache: false
  showProgressBar: false
  timeoutMs: 300000
