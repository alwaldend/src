- name: Deploy Host Bot proxy
  hosts: host_bot
  force_handlers: true
  become: true
  handlers:
    - name: Validate firewalld configuration
      ansible.builtin.command:
        argv:
          - firewall-cmd
          - --check-config
      changed_when: false
      listen: Reload firewalld
    - name: Reload firewalld
      ansible.builtin.command:
        argv:
          - firewall-cmd
          - --reload
      changed_when: true
      listen: Reload firewalld
  tasks:
    - name: Enable firewalld
      ansible.builtin.systemd_service:
        name: firewalld
        enabled: true
        state: started
      tags:
        - firewall
    - name: Configure firewall allowlist
      ansible.builtin.copy:
        src: firewalld_zone.xml
        dest: /etc/firewalld/zones/FedoraWorkstation.xml
        owner: root
        group: root
        mode: "0644"
      notify: Reload firewalld
      tags:
        - firewall
    - name: Configure Git
      become: false
      ansible.builtin.copy:
        src: gitconfig
        dest: "~/.gitconfig"
        mode: "0600"
    - name: Create the Codex configuration directory
      become: false
      ansible.builtin.file:
        path: "~/.codex"
        state: directory
        mode: "0700"
      tags:
        - codex
    - name: Configure Codex
      become: false
      ansible.builtin.copy:
        src: codex_config.toml
        dest: "~/.codex/config.toml"
        mode: "0600"
      tags:
        - codex
    - name: Remove Codex requirements incompatible with T3 Code
      ansible.builtin.file:
        path: /etc/codex/requirements.toml
        state: absent
      tags:
        - codex
    - name: Setup CA
      ansible.builtin.import_role:
        name: alwaldend.main.install_ca
    - name: Setup Traefik
      ansible.builtin.import_role:
        name: alwaldend.main.traefik
