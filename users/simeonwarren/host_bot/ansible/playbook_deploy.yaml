- name: Deploy Host Bot proxy
  hosts: host_bot
  force_handlers: true
  become: true
  handlers:
    - name: Validate firewalld configuration
      ansible.builtin.command:
        argv:
          - firewall-cmd
          - --check-config
      changed_when: false
      listen: Reload firewalld
    - name: Reload firewalld
      ansible.builtin.command:
        argv:
          - firewall-cmd
          - --reload
      changed_when: true
      listen: Reload firewalld
  tasks:
    - name: Enable firewalld
      ansible.builtin.systemd_service:
        name: firewalld
        enabled: true
        state: started
      tags:
        - firewall
    - name: Configure firewall allowlist
      ansible.builtin.copy:
        src: firewalld_zone.xml
        dest: /etc/firewalld/zones/FedoraWorkstation.xml
        owner: root
        group: root
        mode: "0644"
      notify: Reload firewalld
      tags:
        - firewall
    - name: Configure Git
      become: false
      ansible.builtin.copy:
        src: gitconfig
        dest: "~/.gitconfig"
        mode: "0600"
    - name: Configure Bazel
      become: false
      ansible.builtin.copy:
        src: bazelrc
        dest: "~/.bazelrc"
        mode: "0600"
      tags:
        - bazel
    - name: Create the local binary directory
      become: false
      ansible.builtin.file:
        path: "~/.local/bin"
        state: directory
        mode: "0755"
      tags:
        - bazel
    - name: Install Bazelisk
      become: false
      ansible.builtin.copy:
        src: bazelisk
        dest: "~/.local/bin/bazelisk"
        mode: "0755"
      tags:
        - bazel
    - name: Link Bazelisk as Bazel
      become: false
      ansible.builtin.file:
        src: bazelisk
        dest: "~/.local/bin/bazel"
        state: link
        force: true
      tags:
        - bazel
    - name: Install Bazel agent runner
      become: false
      ansible.builtin.copy:
        src: bazel_agent
        dest: "~/.local/bin/bazel_agent"
        mode: "0755"
      tags:
        - bazel
    - name: Create the Codex configuration directory
      become: false
      ansible.builtin.file:
        path: "~/.codex"
        state: directory
        mode: "0700"
      tags:
        - codex
    - name: Configure Codex
      become: false
      ansible.builtin.copy:
        src: codex_config.toml
        dest: "~/.codex/config.toml"
        mode: "0600"
      tags:
        - codex
    - name: Create the managed Codex configuration directory
      ansible.builtin.file:
        path: /etc/codex
        state: directory
        owner: root
        group: root
        mode: "0755"
      tags:
        - codex
    - name: Configure managed Codex requirements
      ansible.builtin.copy:
        src: codex_requirements.toml
        dest: /etc/codex/requirements.toml
        owner: root
        group: root
        mode: "0644"
      tags:
        - codex
    - name: Setup CA
      ansible.builtin.import_role:
        name: alwaldend.main.install_ca
    - name: Setup Traefik
      ansible.builtin.import_role:
        name: alwaldend.main.traefik
