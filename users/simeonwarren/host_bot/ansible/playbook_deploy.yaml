- name: Deploy Host Bot proxy
  hosts: host_bot
  force_handlers: true
  become: true
  handlers:
    - name: Validate firewalld configuration
      ansible.builtin.command:
        argv:
          - firewall-cmd
          - --check-config
      changed_when: false
      listen: Reload firewalld
    - name: Reload firewalld
      ansible.builtin.command:
        argv:
          - firewall-cmd
          - --reload
      changed_when: true
      listen: Reload firewalld
  tasks:
    - name: Enable firewalld
      ansible.builtin.systemd_service:
        name: firewalld
        enabled: true
        state: started
      tags:
        - firewall
    - name: Configure firewall allowlist
      ansible.builtin.copy:
        src: firewalld_zone.xml
        dest: /etc/firewalld/zones/FedoraWorkstation.xml
        owner: root
        group: root
        mode: "0644"
      notify: Reload firewalld
      tags:
        - firewall
    - name: Configure Git
      become: false
      ansible.builtin.copy:
        src: gitconfig
        dest: "~/.gitconfig"
        mode: "0600"
    - name: Configure development packages
      ansible.builtin.import_role:
        name: alwaldend.main.dev_vm
        tasks_from: packages
    - name: Setup Bazel cache volume group
      ansible.builtin.import_role:
        name: alwaldend.main.lvg
      tags:
        - bazel
        - storage
    - name: Setup Bazel cache logical volume
      ansible.builtin.import_role:
        name: alwaldend.main.lvol
      tags:
        - bazel
        - storage
    - name: Setup Bazel cache filesystem
      ansible.builtin.import_role:
        name: alwaldend.main.filesystem
      tags:
        - bazel
        - storage
    - name: Mount Bazel cache filesystem
      ansible.builtin.import_role:
        name: alwaldend.main.mount
      tags:
        - bazel
        - storage
    - name: Create the Bazel cache directories
      loop: "{{ bazel_cache_directories }}"
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "{{ item.mode }}"
      tags:
        - bazel
        - storage
    - name: Configure Bazel developer tools
      ansible.builtin.import_role:
        name: alwaldend.main.dev_vm
        tasks_from: bazel
    - name: Install Open Computer Use dependencies
      ansible.builtin.import_role:
        name: alwaldend.main.dev_vm
        tasks_from: packages
      vars:
        dev_vm_packages:
          - nodejs
          - npm
      tags:
        - codex
        - open_computer_use
    - name: Install Open Computer Use
      become: false
      community.general.npm:
        name: open-computer-use
        version: "{{ open_computer_use_version }}"
        global: true
        state: present
        ignore_scripts: true
        executable: /usr/bin/npm
      environment:
        NPM_CONFIG_PREFIX: "{{ open_computer_use_npm_prefix }}"
      tags:
        - codex
        - open_computer_use
    - name: Create the managed Open Computer Use skill directories
      loop:
        - /etc/codex
        - /etc/codex/skills
        - /etc/codex/skills/open-computer-use
        - /etc/codex/skills/open-computer-use/agents
        - /etc/codex/skills/open-computer-use/references
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      tags:
        - codex
        - open_computer_use
    - name: Install the managed Open Computer Use skill
      loop: "{{ open_computer_use_skill_files }}"
      ansible.builtin.get_url:
        url: >-
          https://raw.githubusercontent.com/{{
          open_computer_use_skill_repository }}/{{
          open_computer_use_skill_revision }}/skills/open-computer-use/{{
          item }}
        dest: "/etc/codex/skills/open-computer-use/{{ item }}"
        owner: root
        group: root
        mode: "0644"
      tags:
        - codex
        - open_computer_use
    - name: Check the repository tool workspace
      become: false
      ansible.builtin.stat:
        path: "{{ repo_tool_workspace_root }}/MODULE.bazel"
      register: repo_tool_workspace
      tags:
        - bazel
        - codex
    - name: Preseed repository agent tools
      become: false
      ansible.builtin.command:
        argv:
          - "{{ dev_vm_bazel_home }}/.local/bin/bazel_agent"
          - tool
          - warm
          - --workspace-root
          - "{{ repo_tool_workspace_root }}"
          - mcp_cordis
          - repo_delivery
      register: repo_tool_warm
      changed_when: "'installed' in repo_tool_warm.stdout"
      when: repo_tool_workspace.stat.isreg | default(false)
      tags:
        - bazel
        - codex
    - name: Create the miscellaneous data logical volume
      community.general.lvol:
        vg: sata_ssd
        lv: misc
        size: "{{ misc_storage_size }}"
        resizefs: false
        shrink: false
      tags:
        - arxiv
        - misc_storage
        - storage
    - name: Create or resize the miscellaneous data filesystem
      community.general.filesystem:
        dev: "{{ misc_storage_device }}"
        fstype: ext4
        resizefs: true
      tags:
        - arxiv
        - misc_storage
        - storage
    - name: Mount the miscellaneous data filesystem
      ansible.posix.mount:
        path: "{{ misc_storage_mount }}"
        src: "{{ misc_storage_device }}"
        state: mounted
        fstype: ext4
        opts: "{{ misc_storage_mount_options | join(',') }}"
        dump: "0"
        passno: "2"
      tags:
        - arxiv
        - misc_storage
        - storage
    - name: Create the arXiv MCP paper directory
      ansible.builtin.file:
        path: "{{ arxiv_mcp_storage_path }}"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0700"
      tags:
        - arxiv
        - misc_storage
        - storage
    - name: Create the Codex configuration directory
      become: false
      ansible.builtin.file:
        path: "~/.codex"
        state: directory
        mode: "0700"
      tags:
        - arxiv
        - codex
        - open_computer_use
    - name: Configure Codex
      become: false
      ansible.builtin.copy:
        src: codex_config.toml
        dest: "~/.codex/config.toml"
        mode: "0600"
      tags:
        - arxiv
        - codex
        - open_computer_use
    - name: Configure the OpenRouter Codex profile
      become: false
      ansible.builtin.copy:
        src: codex_openrouter.config.toml
        dest: "~/.codex/openrouter.config.toml"
        mode: "0600"
      tags:
        - codex
        - open_computer_use
    - name: Configure user-level Codex instructions
      become: false
      ansible.builtin.copy:
        src: codex_agents.md
        dest: "~/.codex/AGENTS.md"
        mode: "0600"
      tags:
        - codex
    - name: Create the isolated OpenRouter Codex directories
      become: false
      ansible.builtin.file:
        path: "~/.codex-openrouter"
        state: directory
        mode: "0700"
      tags:
        - codex
        - open_computer_use
    - name: Configure the isolated OpenRouter Codex provider
      become: false
      ansible.builtin.copy:
        src: codex_openrouter_provider_config.toml
        dest: "~/.codex-openrouter/config.toml"
        mode: "0600"
      tags:
        - codex
        - open_computer_use
    - name: Configure isolated OpenRouter Codex instructions
      become: false
      ansible.builtin.copy:
        src: codex_agents.md
        dest: "~/.codex-openrouter/AGENTS.md"
        mode: "0600"
      tags:
        - codex
    - name: Configure managed Codex requirements
      ansible.builtin.copy:
        src: codex_requirements.toml
        dest: /etc/codex/requirements.toml
        owner: root
        group: root
        mode: "0644"
      tags:
        - codex
    - name: Setup CA
      ansible.builtin.import_role:
        name: alwaldend.main.install_ca
    - name: Setup Traefik
      ansible.builtin.import_role:
        name: alwaldend.main.traefik
