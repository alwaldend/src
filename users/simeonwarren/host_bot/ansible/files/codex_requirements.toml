allowed_approval_policies = ["on-request"]
default_permissions = "host-bot"

[allowed_permission_profiles]
":read-only" = true
"host-bot" = true

[features]
network_proxy = true

[permissions.host-bot]
description = "Workspace access with public network and Bazel caches."
extends = ":workspace"

[permissions.host-bot.filesystem]
"~/.cache/bazel" = "write"
"~/.cache/bazelisk" = "write"

[permissions.host-bot.network]
enabled = true
allow_local_binding = false

[permissions.host-bot.network.domains]
"*" = "allow"
"localhost" = "deny"
"127.0.0.1" = "deny"
"::1" = "deny"
