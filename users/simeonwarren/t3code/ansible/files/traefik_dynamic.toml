[tls.options.default.clientAuth]
caFiles = ["{{ traefik_mtls_ca_path }}"]
clientAuthType = "RequireAndVerifyClientCert"

[tls.options.optional_mtls.clientAuth]
caFiles = ["{{ traefik_mtls_ca_path }}"]
clientAuthType = "VerifyClientCertIfGiven"

[http.routers.t3code]
rule = "Host(`{{ t3code_domain }}`) || Host(`{{ inventory_hostname }}`)"
service = "t3code"
tls = { certResolver = "default" }

[http.routers.t3code_no_mtls]
rule = "Host(`{{ t3code_domain }}`) || Host(`{{ inventory_hostname }}`)"
service = "t3code"
entrypoints = ["websecure_wireguard"]
tls = { certResolver = "default", options = "optional_mtls" }

[[http.services.t3code.loadBalancer.servers]]
url = "http://127.0.0.1:{{ t3code_port }}"
