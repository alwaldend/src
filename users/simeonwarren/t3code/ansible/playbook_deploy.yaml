- name: Deploy T3 Code
  hosts: t3code
  force_handlers: true
  become: true
  tasks:
    - ansible.builtin.import_role:
        name: alwaldend.main.host
    - ansible.builtin.import_role:
        name: alwaldend.main.wireguard
    - ansible.builtin.import_role:
        name: alwaldend.main.traefik
    - ansible.builtin.import_role:
        name: alwaldend.main.t3code
    - tags:
        - misc
      block:
        - name: Install packages
          ansible.builtin.package:
            name:
              - git
              - gh
        - name: Copy the opencode binary
          ansible.builtin.copy:
            src: "files/opencode"
            dest: "/usr/local/bin/opencode"
            owner: "root"
            group: "t3code"
            mode: "0755"
