name = "chinese"
sort_field = "article-title"

[config]
css = ":root {\n    display: flex;\n    //align-items: center;\n    justify-content: center;\n    width: 100%;\n    height: 100%;\n}\n\n.card {\n    //max-width: 40rem;\n    width: 100%;\n    margin: 0;\n    font-size: 1rem;\n    font-family: monospace;\n    //color: black;\n    padding: 0 30% 0 30%;\n}\n\n.mobile .card {\n    padding: 0;\n}\n\n.card.nightMode * {\n    //color: white;\n}\n\n.question {\n    //border-radius: 1em;\n    //border-style: solid;\n    padding: 1rem;\n    //margin: 0 0 1em 0;\n}\n\n.type {\n    //text-transform: uppercase;\n    margin: 0;\n}\n\n.value {\n    padding: 1rem 0 0 0;\n}\n\n.value, .value > div {\n    text-align: left;\n    margin: 0;\n    visibility: hidden;\n}\n\n.value.show-front,\n.value .show-front,\n.back * {\n    visibility: visible;\n}\n\n.example-type {\n    //font-weight: bold;\n    text-transform: uppercase;\n}\n\n.font_big {\n    font-size: 2rem;\n}"
latex_post = "\\end{document}"
latex_pre = "\\documentclass[12pt]{article}\n\\special{papersize=3in,5in}\n\\usepackage[utf8]{inputenc}\n\\usepackage{amssymb,amsmath}\n\\pagestyle{empty}\n\\setlength{\\parindent}{0in}\n\\begin{document}\n"

[[fields]]
name = "hanzi"
[fields.config]
font_name = "Liberation Sans"
font_size = 20

[[fields]]
name = "pinyin"
[fields.config]
font_name = "Arial"
font_size = 20

[[fields]]
name = "english"
[fields.config]
font_name = "Arial"
font_size = 20

[[fields]]
name = "notes"
[fields.config]
font_name = "Arial"
font_size = 20

[[fields]]
name = "example-type"
[fields.config]
font_name = "Arial"
font_size = 20

[[fields]]
name = "article-title"
[fields.config]
font_name = "Arial"
font_size = 20

[[fields]]
name = "grammar-construct"
[fields.config]
font_name = "Arial"
font_size = 20

[[fields]]
name = "source"
[fields.config]
font_name = "Liberation Sans"
font_size = 20

[[fields]]
name = "example-sentence"
[fields.config]
font_name = "Arial"
font_size = 20

[[templates]]
name = "Translation"
[templates.config]
a_format = "{{ tts zh_CN hypertts_preset=Back_realtime_0 voices=HyperTTS:hanzi }}\n\n<div class=\"back\">\n  {{ FrontSide }}\n</div>"
browser_font_name = "Noto Sans Mono CJK SC"
browser_font_size = 12
q_format = "<div lang=\"zh_CN\">\n  <div class=\"question\">\n    <h2 class=\"type\">Sentence</h2>\n    <p class=\"value show-front font_big\">\n      {{ text:hanzi }}\n    </p>\n  </div>\n  {{ #example-type }}\n  <div class=\"question\">\n    <h2 class=\"type\">Question</h2>\n    <p class=\"value\">\n      <span class=\"show-front\">Is this sentence grammatically correct?</span>\n      <br>\n      <br>\n      <span class=\"example-type\">{{ example-type }}</span>\n    </p>\n  </div>\n  {{ /example-type}}\n  <div class=\"question\">\n    <h2 class=\"type\">Pinyin</h2>\n    <p class=\"value\">\n      {{ text:pinyin }}\n    </p>\n  </div>\n  {{ #english }}\n  <div class=\"question\">\n    <h2 class=\"type\">English</h2>\n    <p class=\"value\">{{ english }}</p>\n  </div>\n  {{ /english }}\n  {{ #notes }}\n  <div class=\"question\">\n    <h2 class=\"type\">Notes</h2>\n    <p class=\"value\">{{ notes }}</p>\n  </div>\n  {{ /notes }}\n  {{ #grammar-construct }}\n  <div class=\"question\">\n    <h2 class=\"type\">Grammar</h2>\n    <p class=\"value\">{{ grammar-construct }}</p>\n  </div>\n  {{ /grammar-construct }}\n  {{ #source }}\n  <div class=\"question\">\n    <h2 class=\"type\">Source</h2>\n    <p class=\"value\">\n      <a href=\"{{ text:source }}\">\n      {{ article-title }}\n      </a>\n    </p>\n  </div>\n  {{ /source }}\n  {{ #example-sentence }}\n  <div class=\"question\">\n    <h2 class=\"type\">Example</h2>\n    <p class=\"value\">{{ example-sentence }}</p>\n  </div>\n  {{ /example-sentence }}\n  <div class=\"question\">\n    <h2 class=\"type\">Misc</h2>\n    <p class=\"value\">\n      <a href=\"https://www.mdbg.net/chinese/dictionary?page=worddict&email=&wdrst=0&wdqb={{ text:hanzi }}\"\n        >mdbg</a>\n      <a href=\"https://www.deepl.com/en/translator#zh/en-us/{{ text:hanzi }}\">deepl</a>\n      <a href=\"https://translate.google.com/?sl=auto&tl=en&text={{ text:hanzi }}&op=translate\"\n        >google</a>\n      <span>{{ Deck }}</span>\n    </p>\n  </div>\n</div>\n</div>"
