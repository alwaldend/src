name = "python-basic-and-reversed"

[config]
css = ":root {\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    width: 100%;\n    height: 100%;\n}\n\n.card {\n    font-size: 1em;\n    font-family: monospace;\n    color: black;\n    max-width: 35rem;\n    width: 100%;\n}\n\ntable {\n    background-color: white;\n    padding: 0.5rem 0.5rem 0.5rem 0;\n}\n\n.nightMode table {\n    background-color: transparent;\n}\n\ntable,\n.value {\n    border: groove;\n    border-radius: 1rem;\n    width: 100%;\n}\n\n.type {\n    font-weight: bold;\n    text-transform: uppercase;\n    text-align: center;\n    writing-mode: vertical-lr;\n    rotate: 180deg;\n    padding: 0.5rem 0 0.5rem 0;\n    max-width: 1rem;\n    min-width: 1rem;\n}\n\n.value {\n    text-align: left;\n    padding: 0.5rem 0.5rem 0.5rem 0.5rem;\n    visibility: hidden;\n}\n\n.value.show-front,\n.back .value {\n    visibility: visible;\n}\n\n.nightMode a {\n    color: white;\n}\n\n.font_big {\n    font-size: 3rem;\n}"
latex_post = "\\end{document}"
latex_pre = "\\documentclass[12pt]{article}\n\\special{papersize=3in,5in}\n\\usepackage[utf8]{inputenc}\n\\usepackage{amssymb,amsmath}\n\\pagestyle{empty}\n\\setlength{\\parindent}{0in}\n\\begin{document}\n"

[[fields]]
name = "question"
[fields.config]
font_name = "Liberation Sans"
font_size = 20

[[fields]]
name = "answer"
[fields.config]
font_name = "Arial"
font_size = 20

[[fields]]
name = "additional-info"
[fields.config]
font_name = "Liberation Sans"
font_size = 20

[[fields]]
name = "with-options"
[fields.config]
font_name = "Liberation Sans"
font_size = 20

[[fields]]
name = "example"
[fields.config]
font_name = "Liberation Sans"
font_size = 20

[[fields]]
name = "version"
[fields.config]
font_name = "Liberation Sans"
font_size = 20

[[templates]]
name = "Card 1"
[templates.config]
a_format = "{{ FrontSide }}\n\n<h2>Answer</h2>\n\n{{ answer }}\n\n{{ #additional-info }}\n<h2>Additional info</h2>\n\n{{ additional-info }}\n{{/additional-info}}\n\n{{ #with-options }}\n<h2>With options</h2>\n\n{{ with-options }}\n{{ /with-options }}\n\n{{ #example }}\n<h2>Example</h2>\n\n{{ example }}\n{{ /example }}\n\n{{ #version }}\n<h2>Version</h2>\n\n{{ version }}\n{{ /version }}"
q_format = "<h2>Question</h2>\n\n{{ question }}"
