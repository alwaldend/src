Example = 'def test_func(*args):<br>&nbsp; &nbsp; for x in args:<br>&nbsp; &nbsp; &nbsp; &nbsp; print(x)<br>test_func(1, 2, 3) #should print out 1 2 3 each on a new line'
Front = 'What does a * at the beginning of a function argument mean?'
