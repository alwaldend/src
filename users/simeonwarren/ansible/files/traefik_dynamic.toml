[tls.options.default.clientAuth]
caFiles = ["{{ traefik_mtls_ca_path }}"]
clientAuthType = "RequireAndVerifyClientCert"

[http.serversTransports.hermes]
serverName = "{{ hermes_domain }}"

[http.routers.hermes_websecure]
rule = "Host(`{{ hermes_domain }}`) || Host(`{{ inventory_hostname }}`)"
service = "hermes"
tls = { certResolver = "vault" }

[http.services.hermes.loadBalancer]
serversTransport = "hermes"

[[http.services.hermes.loadBalancer.servers]]
url = "http://127.0.0.1:{{ hermes_port }}"