[global]
checkNewVersion = false
sendAnonymousUsage = false

[providers.file]
filename = "{{ traefik_dynamic_config_path }}"

[log]
level = "INFO"

[entryPoints.web]
address = ":80"
[entryPoints.web.http.redirections.entryPoint]
to = "websecure"

[entryPoints.websecure]
address = ":443"
asDefault = true
[entryPoints.websecure.http.tls]
certResolver = "default"

[certificatesResolvers.default.acme]
email = "users_simeonwarren@alwaldend.com"
storage = "{{ traefik_data_dir }}/acme.json"
caServer = "{{ traefik_acme_url }}"

[certificatesResolvers.default.acme.httpChallenge]
entryPoint = "web"

[tls.stores.default.acme]
resolver = "default"
[tls.stores.default.acme.domain]
main = "{{ hermes_domain }}"
sans = ["{{ inventory_hostname }}"]
