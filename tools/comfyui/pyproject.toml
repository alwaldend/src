[project]
name = "com-alwaldend-src-comfyui"
version = "0.0.0"
requires-python = ">=3.13, <3.14"
dependencies = [
  "comfyui-frontend-package==1.57.4",
  "comfyui-workflow-templates==0.11.97",
  "comfyui-embedded-docs==0.5.15",
  "torch==2.15.0+cpu",
  "torchsde",
  "torchvision==0.29.1+cpu",
  "numpy>=1.25.0",
  "einops",
  "transformers>=4.50.3",
  "tokenizers>=0.13.3",
  "sentencepiece",
  "safetensors>=0.4.2",
  "aiohttp>=3.11.8",
  "yarl>=1.18.0",
  "pyyaml",
  "pillow>=10.1.0",
  "scipy",
  "tqdm",
  "psutil",
  "alembic",
  "sqlalchemy>=2.0.0",
  "filelock",
  "av>=17.0.0",
  "comfy-aimdo==0.6.0",
  "comfy-kitchen==0.2.40",
  "requests",
  "simpleeval>=1.0.0",
  "blake3",
  "kornia>=0.7.1",
  "spandrel",
  "pydantic~=2.0",
  "pydantic-settings~=2.0",
  "pyopengl>=3.1.8",
  "comfy-angle",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
