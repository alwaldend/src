- description: Add a project without authorizing live changes
  vars:
    request: >-
      Use $repo-hugo. Add a landing for projects/widget from its README.
      The README says it is an unfinished prototype. Prepare the implementation
      and local checks; deployment will be a separate task.
  assert:
    - type: llm-rubric
      threshold: 1
      value: >-
        Pass if the response keeps the project content truthful about prototype
        status, wires the registry entry and the project-owned landing content
        package, checks the rendered output and taxonomy participation, and
        performs no live publication. It must not create a per-project Pages
        repository, DNS record, or Terraform stage, and must not request
        permission for already-authorized reversible implementation.

- description: Add a landing page without creating per-project infrastructure
  vars:
    request: >-
      Use $repo-hugo. Add a landing for projects/widget from its README.
      The README says it is an unfinished prototype. Prepare the implementation
      and local checks; deployment will be a separate task. The widget project
      already has its own GitHub Pages repository and DNS record.
  assert:
    - type: llm-rubric
      threshold: 1
      value: >-
        Pass if the response keeps the project content truthful about prototype
        status, wires the registry entry and the project-owned content package,
        keeps the landing free of layouts, styles, and build rules, checks the
        rendered output and taxonomy participation, and performs no live
        publication. It must not create or manage a per-project Pages
        repository, DNS record, or Terraform stage, and must not request
        permission for already-authorized reversible implementation.

- description: Reusable module documentation and apex exclusion
  vars:
    request: >-
      Use $repo-hugo. Include tools/rules_widget, a standalone nested module
      with a public docs target, in the main website's documentation. Also
      check whether it or alwaldend.com needs a dedicated landing page or repository.
  assert:
    - type: llm-rubric
      threshold: 1
      value: >-
        Pass if the response keeps the module standalone and integrates its
        public docs label through tools:docs without adding a landing page,
        registry entry, DNS record, or Pages repository. It also treats
        alwaldend.com as the existing apex site excluded from the landing
        registry and does not infer deployment permission from implementation
        and investigation.
