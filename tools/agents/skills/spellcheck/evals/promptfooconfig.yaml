# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: Behavioral regression suite for the spellcheck skill

prompts:
  - "{{request}}"

providers:
  - id: openai:codex-sdk
    label: spellcheck-subject
    config:
      model: gpt-5.6-sol
      model_reasoning_effort: high
      codex_path_override: "{{ env.CODEX_PATH_OVERRIDE }}"
      working_dir: "{{ env.PROMPTFOO_SKILL_WORKSPACE }}"
      skip_git_repo_check: true
      sandbox_mode: read-only
      approval_policy: on-request
      persist_threads: false
      cli_env:
        ALL_PROXY: "{{ env.ALL_PROXY }}"
        CODEX_HOME: "{{ env.PROMPTFOO_SUBJECT_CODEX_HOME }}"
        HTTPS_PROXY: "{{ env.HTTPS_PROXY }}"
        HTTP_PROXY: "{{ env.HTTP_PROXY }}"
        NO_PROXY: "{{ env.NO_PROXY }}"

tests: file://cases.yaml

sharing: false
writeLatestResults: false
evaluateOptions:
  repeat: 1
  maxConcurrency: 1
  cache: false
  showProgressBar: false
  timeoutMs: 300000
  maxEvalTimeMs: 1200000
