- description: Exports only declarations required by consumers or contracts
  vars:
    request: >-
      Review a Go internal/storage package. ReadArchive is called by the CLI
      package, NormalizePath is called only inside storage, and NormalizePath
      was exported so an external test package could call it. A Response has
      a serialized Name field and an exported Cache field used only internally.
      Its String method implements fmt.Stringer. Which declarations should be
      exported, and what must be checked before changing them?
  assert:
    - type: llm-rubric
      threshold: 1
      value: >-
        Keeps ReadArchive exported for its cross-package consumer, Name public
        for serialization, and String public for the interface contract. Makes
        NormalizePath and Cache private after checking callers and contracts;
        external tests alone do not justify an export. Requires a concrete
        consumer or contract and records the reason in API documentation or
        change rationale. Applies the same rule within internal directories.
        Does not export speculative helpers, break required serialized names,
        or edit generated declarations.
- description: Preserves causes with useful error context
  vars:
    request: >-
      A Go release publisher returns err directly when it cannot read an archive
      and returns cmd.Run() from its rsync helper. Fix the error handling so the
      CLI identifies the failed operation and callers can still inspect causes.
  assert:
    - type: llm-rubric
      threshold: 1
      value: >-
        Pass only if every propagated non-nil error is wrapped with useful
        operation or path context using fmt.Errorf and %w, including subprocess
        errors, while nil remains nil. The response must preserve error identity
        for errors.Is/As, avoid formatting an underlying cause only with %v,
        and not expose credentials in diagnostics.
- description: Uses repository Go tooling and existing dependencies
  vars:
    request: >-
      Add shell quoting to a Go Bazel tool in this monorepo and validate a
      command that transfers filenames with spaces and apostrophes over SSH.
  assert:
    - type: llm-rubric
      threshold: 1
      value: >-
        Pass only if it checks local code and declared dependencies before
        seeking a new library, obtains explicit user approval for the specific
        new dependency before adding it, follows repo-external-dependency,
        uses the Bazel-pinned Go toolchain through al bazel,
        declares the Go dependency in BUILD.bazel, and verifies literal filenames
        with an isolated command-level fixture. It must not use host Go, hand-edit
        generated locks, disable host verification, or run against a live host.
- description: Uses Cobra for Go command-line interfaces
  vars:
    request: >-
      Implement a Go CLI with export and plan subcommands and required flags
      in this repository.
  assert:
    - type: llm-rubric
      threshold: 1
      value: >-
        Pass only if it uses the existing pinned Cobra module, defines separate
        subcommands and command-specific required flags, propagates command
        context, wraps errors with useful context, and declares the module in
        Bazel deps. It must not introduce a separate manual flag parser.
- description: Initializes explicitly and colocates receiver methods
  vars:
    request: >-
      A Go SQLite package registers a collation in init() and declares its Deck
      type in text.go while the Deck encoding methods live in protobuf.go.
      Refactor it according to this repository's Go standards.
  assert:
    - type: llm-rubric
      threshold: 1
      value: >-
        Pass only if initialization is explicit at the owning entry point,
        initialization failures are returned with contextual wrapped errors,
        no init function remains, and Deck methods are in the same source file
        as the Deck receiver type declaration. Do not introduce a dependency.
- description: Documents Go package ownership and boundaries
  vars:
    request: >-
      Add a Go reconciliation package and a command package to this repository.
      Include exported and private structs, embedded fields, methods, helpers,
      constants, and package variables. The reconciliation package consumes
      generated protobuf models and writes
      SQLite changes. Document their module boundaries using Go conventions.
  assert:
    - type: llm-rubric
      threshold: 1
      value: >-
        Pass only if each first-party package has exactly one package comment
        in doc.go immediately before the package declaration, starts with
        Package and its package name, and describes responsibilities and
        boundaries accurately. Include the command package and wire doc.go
        into Bazel targets. Do not edit generated protobuf code or upstream
        dependencies, duplicate package comments, or use a README alone as
        package documentation. Document every top-level declaration and struct field,
        including unexported and embedded fields, with a name-led comment that
        describes its purpose or behavior. Keep module-wide architecture in the README.
- description: Respects documented application and command responsibilities
  vars:
    request: >-
      cmd/catalog/doc.go says the executable only composes dependencies and
      installs process signal handling. internal/cli/doc.go owns Cobra syntax,
      formats and streams, and pkg/app/doc.go owns all user operations. A new
      server command in main.go directly invokes a native host. Review and fix
      the boundary without forcing native linkage into every App consumer.
  assert:
    - type: llm-rubric
      threshold: 1
      value: >-
        Reads the affected doc.go descriptions and source/callers, identifies the
        direct native invocation from a command handler as misplaced operation
        logic, puts command construction in cli and the operation behind App,
        and injects the native adapter through executable composition. Keeps
        signal handling at the process boundary and lower-level hosting with
        its owner. Does not broaden main or cli documentation to excuse the
        bypass, duplicate server parsing, or add a dependency.
- description: Checks documentation against implementation instead of treating stale text as authority
  vars:
    request: >-
      Review two Go packages. Package plan claims no I/O in doc.go but its new
      Build opens the collection database. Package resource owns fresh native
      snapshots through a borrowed connection and does not manage its lifetime.
      Its doc.go is missing those exclusions. Correct responsibilities and
      boundaries while preserving the existing application and storage owners.
  assert:
    - type: llm-rubric
      threshold: 1
      value: >-
        Checks imports, effects, public APIs and consumers against package
        documentation, moves database acquisition to the existing application
        or collection owner and keeps plan pure. Documents snapshot and borrowed
        connection ownership accurately in resource/doc.go without assigning it
        process lifetime or application policy. Does not merely rewrite plan's
        comment to authorize the misplaced I/O or move lower-level domain
        algorithms wholesale into App. Keeps each doc.go descriptive, with implementation/review instructions in the
        Go skill, and respects scope for material changes.
