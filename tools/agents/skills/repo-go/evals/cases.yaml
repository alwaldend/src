- description: Preserves causes with useful error context
  vars:
    request: >-
      A Go release publisher returns err directly when it cannot read an archive
      and returns cmd.Run() from its rsync helper. Fix the error handling so the
      CLI identifies the failed operation and callers can still inspect causes.
  assert:
    - type: llm-rubric
      threshold: 1
      value: >-
        Pass only if every propagated non-nil error is wrapped with useful
        operation or path context using fmt.Errorf and %w, including subprocess
        errors, while nil remains nil. The response must preserve error identity
        for errors.Is/As, avoid formatting an underlying cause only with %v,
        and not expose credentials in diagnostics.
- description: Uses repository Go tooling and existing dependencies
  vars:
    request: >-
      Add shell quoting to a Go Bazel tool in this monorepo and validate a
      command that transfers filenames with spaces and apostrophes over SSH.
  assert:
    - type: llm-rubric
      threshold: 1
      value: >-
        Pass only if it checks local code and declared dependencies before
        seeking a new library, obtains explicit user approval for the specific
        new dependency before adding it, follows repo-external-dependency,
        uses the Bazel-pinned Go toolchain through bazel_agent,
        declares the Go dependency in BUILD.bazel, and verifies literal filenames
        with an isolated command-level fixture. It must not use host Go, hand-edit
        generated locks, disable host verification, or run against a live host.
- description: Uses Cobra for Go command-line interfaces
  vars:
    request: >-
      Implement a Go CLI with export and plan subcommands and required flags
      in this repository.
  assert:
    - type: llm-rubric
      threshold: 1
      value: >-
        Pass only if it uses the existing pinned Cobra module, defines separate
        subcommands and command-specific required flags, propagates command
        context, wraps errors with useful context, and declares the module in
        Bazel deps. It must not introduce a separate manual flag parser.
- description: Initializes explicitly and colocates receiver methods
  vars:
    request: >-
      A Go SQLite package registers a collation in init() and declares its Deck
      type in text.go while the Deck encoding methods live in protobuf.go.
      Refactor it according to this repository's Go standards.
  assert:
    - type: llm-rubric
      threshold: 1
      value: >-
        Pass only if initialization is explicit at the owning entry point,
        initialization failures are returned with contextual wrapped errors,
        no init function remains, and Deck methods are in the same source file
        as the Deck receiver type declaration. Do not introduce a dependency.
- description: Documents Go package ownership and boundaries
  vars:
    request: >-
      Add a Go reconciliation package and a command package to this repository.
      Include exported and private structs, embedded fields, methods, helpers,
      constants, and package variables. The reconciliation package consumes
      generated protobuf models and writes
      SQLite changes. Document their module boundaries using Go conventions.
  assert:
    - type: llm-rubric
      threshold: 1
      value: >-
        Pass only if each first-party package has exactly one package comment
        in doc.go immediately before the package declaration, starts with
        Package and its package name, and describes responsibilities and
        boundaries accurately. Include the command package and wire doc.go
        into Bazel targets. Do not edit generated protobuf code or upstream
        dependencies, duplicate package comments, or use a README alone as
        package documentation. Document every top-level declaration and struct field,
        including unexported and embedded fields, with a name-led comment that
        describes its purpose or behavior. Keep module-wide architecture in the README.
