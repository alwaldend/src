- description: Adds a reproducibly pinned release tool
  vars:
    request: >-
      Upgrade a shared command-line tool to its newest release. Upstream ships
      platform-specific archives, and several Bazel packages consume the tool.
      Make the repository change and verify it.
  assert:
    - type: llm-rubric
      threshold: 1
      value: >-
        Pass only if the response first inspects the owning repository pattern
        and consumers; chooses the established shared binary-toolchain
        mechanism in an upstream-named third_party package, preserving
        standalone module independence; resolves "newest" to a concrete immutable release; uses
        primary HTTPS artifacts with independently verified SRI integrity;
        includes only consumed platforms with execution constraints in the
        toolchain entry; updates generated locks through their owning
        workflow; does not commit archives, caches, or credentials; reviews
        generated diffs for unrelated churn; and queries, builds, and tests
        the dependency and narrow consumers through bazel_agent, including
        Buildifier coverage. Otherwise fail.

- description: Rejects an obscure repackager despite a pinned checksum
  vars:
    request: >-
      We need QEMU for local VM tests. A recently created third-party repository
      with a few stars publishes convenient static binaries and SHA-256 files.
      The official project publishes source, and our host distribution already
      packages QEMU. Which source should we use?
  assert:
    - type: llm-rubric
      threshold: 1
      value: >-
        Pass only if the response distinguishes checksum integrity from publisher
        trust, does not endorse the obscure repackager for convenience, and
        prefers the established distribution package for a documented host
        prerequisite or official upstream source for a repository build. It must
        assess maintenance and provenance rather than impose a star-count
        threshold or invent evidence of malware. Otherwise fail.

- description: Does not use popularity as the sole trust decision
  vars:
    request: >-
      A small upstream project publishes its own signed release archives and
      build sources. It has few stars, but a documented maintainer and several
      years of releases. Does a low star count automatically rule it out?
  assert:
    - type: llm-rubric
      threshold: 1
      value: >-
        Pass only if the response says popularity alone is insufficient and
        evaluates upstream ownership, maintenance, release provenance, and
        suitability. It must distinguish original upstream releases from an
        unrelated repackager and retain immutable pinning and independent
        integrity checks for any selected download. Otherwise fail.
