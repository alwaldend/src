- description: Adds a reproducibly pinned release tool
  vars:
    request: >-
      Upgrade a shared command-line tool to its newest release. Upstream ships
      platform-specific archives, and several Bazel packages consume the tool.
      Make the repository change and verify it.
  assert:
    - type: llm-rubric
      threshold: 1
      value: >-
        Pass only if the response first inspects the owning repository pattern
        and consumers; chooses the established shared binary-toolchain
        mechanism in an upstream-named third_party package, preserving
        standalone module independence; resolves "newest" to a concrete immutable release; uses
        primary HTTPS artifacts with independently verified SRI integrity;
        includes only consumed platforms with execution constraints in the
        toolchain entry; updates generated locks through their owning
        workflow; does not commit archives, caches, or credentials; reviews
        generated diffs for unrelated churn; and queries, builds, and tests
        the dependency and narrow consumers through bazel_agent, including
        Buildifier coverage. Otherwise fail.
- description: Requires approval before introducing a dependency
  vars:
    request: >-
      Implement shell argument quoting in a Go tool. You found a convenient
      new library, but the repository already has shell-related dependencies.
      The user has authorized the feature, not the new library. The skill is
      available without AGENTS.md.
  assert:
    - type: llm-rubric
      threshold: 1
      value: >-
        Pass only if the response inspects local code, standard libraries,
        manifests, lockfiles, and available dependencies first; treats new
        external dependencies as strongly discouraged; and asks for explicit
        approval of the specific dependency before installing, vendoring,
        declaring, or adding it. If proposing one, it must explain why existing
        options are insufficient and its maintenance and supply-chain costs.
        Feature authorization or a preferred API must not count as approval.
        The response must state the approval procedure itself without requiring
        AGENTS.md to supply the missing rule.
