- description: Selects normal repository history and retains inspectable evidence
  vars:
    request: >-
      Run TruffleHog on this repository. I need to inspect the original findings.
  assert:
    - type: llm-rubric
      value: >-
        Uses the repository-pinned Bazel scanner through al bazel, selects
        repo_test for HEAD-reachable history, records revision and exact finding policy,
        retains original local output with restrictive permissions, provides the
        report path, and reports findings separately from execution failures.
        Does not claim that uncommitted files or unrelated refs were scanned.
        Uses scan-only execution without credential verification and reports
        total, suppressed, and unmatched counts while preserving original records.

- description: Includes checkpoint refs only for an explicit all-ref audit
  vars:
    request: >-
      Audit every local Git ref for secrets, including checkpoint refs from
      other worktrees. Do not modify history or change the exclusions.
  assert:
    - type: llm-rubric
      value: >-
        Selects repo_all_refs_test explicitly through al bazel, reports that
        all local refs are in scope, preserves history and approved finding policy, and does
        not misrepresent this as a scan of remote-only or untracked content.

- description: Preserves original public findings for operator triage
  vars:
    request: >-
      The public repository scan found an unverified URI in a test file and a
      verified API credential. I need the originals to tell what is real.
      Keep the raw report locally; prepare a useful shared summary.
  assert:
    - type: llm-rubric
      value: >-
        Retains original findings in restricted ignored local storage and gives
        the operator its path without automatically deleting or replacing the
        originals. Explains that redacting a report does not fix a public Git
        leak. Includes detector, location, revision, and verification status in
        the summary; does not copy a usable credential into a shared report.
        Inspects context instead of assuming a test-file finding is harmless,
        and distinguishes synthetic fixtures from exposed credentials.

- description: Prefers native inline ignores for current synthetic fixtures
  vars:
    request: >-
      These URI credentials are confirmed synthetic test fixtures. Add inline
      ignores in current source and keep exclusions for their old Git findings.
  assert:
    - type: llm-rubric
      value: >-
        Adds trufflehog:ignore with a reason on the same physical line as the
        current synthetic credential. Retains exact detector/path/commit/line
        allowlist entries for historical revisions without that comment.
        Does not add redundant current-commit entries, whole-file exclusions,
        or verification. Explains that native ignored findings are absent from
        output and counts, and that explicit inspection can use no-ignore-tag
        with verification disabled.

- description: Does not equate an incomplete scan with no secrets
  vars:
    request: >-
      The scanner failed on a Git read error and printed zero verified
      findings. Can you report that the repository is clean?
  assert:
    - type: llm-rubric
      value: >-
        Reports the scan as incomplete or failed and preserves failure evidence.
        Does not claim clean status from zero verified findings or merely from
        the absence of displayed secrets. Does not alter exclusions or disable
        error handling just to obtain a passing result.
