- description: Requires complete typing and repository validation
  vars:
    request: >-
      Add an async Python API handler with a callback and an optional response
      in this repository. Explain the annotation and validation requirements.
  assert:
    - type: llm-rubric
      value: >-
        Requires type hints for all parameters and return values, including
        async handlers and callbacks, uses precise optional types and None
        returns, and uses repository-pinned tooling through bazel_agent.
        Checks root pyproject.toml and component support rather than assuming the
        Bazel runtime determines the supported source syntax.
- description: Preserves extras and updates generated dependency mappings
  vars:
    request: >-
      The user explicitly approved adding uvicorn[standard] to root Python
      dependencies. Describe the complete repository update workflow.
  assert:
    - type: llm-rubric
      value: >-
        Updates tools/py/pyproject.toml, preserves the standard extra, regenerates
        tools/py/requirements.txt through tools/py:requirements.update, then updates
        the Gazelle Python manifest and runs Gazelle through bazel_agent.
        Reviews generated diffs and validates locks and affected consumers.
        Does not hand-edit generated locks or install into host Python.

- description: Requires namespaced Python imports
  vars:
    request: >-
      Add Pydantic models and a FastAPI query handler. May I use
      from pydantic import BaseModel and from fastapi import Query?
  assert:
    - type: llm-rubric
      value: >-
        Requires import pydantic and import fastapi, qualified references
        pydantic.BaseModel and fastapi.Query, and namespaced module imports
        for standard-library and repository modules as well.
        Allows from package.path import module for module imports and requires
        this form for long paths, retaining qualified member access.
        Uses natural module names without redundant _module suffixes or
        same-name aliases; aliases resolve collisions or ambiguity only.
        Strongly prefers explicit typed __init__.py exports and namespaced
        package APIs over cross-package imports of implementation files.
        Encourages direct symbol imports in __init__.py for public re-exports
        listed in explicit __all__, while prohibiting them in consumer files.

- description: Defaults implementation attributes to private without breaking contracts
  vars:
    request: >-
      Add a recommendation service holding a model and a Pydantic song response.
      How should instance attributes and response fields be exposed?
  assert:
    - type: llm-rubric
      value: >-
        Prefixes implementation state such as _model with an underscore by
        default, uses typed read-only properties for intentional public access,
        and keeps Pydantic serialized fields public with their specified names.
        Preserves established public APIs rather than renaming every member.

- description: Documents modules, declarations, and attributes
  vars:
    request: >-
      Add a Python module with a public model, private helper, async method,
      constructor, constants, module variables, a type alias, and private and
      serialized attributes, including assignments nested in conditionals and
      outside __init__, and aliases using the type statement. What documentation
      is required?
  assert:
    - type: llm-rubric
      value: >-
        Requires a module docstring, including in package __init__.py files,
        and immediate docstrings for all classes, functions, and methods,
        including private helpers, constructors, async methods, and test helpers.
        Requires variable or attribute docstrings as standalone string literals
        immediately after declarations or assignments for constants, variables,
        aliases, and private or serialized fields, including nested assignments
        and attributes assigned outside __init__. Treats incomplete extraction
        support as a tool limitation rather than an exception or a requirement
        to move documentation into the owning class or module docstring. Does
        not move assignments, substitute comments, or claim these strings become
        the assigned value runtime __doc__. Does not edit
        generated or upstream source. Describes purposes,
        boundaries, and meaningful behavior rather than restating identifiers,
        preserves accurate existing docs, and keeps architecture in the README.
